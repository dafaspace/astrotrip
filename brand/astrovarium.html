<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astrovarium - логотип</title>
<style>
@font-face{font-family:'Literata';src:url(../literata-500.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Inter';src:url(../inter-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Inter';src:url(../inter-500.woff2) format('woff2');font-weight:500}
:root{--bg:#100f17;--card:#171520;--line:#332f43;--ink:#e7e6ea;--ink2:#9693a6}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;padding:24px}
h1{font:500 22px Literata,serif;margin:0 0 4px} p.sub{color:var(--ink2);margin:0 0 20px;max-width:900px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.c h2{font:500 15px Inter;margin:0 0 10px}
.lock{display:flex;align-items:center;padding:16px 18px;border-radius:12px;margin-bottom:10px}
.light{background:#f9f7f3;color:#201d18}.dark{background:#100f17;color:#e7e6ea;border:1px solid var(--line)}
.wm{font-family:Literata,serif;font-weight:500;letter-spacing:-.01em;line-height:1}
.light .acc{color:#9d5d25}.dark .acc{color:#bc773a}
.ic{display:block;border-radius:22.5%;overflow:hidden;flex:none}
.row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:#100f17;border:1px solid var(--line)}
.hdr .ver{font:400 11px Inter;color:#827e93;margin-left:4px;align-self:flex-start;margin-top:6px}
</style></head><body>
<h1>Astrovarium</h1>
<p class="sub">Знак тот же: A и V из тригонов на эклиптике, 5° по часовой, пропорции по φ. A от Astro, V от Varium. Надпись Literata, как сейчас. Расстояние между знаком и словом = высота знака / φ², высота знака к высоте заглавных = φ².</p>
<div class="grid" id="g"></div>
<script>
const PHI=(1+Math.sqrt(5))/2;
function mark(size,bg=true){
  const S=1024,C=S/2,R=S/PHI/2,line=R/PHI**6,ring=line/PHI,small=line*PHI/2,big=small*PHI,rot=5;
  const P=d=>{const a=(d+rot-90)*Math.PI/180;return [C+R*Math.cos(a),C+R*Math.sin(a)];};
  let s=`<svg class="ic" width="${size}" height="${size}" viewBox="0 0 ${S} ${S}">`+(bg?`<rect width="${S}" height="${S}" fill="#100f17"/>`:'');
  s+=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#9693a6" stroke-width="${ring}" opacity=".55"/>`;
  [[0,120],[0,240],[180,60],[180,300]].forEach(([a,b])=>{const[x1,y1]=P(a),[x2,y2]=P(b);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#bc773a" stroke-width="${line}" stroke-linecap="round"/>`;});
  [0,120,240,180,60,300].forEach(d=>{const[x,y]=P(d);s+=`<circle cx="${x}" cy="${y}" r="${d%180===0?big:small}" fill="#e7e6ea"/>`;});
  return s+'</svg>';
}
/* Lockup by phi: mark height H, cap height H/phi^2, gap H/phi^2. Literata caps are about 0.7 of the font size. */
function lock(cls,H,word){
  const cap=H/PHI/PHI, fs=cap/0.7, gap=H/PHI/PHI;
  return `<div class="lock ${cls}">${mark(H)}<span class="wm" style="font-size:${fs.toFixed(1)}px;margin-left:${gap.toFixed(1)}px">${word}</span></div>`;
}
const W={a:'Astrovarium',b:'Astro<span class="acc">varium</span>',c:'<span class="acc">A</span>stro<span class="acc">V</span>arium'};
const T={a:'Одним цветом',b:'«varium» цветом акцента',c:'A и V цветом, как в знаке'};
document.getElementById('g').innerHTML=Object.keys(W).map(k=>`<div class="c"><h2>${T[k]}</h2>
  ${lock('light',64,W[k])}${lock('dark',64,W[k])}${lock('light',36,W[k])}</div>`).join('')
 +`<div class="c"><h2>Значок приложения</h2><div class="row">${mark(180)}${mark(120)}${mark(60)}${mark(40)}${mark(29)}</div></div>`
 +`<div class="c"><h2>Шапка приложения</h2><div class="hdr">${mark(30)}<span class="wm" style="font-size:24px"><span class="acc" style="color:#bc773a">A</span>stro<span class="acc" style="color:#bc773a">V</span>arium</span><span class="ver">3.20.0</span></div></div>`;
</script></body></html>
