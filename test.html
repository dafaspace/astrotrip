<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstroTrip - тесты</title>
<style>
body{margin:0;background:#14141a;color:#e8e6e3;font:14px/1.55 -apple-system,system-ui,sans-serif;padding:24px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:#8b8781;font-size:13px;margin:0 0 18px;max-width:88ch}
#sum{font-size:15px;font-weight:600;padding:11px 15px;border-radius:11px;margin-bottom:16px;display:inline-block}
.pass{background:#16351f;color:#7fe0a0;border:1px solid #24512f}
.fail{background:#3a1a1a;color:#ff9b8f;border:1px solid #5c2a26}
.grp{margin:0 0 6px;font-size:11px;letter-spacing:.09em;color:#8b8781;text-transform:uppercase;padding-top:14px}
.t{padding:7px 11px;border-left:3px solid #2a2a33;margin-bottom:3px;background:#191920;border-radius:0 7px 7px 0}
.t.ok{border-left-color:#3f8f5c}
.t.no{border-left-color:#c0574a;background:#231a1a}
.nm{font-size:13px}
.dt{color:#8b8781;font-size:12px;margin-top:3px;white-space:pre-wrap;font-family:ui-monospace,monospace}
iframe{position:absolute;left:-9999px;width:900px;height:1400px}
</style>
<h1>AstroTrip - тесты</h1>
<p class="sub">Проверяется настоящее приложение: index.html грузится в iframe, функции вызываются в его контексте.
Ничего не мокается. Откройте через локальный сервер, не файлом.</p>
<div id="sum">запуск...</div>
<div id="out"></div>
<iframe id="app"></iframe>
<script>
const R=[]; let CUR='';
const group=n=>CUR=n;
function t(name,fn){
  let ok=false,info='';
  try{const r=fn(); if(r===true||r===undefined){ok=true;} else {info=String(r);} }
  catch(e){info='исключение: '+e.message;}
  R.push({g:CUR,name,ok,info});
}
const near=(a,b,tol)=>Math.abs(a-b)<=tol;

// --- контраст ---
const un=h=>{h=h.trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255);};
const lum=r=>{const f=c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4;const[a,b,c]=r.map(f);return .2126*a+.7152*b+.0722*c;};
const cr=(x,y)=>{const[l1,l2]=[lum(un(x)),lum(un(y))].sort((a,b)=>b-a);return (l1+.05)/(l2+.05);};

const frame=document.getElementById('app');
/* Без этого iframe получает копию из кэша service worker, и набор молча
   проверяет прошлую сборку: сломанное приложение проходило все тесты.
   Снимаем worker и кэши, грузим с обходом кэша. */
(async()=>{
  try{
    const rs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(rs.map(r=>r.unregister()));
    const ks=await caches.keys();
    await Promise.all(ks.map(k=>caches.delete(k)));
  }catch(e){}
  /* Read once here, because the runner below is synchronous. */
  try{ SW_SRC=await (await fetch('./sw.js?notacache='+Date.now())).text(); }catch(e){}
  frame.addEventListener('load',()=>setTimeout(run,220));
  frame.src='./index.html?notacache='+Date.now();
})();
let SW_SRC='';

function run(){
  const W=frame.contentWindow, D=frame.contentDocument;
  const ev=s=>W.eval(s);                       // const-объявления не попадают в window
  const css=n=>getComputedStyle(D.documentElement).getPropertyValue(n).trim();
  const setTheme=v=>{D.documentElement.dataset.theme=v;};

  /* ---------- свежесть сборки ---------- */
  group('Сборка');
  t('в iframe загружена текущая сборка, а не копия из кэша',()=>{
    const live=D.documentElement.outerHTML.length;
    return live>50000||`подозрительно мало разметки: ${live} символов`;
  });

  /* ---------- эфемериды ---------- */
  group('Эфемериды');
  const SN=['Ari','Tau','Gem','Cnc','Leo','Vir','Lib','Sco','Sgr','Cap','Aqr','Psc'];
  const dms=l=>{const s=Math.floor(l/30),d=l-s*30;return `${Math.floor(d)}°${String(Math.round((d-Math.floor(d))*60)).padStart(2,'0')}′ ${SN[s]}`;};
  // Свеpено с внешней эфемеридой (см. README): 1990-01-01, 12:00 по Москве.
  const REF={Sun:280.6833,Saturn:285.6333,Uranus:275.7667,Neptune:282.0333,Pluto:227.0833};
  t('1990-01-01 12:00 Москва совпадает с внешним эталоном (допуск 2′)',()=>{
    const ch=ev('computeChart(1990,1,1,12,3,55.75,37.62)');
    const bad=Object.entries(REF).filter(([p,v])=>!near(ch.pos[p].lon,v,2/60))
      .map(([p,v])=>`${p}: ${dms(ch.pos[p].lon)} против эталона ${dms(v)}`);
    return bad.length?bad.join('; '):true;
  });
  /* Видимые геоцентрические долготы на эклиптику даты, JPL Horizons,
     QUANTITIES=31 - ровно та величина, которую считает приложение.
     Это не «как было вчера», а внешняя истина: если движок начнёт врать,
     тест назовёт тело и величину расхождения в секундах дуги. */
  const JPL={
    '1985-11-03 13:37 СПб':['computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)',
      {Sun:220.9525481,Mercury:243.4017088,Venus:202.2638516,Mars:184.2654749,
       Jupiter:308.6764555,Saturn:238.3979717,Uranus:256.0500345,Neptune:271.5696007,
       Moon:103.2036436,Pluto:214.9345982}],
    '2000-01-01 00:00 UTC':['computeChart(2000,1,1,0,0,0,0)',
      {Sun:279.8592049,Mercury:271.1117994,Venus:240.9614017,Mars:327.5754592,
       Jupiter:25.2331157,Saturn:40.4058500,Uranus:314.7840584,Neptune:303.1752420,
       Moon:217.2933209,Pluto:251.4371500}]};
  const arcsec=(a,b)=>Math.abs(((a-b+540)%360)-180)*3600;
  Object.entries(JPL).forEach(([nm,[expr,tight]])=>{
    t('совпадает с JPL Horizons до 2″: '+nm,()=>{
      const ch=ev(expr);
      const bad=Object.entries(tight).map(([p,v])=>[p,arcsec(ch.pos[p].lon,v)])
        .filter(([p,e])=>e>2).map(([p,e])=>`${p} на ${e.toFixed(1)}″`);
      return bad.length?bad.join(', '):true;
    });
  });
  /* Луна и Плутон живут не на VSOP87, а на своих рядах - усечённом ELP82B и
     полиномах, подогнанных к JPL. Прежде это были самые слабые места карты,
     3,7′ и 28′; порог в две секунды выше распространяется и на них, а здесь
     проверяется, что оба ряда вообще подключены и считаются не так, как
     соседи по таблице. */
  t('Луна и Плутон считаются своими рядами, а не приближением',()=>{
    if(typeof ev('MT')==='undefined'||!ev('MT.length')) return 'ряда Луны нет';
    if(ev('MT.length')<500) return 'ряд Луны усечён сильнее ожидаемого: '+ev('MT.length');
    if(!ev('PLNSEG')) return 'полиномов Плутона нет';
    /* вне подогнанного отрезка Плутон обязан оставаться конечным */
    const far=ev('computeChart(2400,1,1,12,0,55.75,37.62)');
    return isFinite(far.pos.Pluto.lon)||'за краем подгонки Плутон уходит в бесконечность';
  });

  /* ---------- устойчивость ---------- */
  group('Устойчивость');
  const EDGE=[[1850,55.75,37.62,'1850 Москва'],[2200,55.75,37.62,'2200 Москва'],
    [2000,69.6,18.9,'69°N Тромсё'],[2000,78.2,15.6,'78°N Шпицберген'],
    [2000,-33.9,151.2,'южное полушарие'],[2000,0,0,'экватор, нулевой меридиан']];
  EDGE.forEach(([y,lat,lon,nm])=>{
    t('карта строится: '+nm,()=>{
      const ch=ev(`computeChart(${y},6,15,12,0,${lat},${lon})`);
      const nan=Object.entries(ch.pos).filter(([k,v])=>!isFinite(v.lon)).map(([k])=>k);
      if(nan.length) return 'нечисловые долготы: '+nan.join(',');
      if(!isFinite(ch.asc)||!isFinite(ch.mc)) return 'asc или mc нечисловые';
      if(ch.houses.cusps.length!==12) return 'куспидов не 12';
      if(ch.houses.cusps.some(c=>!isFinite(c))) return 'нечисловой куспид';
      if(new Set(ch.houses.cusps.map(c=>c.toFixed(2))).size!==12) return 'куспиды совпадают';
      return true;
    });
  });
  t('за полярным кругом откат на равнодомную систему',()=>{
    const ch=ev('computeChart(2000,6,15,12,0,78.2,15.6)');
    return ch.houses.system==='equal'||('система: '+ch.houses.system);
  });
  t('аспекты к узлам вычисляются',()=>{   // когда-то не вычислялись вовсе
    const ch=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)');
    W.__ch=ch;
    const a=ev('aspectsInvolving(window.__ch,"NNode")');
    if(!a.length) return 'ни одного аспекта к Северному узлу';
    if(a.some(x=>x.p2==='SNode')) return 'учтена тривиальная оппозиция узлов';
    return true;
  });

  /* ---------- системы домов ---------- */
  group('Системы домов');
  const SYS=Object.keys(ev('HOUSE_SYSTEMS'));
  t('доступны шесть систем',()=>SYS.length===6||SYS.join(', '));
  t('квадрантные системы ставят 1-й дом на Асцендент и 10-й на Меридиан',()=>{
    const bad=[];
    ['placidus','regiomontanus','campanus','porphyry'].forEach(k=>{
      ev(`HSYS=${JSON.stringify(k)}`);
      const c=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)');
      const d=(a,b)=>Math.abs(((a-b+540)%360)-180);
      if(d(c.houses.cusps[0],c.asc)>0.001) bad.push(k+': 1-й дом не Асцендент');
      if(d(c.houses.cusps[9],c.mc)>0.001) bad.push(k+': 10-й дом не Меридиан');
    });
    return !bad.length||bad.join('; ');
  });
  t('куспиды идут по кругу без пересечений во всех системах',()=>{
    const bad=[];
    SYS.forEach(k=>{ev(`HSYS=${JSON.stringify(k)}`);
      const c=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)').houses.cusps;
      if(!c.every((v,i)=>((c[(i+1)%12]-v+360)%360)>0.001)) bad.push(k);});
    return !bad.length||'нарушено в: '+bad.join(', ');
  });
  t('на экваторе квадрантные системы совпадают между собой',()=>{
    const got={};
    ['placidus','regiomontanus','campanus'].forEach(k=>{ev(`HSYS=${JSON.stringify(k)}`);
      got[k]=ev('computeChart(2000,6,15,12,0,0.0001,0)').houses.cusps;});
    const base=got.placidus;
    const bad=Object.entries(got).filter(([k,v])=>
      v.some((x,i)=>Math.abs(((x-base[i]+540)%360)-180)>0.01)).map(([k])=>k);
    return !bad.length||'расходятся: '+bad.join(', ');
  });
  t('цельнознаковая ставит 1-й дом в начало знака Асцендента',()=>{
    ev('HSYS="whole"');
    const c=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)');
    return c.houses.cusps[0]===Math.floor(c.asc/30)*30||`${c.houses.cusps[0]} при Асценденте ${c.asc.toFixed(2)}`;
  });
  t('за полярным кругом Плацидус отступает на равнодомную',()=>{
    ev('HSYS="placidus"');
    return ev('computeChart(2000,6,15,12,0,78.2,15.6)').houses.system==='equal'||'не отступил';
  });
  t('выбор системы сохраняется и восстанавливается',()=>{
    const k='astrarium_hsys', saved=W.localStorage.getItem(k);
    W.localStorage.setItem(k,'campanus');
    const ok=ev(`Object.keys(HOUSE_SYSTEMS).includes(localStorage.getItem('${k}'))`);
    saved===null?W.localStorage.removeItem(k):W.localStorage.setItem(k,saved);
    return ok||'значение не признаётся';
  });
  ev('HSYS="placidus"');

  /* ---------- разбор ---------- */
  group('Разбор карты');
  const ch=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)');
  W.__c=ch;
  const order=ev('CARD_ORDER');
  const cards=order.map(p=>ev(`composePlacement(window.__c,${JSON.stringify(p)})`)).filter(Boolean);
  const texts=cards.map(c=>c.detail)
    .concat([ev('composeFirstImpr(window.__c)').detail, ev('composePortrait(window.__c)').detail]);
  const all=texts.join(' ');

  t('строятся все 14 карточек, включая Лилит и Селену',()=>
    cards.length===14||`карточек ${cards.length}`);
  t('в тексте нет длинных тире',()=>
    !all.includes('—')||'найдено '+(all.split('—').length-1));
  t('нет оборота «то, как вы»',()=>
    !/то, как вы/.test(all)||'оборот вернулся');
  t('нет висячих «этому» и «своё»',()=>{
    const m=all.match(/\bэтому\b|\bсвоё\b(?!\s+\S)/g);
    return !m||'найдено: '+[...new Set(m)].join(', ');
  });
  t('нет выдуманных сроков в советах',()=>{
    const m=all.match(/полгода|на неделю\b|в день\b|вдвое\b|один вдох/g);
    return !m||'найдено: '+[...new Set(m)].join(', ');
  });
  t('внутри карточки предложения не повторяются',()=>{
    const bad=[];
    cards.forEach(c=>{const s=c.detail.split(/(?<=[.?!])\s+/).map(x=>x.trim());
      const seen=new Set(); s.forEach(x=>{if(x.length>40&&seen.has(x))bad.push(c.label);seen.add(x);});});
    return !bad.length||'повторы в: '+[...new Set(bad)].join('; ');
  });
  t('соседние предложения не начинаются одинаково',()=>{
    const bad=[];
    cards.forEach(c=>{const s=c.detail.split(/(?<=[.?!])\s+/).map(x=>x.trim().split(' ').slice(0,2).join(' '));
      for(let i=0;i<s.length-1;i++) if(s[i]===s[i+1]) bad.push(`${c.label}: «${s[i]}»`);});
    return !bad.length||bad.join('; ');
  });
  t('согласование числа в первой фразе карточки',()=>{
    const bad=cards.filter(c=>/^Ваши \S+ (работает|действует|проявляется)\b/.test(c.detail)
      ||/^Ваш[ае]? \S+ (работают|действуют|проявляются)\b/.test(c.detail)).map(c=>c.label);
    return !bad.length||bad.join('; ');
  });
  t('парные разборы покрывают все возможные сочетания',()=>{
    const PT=ev('PAIR_TEXT'), ASP=ev('ASPECTS').map(a=>a.name);
    const P=order.slice(0,10);
    // невозможны астрономически: Меркурий и Венера не отходят от Солнца далеко,
    // Нептун с Плутоном не дают соединения и оппозиции в 1900-2100
    const skip=new Set(['Sun|Mercury','Sun|Venus'].flatMap(k=>ASP.filter(a=>a!=='conjunction').map(a=>k+'|'+a))
      .concat(['Mercury|Venus'].flatMap(k=>['square','trine','opposition'].map(a=>k+'|'+a)))
      .concat(['Neptune|Pluto|conjunction','Neptune|Pluto|opposition']));
    const miss=[];
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const k=ev(`pairKey(${JSON.stringify(P[i])},${JSON.stringify(P[j])})`);
      ASP.forEach(a=>{ if(skip.has(k+'|'+a))return;
        if(!PT[k]||!PT[k][a]) miss.push(k+' '+a); });
    }
    return !miss.length||`не хватает ${miss.length}: ${miss.slice(0,4).join(', ')}...`;
  });
  t('у каждой точки есть короткое подлежащее',()=>{
    const N=ev('PLANET_NOUN');
    const miss=order.filter(p=>!N[p]);
    return !miss.length||'нет у: '+miss.join(', ');
  });

  /* ---------- библиотека карт ---------- */
  group('Библиотека карт');
  const LIB=ev('CHART_LIBRARY');
  t('пятьсот карт: 307 кинокомпозиторов и 193 классика',()=>{
    if(LIB.length!==500) return `записей ${LIB.length}`;
    const f=LIB.filter(e=>e.k==='f').length, c=LIB.filter(e=>e.k==='c').length;
    return (f===307&&c===193)||`кино ${f}, классика ${c}`;
  });
  /* Выборка нужна ради статистики, а её потолок задают не карты, а независимые
     даты: у ровесников медленные планеты стоят одинаково не по своей воле. */
  t('в пятистах картах не меньше 170 разных лет рождения',()=>{
    const y=new Set(LIB.map(e=>e.y)).size;
    return y>=170||`разных лет всего ${y}`;
  });
  t('после 1900 года у каждой записи есть часовой пояс',()=>{
    const bad=LIB.filter(e=>e.y>=1900&&!e.z).map(e=>e.id);
    return !bad.length||'без зоны: '+bad.join(', ');
  });
  t('идентификаторы не повторяются',()=>{
    const ids=LIB.map(e=>e.id), dup=ids.filter((x,i)=>ids.indexOf(x)!==i);
    return !dup.length||'повторы: '+[...new Set(dup)].join(', ');
  });
  t('у умерших есть дата смерти, у живых её нет',()=>{
    const bad=LIB.filter(e=>e.dd&&!/^\d{4}-\d{2}-\d{2}$/.test(e.dd)).map(e=>e.id);
    if(bad.length) return 'кривая дата: '+bad.join(', ');
    /* родившийся до 1910 года и без даты смерти - почти наверняка пропуск */
    const suspect=LIB.filter(e=>!e.dd&&e.y<1910).map(e=>e.id);
    return !suspect.length||'нет даты смерти у: '+suspect.join(', ');
  });
  /* Часовой пояс не пишется рукой: до 1900 это местное среднее время места,
     после - база tz через Intl. Проверяем именно её ответы, потому что
     полдюжины записей попадают в исторические ловушки (Британия 1968-1971
     круглый год на летнем времени, ФРГ без перевода часов до 1980). */
  /* Инвариант, а не год: libTz обязана вернуть либо стандартный пояс, кратный
     четверти часа, либо местное среднее время самого места рождения. Третьего
     быть не должно. Прежняя формулировка требовала стандартного пояса после
     1900 года и была неверна: Варшава жила по своему среднему времени до 1915,
     Париж до 1911, Тбилиси до 1924 - и база tz честно об этом сообщает. */
  t('часовой пояс - либо стандартный, либо местное среднее время места',()=>{
    const bad=[];
    LIB.forEach(e=>{
      W.__e=e; const off=ev('libTz(window.__e)');
      if(!isFinite(off)||Math.abs(off)>14){ bad.push(e.id+': '+off); return; }
      const standard=Math.abs(off*60-Math.round(off*60/15)*15)<0.01;
      const lmt=Math.abs(off-e.lon/15)<0.02;
      if(!standard&&!lmt) bad.push(`${e.id}: ${off.toFixed(2)} - ни пояс, ни среднее время (${(e.lon/15).toFixed(2)})`);
    });
    return !bad.length||bad.slice(0,4).join('; ');
  });
  /* Пять карт от 1685 до 1984, сверенные с JPL Horizons для того самого
     мгновения, которое даёт libTz. Тест смотрит не на движок - его проверяют
     выше, - а на связку «дата плюс место плюс часовой пояс»: если местное
     среднее время или база tz поедут, ошибка выйдет минутами и градусами,
     а не секундами дуги. Порядок записей не важен, ищем по id. */
  const LIBREF={
    bach:{Sun:11.3529086,Mercury:349.5194988,Venus:347.9614241,Mars:251.0585966,Jupiter:198.4690757,Saturn:161.7711134,Uranus:34.8617800,Neptune:333.1049124},
    tchaikov:{Sun:46.8037580,Mercury:20.5651463,Venus:25.6556136,Mars:46.1418948,Jupiter:223.5397952,Saturn:260.6658416,Uranus:349.4462950,Neptune:314.8112282},
    stravinsky:{Sun:86.0524315,Mercury:101.2149842,Venus:115.4610747,Mars:142.1723633,Jupiter:72.9761627,Saturn:50.8546907,Uranus:164.7197808,Neptune:47.7308430},
    zimmer:{Sun:169.4056069,Mercury:164.4025091,Venus:207.8717566,Mars:172.4397902,Jupiter:187.1657179,Saturn:248.4726522,Uranus:129.8291451,Neptune:210.8222211},
    goransson:{Sun:159.1377138,Mercury:152.2534260,Venus:180.2503355,Mars:248.1867592,Jupiter:273.1358031,Saturn:221.6649239,Uranus:249.6194046,Neptune:268.6738879}};
  t('карты библиотеки совпадают с JPL Horizons до 4″',()=>{
    const bad=[];
    Object.entries(LIBREF).forEach(([id,ref])=>{
      const e=LIB.find(x=>x.id===id);
      if(!e){ bad.push(id+': записи нет'); return; }
      W.__e=e; const hh=e.t==null?12:e.t;
      const ch=ev(`computeChart(${e.y},${e.mo},${e.d},${hh},libTz(window.__e),${e.lat},${e.lon})`);
      Object.entries(ref).forEach(([p,v])=>{
        const err=arcsec(ch.pos[p].lon,v);
        if(err>4) bad.push(`${id}/${p} на ${err<120?err.toFixed(1)+'″':(err/60).toFixed(1)+'′'}`);
      });
    });
    return !bad.length||bad.slice(0,4).join(', ');
  });
  t('библиотека идёт по возрастанию даты',()=>{
    const k=e=>e.y*10000+e.mo*100+e.d;
    const bad=LIB.slice(1).map((e,i)=>k(LIB[i])<=k(e)?null:`${LIB[i].id} перед ${e.id}`).filter(Boolean);
    return !bad.length||bad.join('; ');
  });
  t('каждая карта библиотеки строится и даёт разбор',()=>{
    const bad=[];
    LIB.forEach(e=>{
      try{
        const hh=e.t==null?12:e.t;
        W.__e=e;
        const ch=ev(`computeChart(${e.y},${e.mo},${e.d},${hh},libTz(window.__e),${e.lat},${e.lon})`);
        if(Object.values(ch.pos).some(p=>!isFinite(p.lon))) {bad.push(e.id+': нечисловые долготы');return;}
        if(ch.houses.cusps.some(c=>!isFinite(c))) {bad.push(e.id+': нечисловой куспид');return;}
        W.__ch2=ch;
        const r=ev('composePlacement(window.__ch2,"Sun")');
        if(!r||!r.detail||r.detail.length<80) bad.push(e.id+': пустой разбор');
        const p=ev('composePortrait(window.__ch2)');
        if(!p||!p.detail) bad.push(e.id+': нет портрета');
      }catch(err){ bad.push(e.id+': '+err.message); }
    });
    return !bad.length||bad.join('; ');
  });
  t('все системы домов работают на всех картах библиотеки',()=>{
    const bad=[];
    SYS.forEach(k=>{ ev(`HSYS=${JSON.stringify(k)}`);
      LIB.forEach(e=>{
        const hh=e.t==null?12:e.t; W.__e=e;
        const c=ev(`computeChart(${e.y},${e.mo},${e.d},${hh},libTz(window.__e),${e.lat},${e.lon})`).houses.cusps;
        if(c.some(x=>!isFinite(x))) bad.push(`${k}/${e.id}`);
        else if(!c.every((v,i)=>((c[(i+1)%12]-v+360)%360)>0.001)) bad.push(`${k}/${e.id}: порядок`);
      }); });
    ev('HSYS="placidus"');
    return !bad.length||bad.slice(0,5).join('; ');
  });
  t('качество текста держится на всех картах, не только на тестовой',()=>{
    const bad=[];
    LIB.forEach(e=>{
      const hh=e.t==null?12:e.t; W.__e=e;
      ev(`window.__ch3=computeChart(${e.y},${e.mo},${e.d},${hh},libTz(window.__e),${e.lat},${e.lon})`);
      const cards=ev('CARD_ORDER.map(p=>composePlacement(window.__ch3,p)).filter(Boolean)');
      const txt=cards.map(c=>c.detail).join(' ');
      if(txt.includes('—')) bad.push(e.id+': длинное тире');
      if(/то, как вы/.test(txt)) bad.push(e.id+': оборот');
      if(/\bэтому\b/.test(txt)) bad.push(e.id+': висячее «этому»');
      cards.forEach(c=>{
        const ss=c.detail.split(/(?<=[.?!])\s+/).map(x=>x.trim());
        const seen=new Set();
        ss.forEach(x=>{ if(x.length>40&&seen.has(x)) bad.push(`${e.id}/${c.label}: повтор`); seen.add(x); });
        for(let i=0;i<ss.length-1;i++){
          const a=ss[i].split(' ').slice(0,2).join(' ');
          if(a===ss[i+1].split(' ').slice(0,2).join(' ')) bad.push(`${e.id}/${c.label}: «${a}» дважды`);
        }
      });
    });
    return !bad.length||`${bad.length} замечаний: `+bad.slice(0,3).join('; ');
  });

  t('свои карты сохраняются, переживают перезагрузку и удаляются',()=>{
    const K='astrarium_charts';
    const backup=W.localStorage.getItem(K);
    try{
      W.localStorage.removeItem(K); ev('renderLibrary()');
      const base=D.querySelectorAll('#libList .libitem').length;
      /* Assigning .value fires nothing, typing fires input, and the save
         button is enabled off input - so a test that only assigns would find
         it disabled and click a dead button. City is assigned rather than
         typed: typing there opens the suggestion list, which would overwrite
         the coordinates set on the next line. */
      const set=(id,v)=>{const el=D.getElementById(id); el.value=v;
        if(id==='date'||id==='time') el.dispatchEvent(new W.Event('input',{bubbles:true}));};
      set('date','1985-11-03'); set('time','13:37'); set('lat','59.9343');
      set('lng','30.3351'); set('tz','+03:00'); set('city','Санкт-Петербург');
      set('chartName','я');
      D.getElementById('saveChart').click();
      if(D.querySelectorAll('#libList .libitem').length!==base+1) return 'строка не появилась';
      const stored=JSON.parse(W.localStorage.getItem(K)||'[]');
      if(stored.length!==1) return 'в хранилище '+stored.length;
      if(stored[0].name!=='я') return 'имя не сохранилось: '+stored[0].name;
      if(Math.abs(stored[0].t-13.6167)>0.01) return 'время не сохранилось: '+stored[0].t;
      if(D.getElementById('chartName').value!=='') return 'поле имени не очистилось';
      // имя не должно дублироваться местом
      const row=D.querySelector('#libList .libitem[data-own="1"]').textContent;
      if((row.match(/Санкт-Петербург/g)||[]).length>1) return 'город продублирован';
      // загрузка обратно
      set('date',''); D.querySelector('#libList .libitem[data-own="1"]').click();
      if(D.getElementById('date').value!=='1985-11-03') return 'не загрузилась обратно';
      // удаление
      D.querySelector('#libList .libdel').click();
      if(JSON.parse(W.localStorage.getItem(K)||'[]').length!==0) return 'не удалилась';
      return true;
    } finally {
      backup===null?W.localStorage.removeItem(K):W.localStorage.setItem(K,backup);
      ev('renderLibrary()');
    }
  });
  t('карта без имени берёт название города и не повторяет его',()=>{
    const K='astrarium_charts', backup=W.localStorage.getItem(K);
    try{
      W.localStorage.removeItem(K); ev('renderLibrary()');
      /* Assigning .value fires nothing, typing fires input, and the save
         button is enabled off input - so a test that only assigns would find
         it disabled and click a dead button. City is assigned rather than
         typed: typing there opens the suggestion list, which would overwrite
         the coordinates set on the next line. */
      const set=(id,v)=>{const el=D.getElementById(id); el.value=v;
        if(id==='date'||id==='time') el.dispatchEvent(new W.Event('input',{bubbles:true}));};
      set('date','1990-06-15'); set('time','08:20'); set('lat','55.75');
      set('lng','37.62'); set('tz','+03:00'); set('city','Москва'); set('chartName','');
      D.getElementById('saveChart').click();
      const e=JSON.parse(W.localStorage.getItem(K))[0];
      if(e.name!=='Москва') return 'имя: '+e.name;
      const row=D.querySelector('#libList .libitem[data-own="1"]').textContent;
      return (row.match(/Москва/g)||[]).length===1||'город показан дважды';
    } finally {
      backup===null?W.localStorage.removeItem(K):W.localStorage.setItem(K,backup);
      ev('renderLibrary()');
    }
  });

  /* ---------- контраст ---------- */
  group('Контраст');
  const TEXT=[['основной','--ink','--paper'],['текст на карточке','--ink','--paper2'],
    ['вторичный','--ink2','--paper2'],['подписи','--ink3','--paper2'],
    ['подписи на фоне','--ink3','--paper'],['ссылка','--accent','--paper2'],
    ['текст кнопки','--accentInk','--accentBtn']];
  ['light','dark'].forEach(th=>{
    const nm=th==='light'?'светлая':'тёмная';
    t(`${nm}: текст проходит 4.5:1`,()=>{
      setTheme(th);
      const bad=TEXT.map(([n,a,b])=>[n,cr(css(a),css(b))]).filter(([n,v])=>v<4.5)
        .map(([n,v])=>`${n} ${v.toFixed(2)}`);
      return !bad.length||bad.join('; ');
    });
    t(`${nm}: линии карты проходят 3:1 к фону колеса`,()=>{
      setTheme(th);
      const wb=css('--wheelbg');
      const bad=['hard','harm','conj','axis','mc'].map(k=>[k,cr(css('--'+k),wb)])
        .filter(([k,v])=>v<3).map(([k,v])=>`${k} ${v.toFixed(2)}`);
      return !bad.length||bad.join('; ');
    });
    t(`${nm}: глифы поверх секторов проходят 4.5:1`,()=>{
      setTheme(th);
      const ink=css('--ink');
      const bad=['fire','earth','air','water'].map(k=>[k,cr(ink,css('--'+k))])
        .filter(([k,v])=>v<4.5).map(([k,v])=>`${k} ${v.toFixed(2)}`);
      return !bad.length||bad.join('; ');
    });
    t(`${nm}: оси MC и гармоничных аспектов различимы`,()=>{
      setTheme(th);
      return css('--mc')!==css('--harm')||'одинаковый цвет '+css('--mc');
    });
  });

  /* ---------- интерфейс ---------- */
  group('Интерфейс');
  // строим карту в приложении: часть проверок смотрит на отрисованный SVG
  D.getElementById('date').value='1985-11-03';
  D.getElementById('time').value='13:37';
  D.getElementById('lat').value='59.9343';
  D.getElementById('lng').value='30.3351';
  D.getElementById('tz').value='+03:00';
  D.getElementById('calc').click();
  t('секторы рисуются без прозрачности',()=>{   // из-за неё цвета были блёклыми
    const p=[...D.querySelectorAll('#wheel path[fill-opacity]')]
      .filter(x=>/--(fire|earth|air|water)/.test(x.getAttribute('fill')));
    if(!p.length) return 'секторы не найдены, карта не построена?';
    const o=[...new Set(p.map(x=>x.getAttribute('fill-opacity')))];
    return (o.length===1&&o[0]==='1')||'прозрачность: '+o.join(',');
  });
  t('переключатели одной высоты',()=>{
    const th=D.getElementById('themeSw');
    const lg=[...D.querySelectorAll('.lang')].find(x=>x!==th);
    if(!th||!lg) return 'переключатель не найден';
    const a=th.getBoundingClientRect().height, b=lg.getBoundingClientRect().height;
    return Math.abs(a-b)<1.5||`${a.toFixed(1)} против ${b.toFixed(1)}`;
  });
  t('смена темы не ломает язык',()=>{           // ровно этот баг был внесён
    const before=ev('LANG');
    D.querySelector('#themeSw button[data-theme-set="light"]').click();
    D.querySelector('#themeSw button[data-theme-set="dark"]').click();
    const after=ev('LANG');
    return after===before||`язык стал «${after}» вместо «${before}»`;
  });
  t('испорченный язык в хранилище не ломает приложение',()=>{
    const saved=W.localStorage.getItem('astrarium_lang');
    W.localStorage.setItem('astrarium_lang','undefined');
    const ok=ev("['ru','en'].includes(localStorage.getItem('astrarium_lang')) ? localStorage.getItem('astrarium_lang') : 'ru'")==='ru';
    saved===null?W.localStorage.removeItem('astrarium_lang'):W.localStorage.setItem('astrarium_lang',saved);
    return ok||'валидация не срабатывает';
  });
  t('таблица позиций свёрнута по умолчанию',()=>{
    const f=D.querySelector('details.fold');
    return (f&&!f.open)||'развёрнута или отсутствует';
  });
  /* The library is how you avoid filling the form, so it has to be reachable
     before a chart exists. It once sat inside the results block, which is
     hidden until the first cast, and so could not be opened at all. */
  t('библиотека доступна до первого расчёта',()=>{
    const card=D.getElementById('libCard');
    if(!card) return 'блока нет';
    if(card.closest('#results')) return 'спрятан внутри результатов';
    return card.getBoundingClientRect().height>0 || 'нулевая высота';
  });
  /* If these drift apart the number on screen names one release while the
     cache serves another, which is exactly the confusion it exists to end. */
  t('номер версии на экране совпадает с именем кэша в sw.js',()=>{
    const v=ev('APP_VERSION');
    if(!v) return 'APP_VERSION не объявлен';
    if(D.getElementById('ver').textContent!==v) return 'в заголовке не тот номер';
    if(!SW_SRC) return 'sw.js не прочитан';
    const m=SW_SRC.match(/CACHE\s*=\s*'([^']+)'/);
    if(!m) return 'CACHE в sw.js не найден';
    return m[1]==='astrotrip-v'+v || 'кэш '+m[1]+' против версии '+v;
  });
  t('на пустой форме кнопка сохранения выключена',()=>{
    const d=D.getElementById('date').value, tm=D.getElementById('time').value;
    const b=D.getElementById('saveChart');
    ev("['date','time'].forEach(i=>{document.getElementById(i).value='';});syncSaveBtn()");
    const off=b.disabled;
    ev(`document.getElementById('date').value=${JSON.stringify(d)};`
      +`document.getElementById('time').value=${JSON.stringify(tm)};syncSaveBtn()`);
    return off || 'кнопка активна, но нажатие ничего не делает';
  });

  render();
}

function render(){
  const bad=R.filter(x=>!x.ok);
  const s=document.getElementById('sum');
  s.className=bad.length?'fail':'pass';
  s.textContent=bad.length?`${bad.length} из ${R.length} не прошли`:`все ${R.length} прошли`;
  let h='',g='';
  R.forEach(x=>{ if(x.g!==g){g=x.g;h+=`<div class="grp">${g}</div>`;}
    h+=`<div class="t ${x.ok?'ok':'no'}"><div class="nm">${x.ok?'✓':'✗'} ${x.name}</div>`
      +(x.info?`<div class="dt">${x.info}</div>`:'')+`</div>`;});
  document.getElementById('out').innerHTML=h;
}
</script>
