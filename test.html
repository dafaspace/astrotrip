<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstroTrip - тесты</title>
<style>
body{margin:0;background:#14141a;color:#e8e6e3;font:14px/1.55 -apple-system,system-ui,sans-serif;padding:24px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:#8b8781;font-size:13px;margin:0 0 18px;max-width:88ch}
#sum{font-size:15px;font-weight:600;padding:11px 15px;border-radius:11px;margin-bottom:16px;display:inline-block}
.pass{background:#16351f;color:#7fe0a0;border:1px solid #24512f}
.fail{background:#3a1a1a;color:#ff9b8f;border:1px solid #5c2a26}
.grp{margin:0 0 6px;font-size:11px;letter-spacing:.09em;color:#8b8781;text-transform:uppercase;padding-top:14px}
.t{padding:7px 11px;border-left:3px solid #2a2a33;margin-bottom:3px;background:#191920;border-radius:0 7px 7px 0}
.t.ok{border-left-color:#3f8f5c}
.t.no{border-left-color:#c0574a;background:#231a1a}
.nm{font-size:13px}
.dt{color:#8b8781;font-size:12px;margin-top:3px;white-space:pre-wrap;font-family:ui-monospace,monospace}
iframe{position:absolute;left:-9999px;width:900px;height:1400px}
</style>
<h1>AstroTrip - тесты</h1>
<p class="sub">Проверяется настоящее приложение: index.html грузится в iframe, функции вызываются в его контексте.
Ничего не мокается. Откройте через локальный сервер, не файлом.</p>
<div id="sum">запуск...</div>
<div id="out"></div>
<iframe id="app"></iframe>
<script>
const R=[]; let CUR='';
const group=n=>CUR=n;
function t(name,fn){
  let ok=false,info='';
  try{const r=fn(); if(r===true||r===undefined){ok=true;} else {info=String(r);} }
  catch(e){info='исключение: '+e.message;}
  R.push({g:CUR,name,ok,info});
}
const near=(a,b,tol)=>Math.abs(a-b)<=tol;

// --- контраст ---
const un=h=>{h=h.trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255);};
const lum=r=>{const f=c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4;const[a,b,c]=r.map(f);return .2126*a+.7152*b+.0722*c;};
const cr=(x,y)=>{const[l1,l2]=[lum(un(x)),lum(un(y))].sort((a,b)=>b-a);return (l1+.05)/(l2+.05);};

const frame=document.getElementById('app');
/* Без этого iframe получает копию из кэша service worker, и набор молча
   проверяет прошлую сборку: сломанное приложение проходило все тесты.
   Снимаем worker и кэши, грузим с обходом кэша. */
(async()=>{
  try{
    const rs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(rs.map(r=>r.unregister()));
    const ks=await caches.keys();
    await Promise.all(ks.map(k=>caches.delete(k)));
  }catch(e){}
  /* The app persists its preferences, and this browser carries whatever was
     last switched on by hand. Cleared before the iframe loads so the suite
     tests a fresh install: the ring mode, the orbs and the chosen partner have
     each already made a run behave differently from a real first launch. */
  try{ ['astrarium_ring','astrarium_orbs','astrarium_partner'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
  /* Read once here, because the runner below is synchronous. */
  try{ SW_SRC=await (await fetch('./sw.js?notacache='+Date.now())).text(); }catch(e){}
  /* The city atlas is fetched after first paint, so the run waits for it -
     otherwise the atlas tests would silently check the inline seed instead and
     pass on the wrong data. Capped, because a failed fetch must still let the
     other ninety tests report. */
  frame.addEventListener('load',()=>setTimeout(async()=>{
    const W=frame.contentWindow;
    try{ W.eval('atlasLoad()'); }catch(e){}
    for(let i=0;i<200;i++){
      let st=''; try{ st=W.eval('ATLAS.state'); }catch(e){}
      if(st==='ready') break;
      await new Promise(r=>setTimeout(r,100));
    }
    /* Two things the synchronous runner cannot measure itself. Both drive the
       real loader; neither leaves the atlas unloaded. */
    try{ ATLAS_REAL_BYTES=(await (await fetch('./cities.txt?probe='+Date.now())).arrayBuffer()).byteLength; }catch(e){}
    try{ ATLAS_BAR=await W.eval(`(async()=>{
      const real=await (await fetch('./cities.txt')).arrayBuffer();
      const bytes=new Uint8Array(real), orig=window.fetch;
      let off=0, step=Math.ceil(bytes.length/20);
      window.fetch=(u,o)=>String(u).includes('cities.txt')?Promise.resolve(new Response(
        new ReadableStream({async pull(c){
          if(off>=bytes.length){c.close();return;}
          await new Promise(r=>setTimeout(r,40));
          c.enqueue(bytes.slice(off,off+step)); off+=step;
        }}),{status:200})):orig(u,o);
      ATLAS_GEN++; ATLAS.state='idle';
      atlasLoad();
      const widths=[]; let everShown=false;
      for(let i=0;i<80;i++){
        const b=document.getElementById('atlasBar');
        if(!b.hidden){ everShown=true; widths.push(parseInt(document.getElementById('atlasFill').style.width)||0); }
        if(ATLAS.state==='ready') break;
        await new Promise(r=>setTimeout(r,60));
      }
      window.fetch=orig;
      return {everShown, max:Math.max(0,...widths),
        rising:widths.length>2&&widths[widths.length-1]>widths[0],
        hidden:document.getElementById('atlasBar').hidden, state:ATLAS.state};
    })()`); }catch(e){}
    try{ ATLAS_FAIL=await W.eval(`(async()=>{
      const orig=window.fetch;
      window.fetch=(u,o)=>String(u).includes('cities.txt')?Promise.resolve(new Response('',{status:503})):orig(u,o);
      ATLAS_GEN++; ATLAS.state='idle';
      atlasLoad(true);
      await new Promise(r=>setTimeout(r,250));
      const out={explained:document.getElementById('atlasMsg').textContent===t('atlasFail'),
        retry:!document.getElementById('atlasRetry').hidden,
        seedWorks:(searchCities('Москва')[0]||{}).e};
      window.fetch=orig;
      document.getElementById('atlasRetry').click();
      for(let i=0;i<60;i++){ if(ATLAS.state==='ready') break; await new Promise(r=>setTimeout(r,100)); }
      out.recovered=ATLAS.state;
      return out;
    })()`); }catch(e){}
    /* The app now opens with an empty outer ring, which is the right default
       and leaves most of this suite with no bi-wheel to look at. The default is
       recorded here, before anything touches it, and the ring is then filled so
       the rest of the checks have two rings to measure. */
    try{ DEFAULT_RING=await W.eval('RING_MODE'); }catch(e){}
    /* The app persists the orb settings, and this browser may carry whatever
       was last switched on by hand. The suite tests the shipped default, so it
       is set explicitly here; the aspect tests flip things themselves and put
       them back. Found the hard way: the whole run behaved differently because
       the minors had been left on in this profile an hour earlier. */
    try{ await W.eval(`ASPECT_DEFS.forEach(a=>{ORBS[a.name].on=!a.minor;ORBS[a.name].orb=a.orb;});rebuildAspects();renderOrbs();`); }catch(e){}
    try{ await W.eval(`(async()=>{
      RING_MODE='transit'; renderRingSwitch(); if(CURRENT) renderTransits(CURRENT);
    })()`); }catch(e){}
    run();
  },220));
  frame.src='./index.html?notacache='+Date.now();
})();
let SW_SRC='', ATLAS_REAL_BYTES=null, ATLAS_BAR=null, ATLAS_FAIL=null, DEFAULT_RING=null;

function run(){
  const W=frame.contentWindow, D=frame.contentDocument;
  const ev=s=>W.eval(s);                       // const-объявления не попадают в window
  const css=n=>getComputedStyle(D.documentElement).getPropertyValue(n).trim();
  const setTheme=v=>{D.documentElement.dataset.theme=v;};

  /* ---------- свежесть сборки ---------- */
  group('Сборка');
  t('в iframe загружена текущая сборка, а не копия из кэша',()=>{
    const live=D.documentElement.outerHTML.length;
    return live>50000||`подозрительно мало разметки: ${live} символов`;
  });

  /* ---------- эфемериды ---------- */
  group('Эфемериды');
  const SN=['Ari','Tau','Gem','Cnc','Leo','Vir','Lib','Sco','Sgr','Cap','Aqr','Psc'];
  const dms=l=>{const s=Math.floor(l/30),d=l-s*30;return `${Math.floor(d)}°${String(Math.round((d-Math.floor(d))*60)).padStart(2,'0')}′ ${SN[s]}`;};
  // Свеpено с внешней эфемеридой (см. README): 1990-01-01, 12:00 по Москве.
  const REF={Sun:280.6833,Saturn:285.6333,Uranus:275.7667,Neptune:282.0333,Pluto:227.0833};
  t('1990-01-01 12:00 Москва совпадает с внешним эталоном (допуск 2′)',()=>{
    const ch=ev('computeChart(1990,1,1,12,3,55.75,37.62)');
    const bad=Object.entries(REF).filter(([p,v])=>!near(ch.pos[p].lon,v,2/60))
      .map(([p,v])=>`${p}: ${dms(ch.pos[p].lon)} против эталона ${dms(v)}`);
    return bad.length?bad.join('; '):true;
  });
  /* Видимые геоцентрические долготы на эклиптику даты, JPL Horizons,
     QUANTITIES=31 - ровно та величина, которую считает приложение.
     Это не «как было вчера», а внешняя истина: если движок начнёт врать,
     тест назовёт тело и величину расхождения в секундах дуги. */
  const JPL={
    '1985-11-03 13:37 СПб':['computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)',
      {Sun:220.9525481,Mercury:243.4017088,Venus:202.2638516,Mars:184.2654749,
       Jupiter:308.6764555,Saturn:238.3979717,Uranus:256.0500345,Neptune:271.5696007,
       Moon:103.2036436,Pluto:214.9345982}],
    '2000-01-01 00:00 UTC':['computeChart(2000,1,1,0,0,0,0)',
      {Sun:279.8592049,Mercury:271.1117994,Venus:240.9614017,Mars:327.5754592,
       Jupiter:25.2331157,Saturn:40.4058500,Uranus:314.7840584,Neptune:303.1752420,
       Moon:217.2933209,Pluto:251.4371500}]};
  const arcsec=(a,b)=>Math.abs(((a-b+540)%360)-180)*3600;
  Object.entries(JPL).forEach(([nm,[expr,tight]])=>{
    t('совпадает с JPL Horizons до 2″: '+nm,()=>{
      const ch=ev(expr);
      const bad=Object.entries(tight).map(([p,v])=>[p,arcsec(ch.pos[p].lon,v)])
        .filter(([p,e])=>e>2).map(([p,e])=>`${p} на ${e.toFixed(1)}″`);
      return bad.length?bad.join(', '):true;
    });
  });
  /* Луна и Плутон живут не на VSOP87, а на своих рядах - усечённом ELP82B и
     полиномах, подогнанных к JPL. Прежде это были самые слабые места карты,
     3,7′ и 28′; порог в две секунды выше распространяется и на них, а здесь
     проверяется, что оба ряда вообще подключены и считаются не так, как
     соседи по таблице. */
  t('Луна и Плутон считаются своими рядами, а не приближением',()=>{
    if(typeof ev('MT')==='undefined'||!ev('MT.length')) return 'ряда Луны нет';
    if(ev('MT.length')<500) return 'ряд Луны усечён сильнее ожидаемого: '+ev('MT.length');
    if(!ev('PLNSEG')) return 'полиномов Плутона нет';
    /* вне подогнанного отрезка Плутон обязан оставаться конечным */
    const far=ev('computeChart(2400,1,1,12,0,55.75,37.62)');
    return isFinite(far.pos.Pluto.lon)||'за краем подгонки Плутон уходит в бесконечность';
  });

  /* ---------- устойчивость ---------- */
  group('Устойчивость');
  const EDGE=[[1850,55.75,37.62,'1850 Москва'],[2200,55.75,37.62,'2200 Москва'],
    [2000,69.6,18.9,'69°N Тромсё'],[2000,78.2,15.6,'78°N Шпицберген'],
    [2000,-33.9,151.2,'южное полушарие'],[2000,0,0,'экватор, нулевой меридиан']];
  EDGE.forEach(([y,lat,lon,nm])=>{
    t('карта строится: '+nm,()=>{
      const ch=ev(`computeChart(${y},6,15,12,0,${lat},${lon})`);
      const nan=Object.entries(ch.pos).filter(([k,v])=>!isFinite(v.lon)).map(([k])=>k);
      if(nan.length) return 'нечисловые долготы: '+nan.join(',');
      if(!isFinite(ch.asc)||!isFinite(ch.mc)) return 'asc или mc нечисловые';
      if(ch.houses.cusps.length!==12) return 'куспидов не 12';
      if(ch.houses.cusps.some(c=>!isFinite(c))) return 'нечисловой куспид';
      if(new Set(ch.houses.cusps.map(c=>c.toFixed(2))).size!==12) return 'куспиды совпадают';
      return true;
    });
  });
  t('за полярным кругом откат на равнодомную систему',()=>{
    const ch=ev('computeChart(2000,6,15,12,0,78.2,15.6)');
    return ch.houses.system==='equal'||('система: '+ch.houses.system);
  });
  t('аспекты к узлам вычисляются',()=>{   // когда-то не вычислялись вовсе
    const ch=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)');
    W.__ch=ch;
    const a=ev('aspectsInvolving(window.__ch,"NNode")');
    if(!a.length) return 'ни одного аспекта к Северному узлу';
    if(a.some(x=>x.p2==='SNode')) return 'учтена тривиальная оппозиция узлов';
    return true;
  });

  /* ---------- системы домов ---------- */
  group('Системы домов');
  const SYS=Object.keys(ev('HOUSE_SYSTEMS'));
  t('доступны шесть систем',()=>SYS.length===6||SYS.join(', '));
  t('квадрантные системы ставят 1-й дом на Асцендент и 10-й на Меридиан',()=>{
    const bad=[];
    ['placidus','regiomontanus','campanus','porphyry'].forEach(k=>{
      ev(`HSYS=${JSON.stringify(k)}`);
      const c=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)');
      const d=(a,b)=>Math.abs(((a-b+540)%360)-180);
      if(d(c.houses.cusps[0],c.asc)>0.001) bad.push(k+': 1-й дом не Асцендент');
      if(d(c.houses.cusps[9],c.mc)>0.001) bad.push(k+': 10-й дом не Меридиан');
    });
    return !bad.length||bad.join('; ');
  });
  t('куспиды идут по кругу без пересечений во всех системах',()=>{
    const bad=[];
    SYS.forEach(k=>{ev(`HSYS=${JSON.stringify(k)}`);
      const c=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)').houses.cusps;
      if(!c.every((v,i)=>((c[(i+1)%12]-v+360)%360)>0.001)) bad.push(k);});
    return !bad.length||'нарушено в: '+bad.join(', ');
  });
  t('на экваторе квадрантные системы совпадают между собой',()=>{
    const got={};
    ['placidus','regiomontanus','campanus'].forEach(k=>{ev(`HSYS=${JSON.stringify(k)}`);
      got[k]=ev('computeChart(2000,6,15,12,0,0.0001,0)').houses.cusps;});
    const base=got.placidus;
    const bad=Object.entries(got).filter(([k,v])=>
      v.some((x,i)=>Math.abs(((x-base[i]+540)%360)-180)>0.01)).map(([k])=>k);
    return !bad.length||'расходятся: '+bad.join(', ');
  });
  t('цельнознаковая ставит 1-й дом в начало знака Асцендента',()=>{
    ev('HSYS="whole"');
    const c=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)');
    return c.houses.cusps[0]===Math.floor(c.asc/30)*30||`${c.houses.cusps[0]} при Асценденте ${c.asc.toFixed(2)}`;
  });
  /* Дом присваивается по настоящему положению тела, а не по проекции его
     долготы на эклиптику. Плутон отходит от эклиптики на 17,5°, Луна на 5,
     и проекция ставила их в соседний дом достаточно часто, чтобы породить
     ложную находку в исследовании, посчитанном этим приложением. */
  t('тело на эклиптике: новый расчёт дома совпадает со старым',()=>{
    ev('HSYS="placidus"');
    let bad=0,n=0;
    for(let i=0;i<40;i++){
      const c=ev(`computeChart(${1900+i*3},6,15,${(i*7)%24},0,${-50+i*2.5},${-170+i*8})`);
      if(c.houses.system!=='placidus') continue;
      W.__c=c;
      for(let k=0;k<8;k++){
        const L=(i*37+k*47)%360;
        const a=ev(`houseOf(${L},window.__c.houses.cusps)`);
        const b=ev(`placidusHousePos(${L},0,window.__c.ramc,window.__c.geolat,window.__c.ecl)`);
        if(b==null) continue;
        n++; if(Math.floor(b)!==a) bad++;
      }
    }
    return (n>200&&!bad)||`проверено ${n}, разошлось ${bad}`;
  });
  t('куспид Плацидуса даёт ровно свой номер дома',()=>{
    ev('HSYS="placidus"');
    let worst=0;
    for(let i=0;i<25;i++){
      const c=ev(`computeChart(${1880+i*5},3,9,${(i*5)%24},0,${-45+i*3.5},${i*14-90})`);
      if(c.houses.system!=='placidus') continue;
      W.__c=c;
      for(let k=0;k<12;k++){
        const v=ev(`placidusHousePos(window.__c.houses.cusps[${k}],0,window.__c.ramc,window.__c.geolat,window.__c.ecl)`);
        if(v==null) continue;
        const want=k+1;
        worst=Math.max(worst,Math.min(Math.abs(v-want),Math.abs(v-want+12),Math.abs(v-want-12)));
      }
    }
    return worst<0.01||`худшая ошибка ${worst.toFixed(3)} дома`;
  });
  t('широта тела влияет на дом: Плутон расходится с проекцией',()=>{
    ev('HSYS="placidus"');
    let chg=0,n=0;
    ev('CHART_LIBRARY').slice(0,120).forEach(e=>{
      W.__e=e;
      const c=ev(`computeChart(${e.y},${e.mo},${e.d},${e.t==null?12:e.t},libTz(window.__e),${e.lat},${e.lon})`);
      if(c.houses.system!=='placidus') return;
      W.__c=c; n++;
      if(ev("houseOf(window.__c.pos.Pluto.lon,window.__c.houses.cusps)")!==ev("bodyHouse(window.__c,'Pluto')")) chg++;
    });
    if(!n) return 'ни одной карты с Плацидусом';
    const pct=chg/n*100;
    return (pct>5)||`Плутон расходится лишь у ${pct.toFixed(1)}% — похоже, широта не учитывается`;
  });
  t('за полярным кругом Плацидус отступает на равнодомную',()=>{
    ev('HSYS="placidus"');
    return ev('computeChart(2000,6,15,12,0,78.2,15.6)').houses.system==='equal'||'не отступил';
  });
  t('выбор системы сохраняется и восстанавливается',()=>{
    const k='astrarium_hsys', saved=W.localStorage.getItem(k);
    W.localStorage.setItem(k,'campanus');
    const ok=ev(`Object.keys(HOUSE_SYSTEMS).includes(localStorage.getItem('${k}'))`);
    saved===null?W.localStorage.removeItem(k):W.localStorage.setItem(k,saved);
    return ok||'значение не признаётся';
  });
  ev('HSYS="placidus"');

  /* ---------- разбор ---------- */
  group('Разбор карты');
  const ch=ev('computeChart(1985,11,3,13+37/60,3,59.9343,30.3351)');
  W.__c=ch;
  const order=ev('CARD_ORDER');
  const cards=order.map(p=>ev(`composePlacement(window.__c,${JSON.stringify(p)})`)).filter(Boolean);
  const texts=cards.map(c=>c.detail)
    .concat([ev('composeFirstImpr(window.__c)').detail, ev('composePortrait(window.__c)').detail]);
  const all=texts.join(' ');

  t('строятся все 14 карточек, включая Лилит и Селену',()=>
    cards.length===14||`карточек ${cards.length}`);
  t('в тексте нет длинных тире',()=>
    !all.includes('—')||'найдено '+(all.split('—').length-1));
  t('нет оборота «то, как вы»',()=>
    !/то, как вы/.test(all)||'оборот вернулся');
  t('нет висячих «этому» и «своё»',()=>{
    const m=all.match(/\bэтому\b|\bсвоё\b(?!\s+\S)/g);
    return !m||'найдено: '+[...new Set(m)].join(', ');
  });
  t('нет выдуманных сроков в советах',()=>{
    const m=all.match(/полгода|на неделю\b|в день\b|вдвое\b|один вдох/g);
    return !m||'найдено: '+[...new Set(m)].join(', ');
  });
  t('внутри карточки предложения не повторяются',()=>{
    const bad=[];
    cards.forEach(c=>{const s=c.detail.split(/(?<=[.?!])\s+/).map(x=>x.trim());
      const seen=new Set(); s.forEach(x=>{if(x.length>40&&seen.has(x))bad.push(c.label);seen.add(x);});});
    return !bad.length||'повторы в: '+[...new Set(bad)].join('; ');
  });
  t('соседние предложения не начинаются одинаково',()=>{
    const bad=[];

       Ловим настоящую кучу, а не совпадение дней рождения. */
    const lam=LIB.length/366, lim=Math.max(8,Math.ceil(lam+5*Math.sqrt(lam)));
    if(worst[1]>lim) return `на ${worst[0]} приходится ${worst[1]} записей при ожидаемых ${lam.toFixed(1)}`;

     1900 года и была неверна: Варшава жила по своему среднему времени до 1915,
     Париж до 1911, Тбилиси до 1924 - и база tz честно об этом сообщает. */
  /* tzo - смещение, записанное вместе с источником времени, и оно авторитетнее

     совершенно настоящий случай, на котором этот тест и споткнулся. */
  t('часовой пояс - либо стандартный, либо местное среднее время места',()=>{

      if(e.tzo!=null) return;                    // смещение задокументировано источником
      W.__e=e; const off=ev('libTz(window.__e)');
      if(!isFinite(off)||Math.abs(off)>14){ bad.push(e.id+': '+off); return; }
      const standard=Math.abs(off*60-Math.round(off*60/15)*15)<0.01;
      const lmt=Math.abs(off-e.lon/15)<0.02;
      if(!standard&&!lmt) bad.push(`${e.id}: ${off.toFixed(2)} - ни пояс, ни среднее время (${(e.lon/15).toFixed(2)})`);
    });
    return !bad.length||bad.slice(0,4).join('; ');
  });

  /* ---------- Чёрная Луна и Селена ---------- */
  group('Чёрная Луна и Селена');
  t('Селена совпадает с определением Swiss Ephemeris в эпоху J2000',()=>{
    /* seorbel.txt: средняя аномалия 242.2205555 + 5143.5418158*T, эксцентриситет
       и наклон нулевые, тело геоцентрическое, поэтому долгота равна аномалии.
       Наша нулевая точка это JD 2451543.5, то есть J2000 минус 1.5 суток. */
    const v=ev('selenaLon(1.5)');
    return near(v,242.2205555,1e-5)||`получилось ${v.toFixed(7)} вместо 242.2205555`;
  });
  t('Селена проходит круг за семь лет',()=>{
    const a=ev('selenaLon(0)'), b=ev('selenaLon(2556.06)');   // 6.9986 юлианских лет
    let d=Math.abs(b-a); if(d>180) d=360-d;

  });
  t('средняя Чёрная Луна это апогей по Meeus 45.7',()=>{
    /* Перигей 83.3532465° в J2000, скорость 4069.0137287°/век; апогей на 180°
       дальше. Проверяем в самой эпохе и через сто лет. */
    const now=ev('lilithLon(1.5)'), late=ev('lilithLon(1.5+36525)');
    const wantNow=(83.3532465+180)%360;
    const wantLate=(83.3532465+180+4069.0137287-0.0103200-1/80053+1/18999000)%360;
    return (near(now,wantNow,1e-6)&&near(late,wantLate,1e-6))
      ||`J2000 ${now.toFixed(4)} против ${wantNow.toFixed(4)}, +100 лет ${late.toFixed(4)} против ${wantLate.toFixed(4)}`;
  });
  t('истинная Чёрная Луна даёт правдоподобную оскулирующую орбиту',()=>{
    /* Большая полуось около 384 400 км, эксцентриситет колеблется примерно от
       0.026 до 0.077. Если численная производная испорчена, оба уедут сразу. */
    const bad=ev(`(()=>{const out=[];
      for(let k=0;k<40;k++){
        const T=(2440000.5+k*97-2451545)/36525;
        const h=1e-6, a=moonXYZ(T+2*h),b=moonXYZ(T+h),c=moonXYZ(T-h),d=moonXYZ(T-2*h);
        const kk=1/(12*h*36525);
        const v=[(-a[0]+8*b[0]-8*c[0]+d[0])*kk,(-a[1]+8*b[1]-8*c[1]+d[1])*kk,(-a[2]+8*b[2]-8*c[2]+d[2])*kk];
        const r=moonXYZ(T), rr=Math.hypot(r[0],r[1],r[2]);
        const v2=v[0]*v[0]+v[1]*v[1]+v[2]*v[2], rv=r[0]*v[0]+r[1]*v[1]+r[2]*v[2];
        const k1=(v2-GM_EM/rr)/GM_EM, k2=rv/GM_EM;
        const e=Math.hypot(k1*r[0]-k2*v[0],k1*r[1]-k2*v[1],k1*r[2]-k2*v[2]);
        const sma=1/(2/rr-v2/GM_EM);
        if(!(sma>370000&&sma<400000&&e>0.02&&e<0.085)) out.push(k+': a='+sma.toFixed(0)+' e='+e.toFixed(4));
      }
      return out;})()`);
    return bad.length===0||`выпали из диапазона: ${bad.join(', ')}`;
  });
  t('шаг численной производной сошёлся',()=>{
    /* Если ответ зависит от h, то это не производная, а шум. */
    const f=h=>ev(`(()=>{const T=(2448088.02-2451545)/36525, h=${h};
      const a=moonXYZ(T+2*h),b=moonXYZ(T+h),c=moonXYZ(T-h),d=moonXYZ(T-2*h);
      const k=1/(12*h*36525);
      const v=[(-a[0]+8*b[0]-8*c[0]+d[0])*k,(-a[1]+8*b[1]-8*c[1]+d[1])*k,(-a[2]+8*b[2]-8*c[2]+d[2])*k];
      const r=moonXYZ(T), rr=Math.hypot(r[0],r[1],r[2]);
      const v2=v[0]*v[0]+v[1]*v[1]+v[2]*v[2], rv=r[0]*v[0]+r[1]*v[1]+r[2]*v[2];
      const k1=(v2-GM_EM/rr)/GM_EM, k2=rv/GM_EM;
      const e=[k1*r[0]-k2*v[0],k1*r[1]-k2*v[1],k1*r[2]-k2*v[2]];
      return (Math.atan2(-e[1],-e[0])*180/Math.PI+360)%360;})()`);
    const a=f(1e-6), b=f(1e-7);
    return near(a,b,1/3600)||`h=1e-6 даёт ${a.toFixed(5)}, h=1e-7 даёт ${b.toFixed(5)}`;
  });
  t('истинная Чёрная Луна расходится со средней и бывает ретроградной',()=>{
    /* Расхождение доходит до знака зодиака, и ретроградность есть только у
       истинной. Обе особенности разом отличают её от средней. */
    const r=ev(`(()=>{let maxd=0, retro=0;
      for(let k=0;k<160;k++){
        const jd=2444000.5+k*11, d=jd-2451543.5;
        const T=(jd-2451545)/36525, [dp]=nutation(T);
        const a=lilithTrue(T,dp), b=lilithTrue((jd+1-2451545)/36525,nutation((jd+1-2451545)/36525)[0]);
        let diff=Math.abs(((a.lon-lilithLon(d))%360+540)%360-180); diff=180-diff;
        if(diff>maxd) maxd=diff;
        let sp=b.lon-a.lon; if(sp>180)sp-=360; if(sp<-180)sp+=360;
        if(sp<0) retro++;
      }
      return {maxd,retro};})()`);
    return (r.maxd>20&&r.retro>10)||`максимум расхождения ${r.maxd.toFixed(1)}°, ретроградных дней ${r.retro} из 160`;
  });
  t('истинная Чёрная Луна сходится со сторонним расчётом',()=>{
    /* 15 июля 1990, 14:30 в Берлине = 12:30 UT. Опубликованный пример даёт
       среднюю в Скорпионе 28.31 и истинную в Стрельце 24.47, ретроградную.
       Порог в полградуса: это сверка порядка величины и калибровки, а не
       эталон - первичной таблицы Swiss Ephemeris у нас нет. */
    const r=ev(`(()=>{const d=dayNumber(1990,7,15,12.5), jd=2451543.5+d;
      const T=(jd+deltaTsec(1990,7)/86400-2451545)/36525, [dp]=nutation(T);
      return {mean:lilithLon(d), tru:lilithTrue(T,dp).lon};})()`);
    return (near(r.mean,238.31,0.2)&&near(r.tru,264.47,0.5))
      ||`средняя ${r.mean.toFixed(2)} против 238.31, истинная ${r.tru.toFixed(2)} против 264.47`;
  });

  t('транзитная карта считается на выбранный момент',()=>{

  t('сходящийся и расходящийся аспект различаются верно',()=>{

  t('за секунду Луна сдвигается заметно, а Плутон нет',()=>{

  const PRG=`(()=>{const keep=RING_MODE, kb=BIRTH_MS;

      BIRTH_MS=utcMs(1984,5,17,10,30,0);

      const at=utcMs(2026,9,13,10,30,0);
      const days=(progressedMs(null,at)-BIRTH_MS)/86400000;

  t('дирекционное Солнце совпадает с прогрессивным',()=>{

  t('в дирекциях всё натальное сдвинуто на одну и ту же дугу',()=>{
    const r=ev(PRG);
    const bad=Object.keys(r.ch.pos).filter(k=>{
      const d=((r.dr.pos[k].lon-r.ch.pos[k].lon)%360+360)%360;
      return Math.abs(d-r.dr.arc)>1e-9;
    });
    const angles=Math.abs(((r.dr.mc-r.ch.mc)%360+360)%360-r.dr.arc);
    return (bad.length===0&&angles<1e-9)||`разъехались: ${bad.join(',')||'нет'}, MC на ${angles}`;
  });
  t('углы прогрессий идут по дуге, а не крутятся полный круг за год',()=>{
    /* Соблазнительная ошибка: построить прогрессивный момент как обычную карту.
       Тогда MC проходит все 360° за каждый год жизни, потому что время суток
       прогрессивного момента уползает на целые сутки. Должно быть около
       градуса в год. */
    const r=ev(`(()=>{const keep=RING_MODE, kb=BIRTH_MS;
      const ch=computeChart(1984,5,17,14.5,4,55.7558,37.6176);
      BIRTH_MS=utcMs(1984,5,17,10,30,0);
      RING_MODE='progressed';
      const out=[];
      for(let y=1;y<=40;y++){
        const a=outerChart(ch,BIRTH_MS+(y-1)*365.2422*86400000).mc;
        const b=outerChart(ch,BIRTH_MS+y*365.2422*86400000).mc;
        let d=b-a; if(d<-180)d+=360; if(d>180)d-=360;
        out.push(d);
      }
      RING_MODE=keep; BIRTH_MS=kb; return out;})()`);
    const bad=r.filter(d=>!(d>0.85&&d<1.05));

  t('прогрессивный Асцендент восстановлен из своего MC, а не сдвинут на дугу',()=>{

  t('каждый селектор в печатных правилах кого-то находит',()=>{

       так #form вместо #formCard прожил бы до первой чужой распечатки. */
    const bad=ev(`(()=>{const out=[];
      for(const sheet of document.styleSheets){
        let rules; try{ rules=sheet.cssRules; }catch(e){ continue; }
        for(const r of rules){
          if(!(r.media&&[...r.media].includes('print'))) continue;
          for(const inner of r.cssRules){
            if(!inner.selectorText) continue;
            for(const sel of inner.selectorText.split(',')){
              const t=sel.trim();
              if(/^(html|body|:root|@page)/.test(t)) continue;
              /* querySelectorAll cannot match a pseudo-element, so asking it
                 to would report every one of them as dead. */
              if(t.includes('::')) continue;
              let n=0; try{ n=document.querySelectorAll(t).length; }catch(e){ n=-1; }
              if(n===0) out.push(t);
            }
          }
        }
      }
      return out;})()`);

  t('разведение выдерживает скопление всех тел в пяти градусах',()=>{
    /* Чистая функция, поэтому проверяется на патологии прямо: четырнадцать тел
       в пяти градусах. Разойтись они обязаны, но симметрично вокруг скопления,
       а не гуськом в одну сторону. */
    const r=ev(`(()=>{const sep=14, lons=[];
      for(let i=0;i<14;i++) lons.push(100+i*0.35);
      const out=fanOut(lons,sep);
      let worst=0, minGap=999;
      out.forEach((v,i)=>{ let d=Math.abs(v-lons[i]); if(d>180)d=360-d; if(d>worst)worst=d; });
      const sorted=[...out].sort((a,b)=>a-b);
      for(let i=0;i<sorted.length;i++){
        const g=rev(sorted[(i+1)%sorted.length]-sorted[i]);
        if(g<minGap) minGap=g;
      }
      const centreBefore=lons.reduce((a,b)=>a+b,0)/14;
      const centreAfter=out.reduce((a,b)=>a+b,0)/14;
      return {worst,minGap,drift:Math.abs(centreAfter-centreBefore)};})()`);
    if(r.minGap<13.9) return `остался зазор ${r.minGap.toFixed(2)}° вместо 14`;
    if(r.worst>100) return `тело уехало на ${r.worst.toFixed(1)}°`;

    /* The frame is put at a real phone size and the app is asked to scroll the

       measured against the viewport. Two earlier versions of this test added

       a sum of parts is not a layout. */
    const wasW=frame.style.width, wasH=frame.style.height;
    frame.style.width='375px'; frame.style.height='812px';
    void frame.offsetWidth;
    /* The same arithmetic scrollChartIntoView uses, applied instantly. The
       function itself scrolls smoothly, which is asynchronous, and reading the
       position straight after it reported the unscrolled page - 1413 px on an
       812 px screen. */
    const r=ev(`(()=>{const card=document.getElementById('chartCard');

      return {last, top, hdr, vh:window.innerHeight};})()`);

  t('в списке транзитов при выключенном флаге нет ни оценок, ни прозы',()=>{
    const box=D.getElementById('transitlist');
    const rates=box.querySelectorAll('.rate').length;
    const syn=D.getElementById('daysyn').textContent.trim().length;
    return (rates===0&&syn===0)||`блоков оценки ${rates}, синтез дня длиной ${syn}`;
  });

  /* ---------- бивил ---------- */
  group('Двойное колесо');
  t('транзитное кольцо не налезает на натальное',()=>{
    /* Ради этого кольца и раздвинуты: перекрытие глифов и есть та беда,
       из-за которой мобильные карты нечитаемы. */
    const r=ev(`(()=>{const sv=document.querySelector('#wheel svg');
      if(!sv) return null;
      /* Told apart by which group they sit in, not by radius: the discs were
         made smaller and a radius range silently stopped matching them, so this
         test reported "no two sets" on a perfectly good wheel. */
      const na=[...sv.querySelectorAll('.pl circle')];
      const tr=[...sv.querySelectorAll('.trp circle')];
      const d=c=>Math.hypot(+c.getAttribute('cx')-190,+c.getAttribute('cy')-190);
      if(!tr.length||!na.length) return null;
      return {natalOuter:Math.max(...na.map(c=>d(c)+ +c.getAttribute('r'))),
              transitInner:Math.min(...tr.map(c=>d(c)- +c.getAttribute('r'))),
              tr:tr.length, na:na.length};})()`);
    if(!r) return 'на колесе нет двух наборов глифов';
    return (r.transitInner-r.natalOuter>=6)
      ||`зазор ${(r.transitInner-r.natalOuter).toFixed(1)} px между кольцами`;
  });
  t('в транзитном кольце все десять планет',()=>{
    const n=ev(`document.querySelectorAll('#wheel .trp').length`);
    return n===10||`нарисовано ${n}`;
  });

  t('на пустой форме кнопка сохранения выключена',()=>{
    const d=D.getElementById('date').value, tm=D.getElementById('time').value;
    const b=D.getElementById('saveChart');
    ev("['date','time'].forEach(i=>{document.getElementById(i).value='';});syncSaveBtn()");
    const off=b.disabled;
    ev(`document.getElementById('date').value=${JSON.stringify(d)};`
      +`document.getElementById('time').value=${JSON.stringify(tm)};syncSaveBtn()`);
    return off || 'кнопка активна, но нажатие ничего не делает';
  });

  render();
}

function render(){
  const bad=R.filter(x=>!x.ok);
  const s=document.getElementById('sum');
  s.className=bad.length?'fail':'pass';
  s.textContent=bad.length?`${bad.length} из ${R.length} не прошли`:`все ${R.length} прошли`;
  let h='',g='';
  R.forEach(x=>{ if(x.g!==g){g=x.g;h+=`<div class="grp">${g}</div>`;}
    h+=`<div class="t ${x.ok?'ok':'no'}"><div class="nm">${x.ok?'✓':'✗'} ${x.name}</div>`
      +(x.info?`<div class="dt">${x.info}</div>`:'')+`</div>`;});
  document.getElementById('out').innerHTML=h;
}
</script>
