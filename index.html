   switch is touched there is nothing stored and the system decides; after
   that the stored choice holds. */

/* Self-hosted so the app looks identical on every OS: system fonts would
   render as SF Pro on Apple, Roboto on Android and Segoe on Windows. Both
   families carry purpose-drawn Cyrillic (not auto-derived), subset to
   Latin+Cyrillic+the symbols the UI actually draws, pinned to the two weights
   the CSS uses. Inter also covers the rating stars and prime marks, so those
   never fall back to a platform symbol font. */
@font-face{font-family:'Inter';src:url(./inter-400.woff2) format('woff2');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(./inter-500.woff2) format('woff2');
  font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url(./literata-500.woff2) format('woff2');
  font-weight:500;font-style:normal;font-display:swap}
:root{
  /* Palette solved for contrast, not picked by eye: every text/background pair
     clears WCAG AA. The old one failed twice, labels at 2.63:1 in light and the
     primary button's white text at 2.70:1 in dark, against 4.5:1 required. */
  --paper:#f9f7f3; --paper2:#f4f0e9; --paper3:#ede7da; --line:#e1d8c6;
  --ink:#201d18; --ink2:#686050; --ink3:#746c5b;
  --accent:#9d5d25; --accentBtn:#aa6428; --accentInk:#ffffff;
  /* Chart colours solved the same way: lines hold 3.5:1 against the wheel
     ground, sector fills keep glyphs above 12:1. MC was identical to harm
     before, so the MC axis and harmonious aspects were the same colour. */
  --axis:#ce5692; --mc:#976bd4;
  /* The tri-wheel's outer ring. Teal because every other hue on the wheel is
     taken - accent by the middle ring, pink and violet by the angles, blue,
     red and green by the aspects - and solved to sit level with accent rather
     than above it: 4.86:1 light and 5.40:1 dark against the wheel ground, to
     accent's 4.67 and 5.35. Brighter and the outer ring would read as the
     important one, which it is not. */
  --ring3:#18757a;
  --harm:#4683c9; --hard:#cb614c; --conj:#2a9256;
  /* Minor aspects read as subordinate, so the colour is neutral rather than a
     fifth family hue. Measured: 4.13:1 on the light wheel and 6.09:1 on the
     dark one, and being hueless it cannot be mistaken for harm, hard, conj,
     the axis or the MC - the plum that scored higher on contrast sat between
     the axis magenta and the MC violet. */
  --minor:#6b7684;
  --wheelbg:#f4f2ee;
  --fire:#e3bdaa; --earth:#8cd685; --air:#d4c57d; --water:#9cccde;
  --radius:16px;
  --glass:rgba(246,242,234,.72);
}
:root[data-theme="dark"]{
    /* Night sky rather than dark paper: deep indigo, no pure black, surfaces
       lifted step by step. Button text is dark on the light accent, which is
       what fixes the 2.70:1 failure and reads better besides. */
    --paper:#100f17; --paper2:#171520; --paper3:#201e2c; --line:#332f43;
    --ink:#e7e6ea; --ink2:#9693a6; --ink3:#827e93;
    --accent:#bc773a; --accentBtn:#bc773a; --accentInk:#12101e;
    --wheelbg:#0f0d19;
    --axis:#b13e78; --mc:#7f50c2; --harm:#3a6ba4; --ring3:#3d9499;
    --hard:#a94e3b; --conj:#2a774a; --minor:#8792a0;
    --fire:#583321; --earth:#1d4519; --air:#433c19; --water:#1d414e;
    --glass:rgba(16,15,23,.72);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font:15px/1.5 'Inter',system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;
  /* The viewport is already viewport-fit=cover, which is what lets the wheel
     use the full width; the insets are what keeps the content out from under
     the Dynamic Island and the home indicator. Both halves are required, and
     for a while only the first was here, which on a notched phone means the
     cover is doing harm rather than good. The left and right insets matter in
     landscape, where the notch eats a side. */
  padding:0 env(safe-area-inset-right) calc(60px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
}
h1,h2,h3,.serif{font-family:'Literata',Georgia,"Times New Roman",serif;font-weight:500}
/* 56 px on a phone: the 44 px buttons plus 6 above and below. */
header{padding:calc(6px + env(safe-area-inset-top)) 20px 6px;max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
header .ht{flex:1}
header h1{font-size:26px;margin:0;letter-spacing:.2px}
/* Version rides the title so it is obvious from a phone whether the build in
   front of you is the one that was just deployed. */
header h1 .ver{font-size:11px;font-weight:400;letter-spacing:.04em;color:var(--ink3);
  vertical-align:.55em;margin-left:5px;font-feature-settings:'tnum' 1}
.tagline{margin:6px 0 0;color:var(--ink2);font-size:13px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;
  padding:0 12px;background:var(--paper2);color:var(--ink2);font-size:14px;flex:none;line-height:1}
.hbtn svg{width:18px;height:18px;flex:none}
.hbtn.ico{width:44px;padding:0}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}
.card h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin:0 0 4px}
/* 16 px, not the body's 15. iOS zooms the page in on any field whose text is
   under 16 px when it takes focus, and on 10 Oct 2026 the iOS build did exactly
   that on the city field: the page enlarged and the header slid under the clock
   and the Dynamic Island. Turning zoom off in the viewport would also take away
   pinch-zoom, which the tri-wheel's small numbers need, so the size is the fix. */
input,select{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:16px;font-variant-numeric:tabular-nums;
}
/* The 44 px touch floor for fields, set once. Text fields measured 42.5 px (a 22.5 px
   line plus padding and border), and an empty date or time field in iOS WebKit has no
   line at all and collapsed to 18 pt - seen in the iOS build on 10 Oct 2026. One floor
   fixes both. Not checkboxes, radios or the time slider: they are inputs too, and a
   minimum height would stretch them out of shape. */
input:not([type=checkbox]):not([type=radio]):not([type=range]),select{min-height:44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* iOS WebKit draws date and time fields with an intrinsic width of their own and
   ignores width:100%, so in the two-column form the time field ran past the card's
   right edge - seen first in the iOS build on 10 Oct 2026, and present in mobile
   Safari all along. Without the native appearance they take the column's width,
   and a grid column may shrink below its content only if told it may. */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;display:block}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.grid>*,.grid3>*{min-width:0}
/* The house rule for every button (My Apps/CLAUDE.md): centre the letters, not
   the line box. Height from padding and the 44px floor, line-height 1, and
   text-box trimmed to the cap height, so a label sits in the middle of its
   button and not on the descender space below it. */
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--paper3);color:var(--ink);padding:9px 14px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;box-sizing:border-box;
  text-box:trim-both cap alphabetic}
button.primary{background:var(--accentBtn);border-color:var(--accentBtn);color:var(--accentInk)}
/* The language control was a native select until the app grew its own
   dropdown; its styling now lives with .dd.langsel. The old rule is gone
   rather than left to also match the wrapper, which it did, painting a second
   chevron beside the first. */
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.lang button{border:none;border-radius:0;padding:6px 11px;background:var(--paper2);font-size:13px}
.lang button.on{background:var(--accentBtn);color:var(--accentInk)}
/* Both switches are 'pick one of two' controls of equal rank, so they read as
   siblings: same height, radius and vertical rhythm. Only the horizontal
   padding differs, because an icon and a two-letter label are not the same
   width. Before this they stood 28px against 33.5px and looked misaligned. */
.lang button{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.lang.theme button{padding:0 10px;min-width:52px;color:var(--ink2)}
.lang.theme button.on{color:var(--accentInk)}
/* 18 px like every other icon here. The global svg rule stretches an icon to its
   button's width, and once the switch moved into the settings with 52 px buttons
   the sun and the moon came out at 32. */
.lang.theme button svg{width:18px;height:18px;flex:none}
.mono,.deg{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
/* Inter, not a platform symbol font. The Astro face carries symbols only, and
   four labels drawn in it are letters - Asc, MC, and the quintile's Q and bQ.
   Naming Segoe and Apple Symbols sent those to whatever the machine had, which
   is the layout shift self-hosting exists to prevent. Inter is bundled. */
.af{font-family:'Astro','Inter',sans-serif;font-style:normal}
.planet-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
/* A row is a target, so it gets the 44px floor and says so by responding. */
.planet-row.hit{min-height:44px;cursor:pointer;border-radius:8px;padding-left:6px;padding-right:6px;margin:0 -6px}
.planet-row.hit:hover,.planet-row.hit:focus-visible{background:var(--paper3);outline:none}
.planet-row.hit:active{background:var(--paper2)}
.planet-row:last-child{border-bottom:none}
.planet-row .g{font-size:19px;width:26px;text-align:center}
.planet-row .nm{width:150px;color:var(--ink2)}
.planet-row .pos{font-weight:500}
.planet-row .hs{margin-left:auto;color:var(--ink3);font-size:12px}
/* The retrograde mark is a letter, not a colour, so it survives a greyscale
   print and a colour-blind reader. */
.rx{color:var(--hard);font-weight:600;margin-left:3px}
.planet-row .spd{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums;margin-left:10px}
/* Chart header: the data the chart was cast from, stated on the chart itself,
   the way a printed one carries it. */
.chartmeta{font-size:12px;color:var(--ink3);line-height:1.45;margin:2px 0 8px;
  font-variant-numeric:tabular-nums}
.chartmeta b{color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}
.tiny{font-size:12px;color:var(--ink3)}
.detail{background:var(--paper3);border-radius:12px;padding:12px;margin-top:10px;min-height:20px}
.detail.empty{color:var(--ink2);font-style:italic}   /* ink3 on the detail ground measured 4.2:1, under 4.5 */
/* ---- city atlas download ---- */
.atlasbar{margin-top:8px}
.atlasbar .bar{height:4px;border-radius:2px;background:var(--paper3);overflow:hidden}
.atlasbar .bar i{display:block;height:100%;width:0;background:var(--accent);
  transition:width .2s linear}
.atlasbar .tiny{margin-top:5px}
/* The percentage on its own line, the explanation under it: on a phone the two
   run to three wrapped lines when they share one, and the number is what the
   eye is looking for. */
.atlasbar .dim{margin-top:2px;opacity:.75}
.atlasbar .dim:empty{display:none}
.atlasbar button{margin-top:7px;padding:5px 11px;font-size:13px;min-height:36px}
/* ---- time scrubber ---- */
/* Reuses the language switch's segmented look, one row, full width, with 44px
   of height because these are the control the whole card turns on. */
/* One line, and the label names the thing being filled rather than the mode
   being entered, so "none" reads as an answer and not as a switched-off app. */
.ringrow{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.ringlab{margin:0;flex:none}
.ringrow select{flex:1;min-height:44px}
/* On a phone the label goes, visually only: the button already names the
   chart type, and the label's 86 px were what the tri-wheel's names needed.
   Measured at 375 px, the button had 172 px of text room and five languages
   overflowed it - Georgian's progressions-plus-transits by 34 px. Kept in the
   accessibility tree, so a screen reader still hears "Chart type". */
@media (max-width:480px){
  .ringrow .ringlab{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
}
/* Wheel and controls share one screen, so the wheel gets whatever height is
   left rather than a fixed size. 46vh is measured, not guessed: on a 375x812
   phone it leaves room for the moment line, the rail, one row of controls and
   the tap-detail box without scrolling, and on a desktop the 420px ceiling
   stops the wheel from filling a tall window on its own. */
#chartCard #wheel{max-width:min(100%,420px);margin:0 auto}
/* Zooming the wheel. At 1x a finger on the wheel scrolls the page, as it always
   did, and a two-finger pinch is handed to the wheel instead of the page; zoomed
   in, a finger pans the wheel. */
.wheelwrap{position:relative}
#wheel{touch-action:pan-y}
#wheel.zoomed{touch-action:none}
.wzreset{position:absolute;width:44px;height:44px;padding:0;border-radius:50%;
  background:var(--paper2);border:1px solid var(--line);color:var(--ink2);z-index:2;
  box-shadow:0 2px 8px rgba(0,0,0,.18)}
#chartCard #wheel svg{max-height:46vh;width:auto;max-width:100%;margin:0 auto}
/* Six per cent off the wheel on a phone. It buys the last twenty pixels that
   keep the wheel, the moment and both control rows on one screen, which is
   the thing the layout exists for; the glyphs and their degrees stay legible
   at this size, checked on screen and not only in the budget. */
@media (max-width:430px){ #chartCard #wheel svg{max-width:94%} }
/* Natal on its own has no slider under it, so the wheel is not competing for
   the screen and takes its full width back. */
#chartCard.bare #wheel svg{max-height:62vh}
@media (max-width:430px){ #chartCard.bare #wheel svg{max-width:100%} }
/* A wide screen is where an astrologer works with a client, and there the wheel
   is the page: it stands on the left at the full height of the window and stays
   in view, while everything read off it scrolls in a column on the right. That
   is the layout of Astro Gold and Solar Fire, and the 420px ceiling above was a
   phone's rule applied to a desk. The window's own size is the control: no
   setting for the wheel's size, the wheel fills whatever room it is given. */
@media (min-width:1100px){
  header,.wrap{max-width:1440px}
  #results{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);gap:0 20px;align-items:start}
  #results>#chartCard{grid-column:1;grid-row:1/span 30;position:sticky;top:8px;margin-top:0}
  #results>:not(#chartCard){grid-column:2}
  #results>:not(#chartCard):first-of-type{margin-top:0}
  #chartCard #wheel{max-width:none}
  #chartCard #wheel svg{max-height:calc(100vh - 330px);min-height:420px}
  #chartCard.bare #wheel svg{max-height:calc(100vh - 270px)}
}
.scrub{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:10px 0 0;background:var(--paper3)}
.momrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.mom{font-family:'Literata',Georgia,serif;font-size:17px;font-variant-numeric:tabular-nums}
/* A 32px thumb on a 4px rail: the rail is a hairline you read, the thumb is a
   target you hit with a thumb. Both native appearances are removed because
   Safari and Chrome disagree about everything else on a range input. */
#scrub{-webkit-appearance:none;appearance:none;width:100%;height:34px;padding:0;border:none;
  background:transparent;margin:0 0 6px;touch-action:none}
#scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
#scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;
  margin-top:-11px;border-radius:50%;background:var(--accentBtn);border:2px solid var(--paper);
  box-shadow:0 1px 3px rgba(0,0,0,.28);cursor:grab}
#scrub::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--accentBtn);
  border:2px solid var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.28);cursor:grab}
#scrub:active::-webkit-slider-thumb{cursor:grabbing}
.scrubctl{display:flex;align-items:center;gap:8px}
.scrubctl.jump{margin-top:8px}
.scrubctl.jump button{flex:1}
.scrubctl select{width:auto;flex:1;min-width:0}
.scrubctl button{min-height:44px}
/* Square icon buttons: 44px is the floor a thumb needs, and it is cheaper to
   set here than to retrofit across thirteen classes later. */
button.ico{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
/* The global svg rule stretches every icon to its container's width, which
   on a 44px target draws an 44px glyph. These are 18px marks in a 44px
   button: the target is for the thumb, the drawing is for the eye. */
button.ico svg{width:18px;height:18px;flex:none}
button.ico:disabled{opacity:.4;cursor:default}
.steplab{display:inline;margin:0 0 0 2px;flex:none}
/* ---- configurations ---- */
.confrow{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 6px;margin:0 -6px;
  border-bottom:1px solid var(--line);border-radius:8px;cursor:pointer;flex-wrap:wrap}
.confrow:last-child{border-bottom:none}
.confrow:hover,.confrow:focus-visible{background:var(--paper3);outline:none}
.confrow.on{background:var(--paper2);box-shadow:inset 2px 0 0 var(--accent)}
.confrow .nm{font-size:14px;flex:none}
.confrow .who{font-size:17px;letter-spacing:2px;color:var(--ink2);flex:none}
.confrow .names{flex:1;min-width:0;text-align:right;overflow-wrap:anywhere}
/* ---- print ----
   A chart sheet, not a screenshot of an app. Everything that is a control
   goes, everything that is the chart stays, and the dark theme goes with them:
   a printer asked for a dark wheel returns a black page and an empty
   cartridge. The light palette is restated here rather than inherited,
   because the theme is chosen by an attribute on <html> that print cannot
   override. */
@media print{
  @page{ margin:12mm; }
  :root, :root[data-theme="dark"], :root[data-theme="light"]{
    --paper:#fff; --paper2:#fff; --paper3:#fff; --line:#b9b2a4;
    --ink:#000; --ink2:#333; --ink3:#555;
    --accent:#7a4a1c; --accentBtn:#7a4a1c; --accentInk:#fff; --ring3:#0f5a5e;
    --wheelbg:#fff; --glass:#fff;
    --fire:#f0d9cc; --earth:#cfe8c9; --air:#ece2b6; --water:#cfe4ee;
  }
  html,body{background:#fff;color:#000}
  header, .tagline, dialog.panel, .metactl, .setnote, #formCard, #libCard, #emptycard, #orbCard, #relocCard, #transitsCard,
  .scrub, .ringrow, .detail, .noprint, .foot{ display:none !important; }
  .card{border:none;box-shadow:none;padding:0;margin:0 0 10mm;background:#fff}
  .card.fold>summary{list-style:none;cursor:auto}
  .card.fold>summary::-webkit-details-marker{display:none}
  #chartCard #wheel svg{max-height:none;max-width:150mm;width:100%}
  /* Each block keeps itself whole rather than splitting across the fold. */
  #positionsCard, #confCard, #gridCard{break-inside:avoid;page-break-inside:avoid}
  /* The sheet is the reason .detail can stay hidden: it carries every body,
     including whichever one happens to be tapped, so printing the panel as
     well would put the same facts on the page twice. */
  #printFactsCard{display:block !important;break-before:page;page-break-before:always}
  .printonly{display:block !important}
  .planet-row{break-inside:avoid}
  .gridwrap{overflow:visible}
  h2{font-size:14pt}
  .tiny{font-size:8pt}
}
/* ---- the app's own dropdown ---- */
/* Takes the select's place in the layout: full width by default, because that
   is what `input,select` gave it, and flexible where it sat in a flex row. */
.dd{position:relative;display:flex;width:100%;min-width:0}
.ringrow .dd{flex:1;min-width:0;width:auto}
/* The step control shares its row with three 44px buttons and a label, and
   flex alone shrank it until сутки came out as сут... The floor is the
   longest unit name plus the chevron. */
.scrubctl .dd{flex:1;min-width:112px;width:auto}
/* The header pair: this one is a 34px chip beside the theme switch, not a
   44px form control. */
.dd.langsel{width:auto;flex:none}
.dd.langsel .ddbtn{min-height:44px;padding:4px 26px 4px 12px;font-size:14px;
  background:var(--paper2);letter-spacing:.04em;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
    linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.ddnative{position:absolute;opacity:0;pointer-events:none;width:100%;height:100%;left:0;top:0}
.ddbtn{width:100%;min-height:44px;padding:9px 30px 9px 12px;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);
  font:inherit;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;justify-content:flex-start;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
    linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.dd.open .ddbtn{border-color:var(--accent)}
.ddlist{position:absolute;z-index:60;top:calc(100% + 4px);left:0;min-width:100%;
  max-height:min(52vh,340px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.28);padding:4px}
.ddopt{min-height:44px;display:flex;align-items:center;padding:8px 12px;border-radius:8px;
  cursor:pointer;white-space:nowrap}
.ddopt:hover{background:var(--paper3)}
.ddopt.on{background:var(--paper2);font-weight:500}
/* ---- aspect grid ---- */
/* Scrolls sideways rather than shrinking below legibility: thirteen columns at
   24px is 312, which fits a 375px phone, but a longer aspect set or a wider
   body list must be allowed to overflow instead of squeezing the marks. */
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
#aspGrid{display:grid;grid-template-columns:repeat(var(--gcols,13),24px);gap:1px;width:max-content}
.gc{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  font-size:13px;border-radius:4px;background:var(--paper3)}
.gc.blank,.gc.corner{background:transparent}
.gc.hd{background:transparent;color:var(--ink2);font-size:15px}
.gc.self{background:var(--paper2)}
.gc.empty{background:var(--paper3);opacity:.45}
/* A cell with an aspect is a target, and 24px is under the 44px floor. It is
   allowed here because the grid is a reference table, not a primary control:
   every aspect in it is also a row in the transit list and a chord on the
   wheel, and the cell only reveals a label. Tapping the wrong neighbour costs
   a second tap, nothing more. */
.gc.on{cursor:pointer;background:var(--paper2)}
.gc.on:hover,.gc.on:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.gc.hot{background:var(--accentBtn)}
#gridPick{min-height:18px;margin-top:8px}
#gridPick:empty{display:none}
/* ---- aspects and orbs ---- */
.orbrow{display:flex;align-items:center;gap:10px;min-height:44px;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.orbrow:last-child{border-bottom:none}
.orbrow .g{font-size:17px;width:24px;text-align:center}
/* Wrapping, not an ellipsis. "полутораквадрат" and "sesquiquadrate" do not fit
   the column on a 375px phone next to a switch, an angle and a number box, and
   a truncated aspect name is the one thing in this list nobody can guess. The
   row simply gets taller. */
.orbrow .nm{flex:1;font-size:14px;min-width:0;white-space:normal;line-height:1.25;padding:6px 0;
  /* One word can still be wider than the column: полутораквадрат is fifteen
     characters with nowhere to break. */
  overflow-wrap:anywhere}
.orbrow .ang{color:var(--ink3);font-size:12px;width:34px;text-align:right;flex:none}
.orbrow .orb{width:62px;flex:none;padding:7px 6px;text-align:right}
/* A minor aspect is drawn subordinate here too, so the list reads the way the
   wheel does rather than presenting eleven equals. */
.orbrow.minor .nm{color:var(--ink2)}
/* The switch: a 44px label wrapping a real checkbox, so the whole row height is
   the target and the control stays a checkbox for assistive technology. */
.sw{display:inline-flex;align-items:center;flex:none;cursor:pointer;margin:0;padding:0 2px;
  min-height:44px;align-self:stretch}   /* the promise above, measured: it was 23 px */
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw span{display:block;width:38px;height:22px;border-radius:11px;background:var(--paper3);
  border:1px solid var(--line);position:relative;transition:background .15s}
.sw span::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:var(--ink3);transition:transform .15s,background .15s}
.sw input:checked+span{background:var(--accentBtn);border-color:var(--accentBtn)}
.sw input:checked+span::after{transform:translateX(16px);background:var(--accentInk)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* ---- balance ---- */
.balrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-variant-numeric:tabular-nums}
.balrow .nm{width:112px;color:var(--ink2);font-size:13px}
.balrow .n{width:22px;text-align:right;font-weight:500}
.balrow .bar{flex:1;height:8px;border-radius:4px;background:var(--paper3);overflow:hidden}
.balrow .bar i{display:block;height:100%}
.balgrp{margin:2px 0 12px}
.balgrp:last-of-type{margin-bottom:0}
.balgrp h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin:0 0 4px;font-family:inherit;font-weight:500}
.transit{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--paper)}
.transit .app{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3)}
.daysyn{border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--paper3);font-size:14px;line-height:1.55}
.daysyn:empty{display:none}
.transit .head{display:flex;align-items:center;gap:8px;font-size:15px}
.transit .bar{height:6px;border-radius:3px;background:var(--paper3);margin:8px 0;overflow:hidden}
.transit .bar i{display:block;height:100%;background:var(--accent)}
.rate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;cursor:pointer;background:var(--paper2);user-select:none}
.chip.on{background:var(--accentBtn);border-color:var(--accentBtn);color:var(--accentInk)}
.stars{letter-spacing:2px;font-size:18px;cursor:pointer;user-select:none;color:var(--ink3)}
.stars b{color:var(--accent);font-weight:400}
/* Only 400/500 are shipped, so every <b> must be pinned to one of them.
   Left at the default 700 the browser synthesizes a fake bold, which is
   exactly the cross-platform inconsistency self-hosting is meant to remove. */
.detail b{font-weight:500}
.sfact{margin:8px 0 2px;padding-top:8px;border-top:1px solid var(--line)}
.sfact .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.sfact .val{font-size:13px;line-height:1.45}
.sfact .val .dim{color:var(--ink3)}
/* WKWebView ignores window.print() silently, so inside the store build the
   button is removed rather than left there doing nothing. */
html.native #printBtn{display:none}
/* One press, and it says so afterwards. A copy control that gives no feedback
   leaves you pressing it twice and still not knowing. */
.copybtn{font-size:12px;padding:.45em .8em;min-height:32px;position:relative}
/* Drawn at 32px, touched at 44: the extra six above and below are invisible
   and never reach a neighbour, which sits beside it, not above. */
.copybtn::before{content:'';position:absolute;inset:-7px 0}
.copybtn.done{border-color:var(--accent);color:var(--accent)}
.cardhead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.cardhead .sp{flex:1}
#printFactsCard{display:none}
.pf-top{font-size:9pt;color:var(--ink2);margin-bottom:3mm}
.pf-body{break-inside:avoid;page-break-inside:avoid;margin:0 0 3.5mm}
.pf-head{font-size:10pt;font-weight:500;margin-bottom:.8mm}
.pf-head .pf-pos{font-weight:400;color:var(--ink2)}
.pf-row{display:flex;gap:3mm;font-size:8.5pt;line-height:1.35}
.pf-row .lbl{flex:0 0 24mm;color:var(--ink3)}
.pf-row .val{flex:1;min-width:0}
.learn-line{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.learn-line:last-child{border:none}
.learn-line b{color:var(--accent);font-weight:500}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--paper3);color:var(--ink2);margin-left:6px}
/* Inside .wrap like every other card, with the card's own padding. It sat outside
   the wrap with its own max-width and side padding, which on a phone made it the
   one card running edge to edge (iOS build, 10 Oct 2026). */
.foot{color:var(--ink3);font-size:12px}
.foot h2{font-size:14px;color:var(--ink3);font-weight:500}
/* The note sits under its row rather than inside it: the row is already a
   grid of five things on a 375 px phone, and a sixth would squeeze the name. */
/* 16 px and 44 high like every other field: at 12 px iOS zoomed the page the
   moment a note was tapped. It only showed once the library held a saved chart,
   which is why the field check missed it until a real one was saved. */
.libnote{width:100%;font-size:16px;min-height:44px;margin:-4px 0 8px;padding:6px 10px}
/* The tagline answers "what is this" for someone who lands on the web page
   cold. In the store build the listing has already answered it, and by the
   time the app opens it is a paragraph of vertical space above the fold on a
   phone, spent on something the reader already knows. */
html.native .tagline{display:none}

/* ---------- craft layer (Apple design principles) ----------
   Scope note: this is a reading surface driven by taps, not drags. So the
   gesture machinery (springs, velocity handoff, momentum projection,
   rubber-banding) is deliberately NOT used - there is nothing here to throw
   or grab mid-flight. What applies is response, materials, type and a11y. */

/* Response (§1): every interactive surface answers on pointer-DOWN, instantly.
   Compositor-only properties (transform/opacity) so nothing drops a frame. */
button,.chip,.stars span,details.unit summary,details.fold>summary,.citylist div,.lang button{
  -webkit-tap-highlight-color:transparent;
  transition:transform 100ms ease-out,background-color 120ms ease-out,
             border-color 120ms ease-out,opacity 120ms ease-out;
}
button:active,.lang button:active{transform:scale(.97)}
button:disabled{opacity:.42;cursor:default}
button:disabled:active{transform:none}
.chip:active{transform:scale(.94)}
.stars span:active{transform:scale(.88)}
details.unit summary:active .sh{opacity:.55}
details.fold>summary:active h2{opacity:.55}

/* Collapsible reference card: the heading IS the control, so it carries the
   disclosure marker and the press feedback above. */
/* The heading takes the card's padding as its own, so the whole band across
   the top of a closed card is the target: the bare heading was a 23px strip
   inside a 55px card. The card looks the same. */
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  margin:-16px;padding:16px;border-radius:var(--radius)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{margin:0}
details.fold>summary::after{content:'+';margin-left:auto;color:var(--ink3);font-size:15px}
details.fold[open]>summary::after{content:'−'}
details.fold[open]>summary{margin-bottom:-4px}
.citylist div:active{background:var(--paper3)}
@media (hover:hover){

}

/* Hit targets (§10): visually small controls still get a comfortable area */
.stars span{display:inline-block;padding:2px 3px}
.chip{padding:7px 11px}

/* Craft (§16): keyboard focus is visible and consistent */
/* No border-radius here: the outline already follows each element's own
   radius, and setting one would reshape the pill chips (999px) on focus. */
:where(button,.chip,input,summary,.stars span):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;

/* Materials & depth (§12): translucent chrome with content scrolling under,
   and a soft edge fade where content meets it instead of a hard 1px rule. */
header{
  position:sticky;top:0;z-index:30;
  background:var(--glass);

/* While a text field has focus the header stops being sticky. With the keyboard
   open iOS shifts the visible area to keep the field above it, and a sticky header
   rides that shift up under the clock and the Dynamic Island - seen in the iOS
   build on 10 Oct 2026, and the same in Safari on an iPhone. Unstuck, it is only
   the top of the page, scrolled away like the rest; it comes back on blur. Sticky
   and static take the same space in the flow, so nothing below moves. A plugin
   would have fixed the app alone; this fixes the web build too. */
html:not(.native) body:has(input:not([type=checkbox]):not([type=radio]):not([type=range]):focus) header{position:static}

      <div class="tiny" id="backupLine"></div>
      <div class="row">

             can open it in a spreadsheet, fix a birth time and put it back. -->
        <button id="expCsv" data-i="exportCsv"></button>
        <button id="impCsv" data-i="importCsv"></button>
        <input id="impFile" type="file" accept=".csv,text/csv" hidden>
      </div>
    </div>
  </div>
</dialog>

<!-- The way back. One line at the bottom, for a few seconds, after anything that

<div class="toast" id="toast" role="status" aria-live="polite" hidden>

  <button type="button" id="toastBtn" hidden></button>
</div>

<div class="wrap">

  <!-- On the web a stranger arrives cold and this answers "what is this". In

       you can open rather than three fields you have to look past. Once a chart

  <div class="card" id="formCard">

    <!-- Atlas download progress. Sits under the city field because that is the

      <div class="citywrap" id="synaPick" hidden>

      <div class="tiny" style="margin-top:8px" data-i="posnote"></div>

      <div class="tiny" style="margin-top:8px" data-i="confNote"></div>

    <details class="card fold" id="gridCard">

    <details class="card fold" id="exportCard">
      <summary><h2 data-i="exportTitle"></h2><span class="tiny" data-i="exportBrief"></span></summary>
      <div class="tiny" data-i="exportNote" style="margin-bottom:10px"></div>

    </details>

    <!-- Paper only. Every body under the same headings, so the whole

    <section class="card" id="printFactsCard" aria-hidden="true">
      <h2 data-i="sheetTitle"></h2>
      <div id="printFacts"></div>
    </section>

    <!-- Element, modality and hemisphere tallies. Counts only, no verdict:

    <details class="card fold" id="balCard">
      <summary><h2 data-i="balance"></h2><span class="tiny" id="balBrief"></span></summary>
      <div id="balance"></div>
      <div class="tiny" style="margin-top:8px" data-i="balnote"></div>

    <div class="card" id="readingCard">

  <div class="card" id="emptycard">

       store listing rather than on every screen: the agreement with JPL and the
       promise that nothing leaves the device are things you read once and then

  <details class="card fold foot" id="aboutCard">
    <summary><h2 data-i="aboutTitle"></h2></summary>
    <div class="tiny" data-i="foot"></div>
  </details>

</div>

const APP_VERSION='3.19.0';
document.getElementById('ver').textContent=APP_VERSION;

/* ---------- feature flags ----------

   model that ranks by it. Switched off for the 2.0 release because the corpus

   this app. Nothing is deleted: TAG_TOKENS, every compose* function, the whole

   back by flipping this to true. What the flag hides:

  positions:{ru:'Позиции',en:'Positions'},
  posnote:{ru:'Движок: подгонки к JPL DE441 для Венеры, Земли, Марса, Юпитера, Сатурна, Урана, Нептуна, Плутона и Хирона, полный VSOP87D для Меркурия, ELP82B с поправкой к JPL для Луны, равноденствие даты по IAU 2006, как у Swiss Ephemeris; целиком офлайн. Сверено с JPL Horizons на 1550-2250: расхождение не больше 0,25″. Узлы средние. Чёрная Луна средняя или истинная, на выбор; Селена считается по определению Swiss Ephemeris. Плутон рассчитан на 1550-2250, за этими годами он стоит на положении края и неверен. Хирон рассчитан на 1600-2250: раньше решения JPL для него нет, и вне этого отрезка приложение его не показывает.',en:'Engine: fits to JPL DE441 for Venus, the Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto and Chiron, VSOP87D in full for Mercury, ELP82B corrected to JPL for the Moon, the equinox of date by IAU 2006 as in Swiss Ephemeris; fully offline. Checked against JPL Horizons over 1550-2250: within 0.25″. Nodes are mean. The Black Moon is mean or true, your choice; Selena follows the Swiss Ephemeris definition. Pluto is computed for 1550-2250; beyond those years it is held at the edge and is not right. Chiron covers 1600-2250: JPL has no solution for it earlier, and outside that span the app leaves it out.'},
  reading:{ru:'Разбор карты',en:'Reading'},
  corpusnote:{ru:'Тексты - структурная заготовка: кратко + подробнее по касанию. Настоящий корпус интерпретаций подключается отдельно.',en:'Texts are a structural stub: short + detail on tap. The real interpretation corpus plugs in separately.'},
  ringLabel:{ru:'Тип карты',en:'Chart type'},
  /* Says which ring the list and the grid belong to, because with three rings
     on the wheel that is the one thing a reader cannot see. Labels go in as
     nominatives after a colon, which keeps every language's grammar out of it. */
  note_tri:{ru:'Внутри: натал. В середине: {1}. Снаружи: {2}. Список и сетка аспектов относятся к среднему кольцу.',
    en:'Inner: natal. Middle: {1}. Outer: {2}. The aspect list and the grid read the middle ring.'},
  /* Named for the chart it draws, not for the ring being empty. Astro Gold,
     Solar Fire and LUNA all call this a chart type and all call this one
     Natal; "empty" describes our implementation rather than the thing chosen. */
  ring_none:{ru:'Натальная карта',en:'Natal'},
  note_none:{ru:'Натальная карта сама по себе. Она же остаётся внутренним колесом, когда выбран другой тип: так делают Solar Fire, Astro Gold и LUNA - неподвижная рамка внутри, движущееся снаружи.',en:'The natal chart on its own. It stays the inner wheel under every other type too, the way Solar Fire, Astro Gold and LUNA all do it: the fixed frame inside, what moves against it outside.'},
  ring_solar:{ru:'Соляр',en:'Solar return'},
  ring_lunar:{ru:'Лунар',en:'Lunar return'},
  ring_composite:{ru:'Композит',en:'Composite'},
  /* These three notes did not exist until v3.11.0, and the card printed the
     raw key - "note_solar" - in every language since the modes arrived in
     v3.8.0. Each says what the code does, not what returns are in general. */
  note_solar:{ru:'Действующий соляр: последний момент, когда Солнце вернулось в свой натальный градус, на место рождения или на место релокации. Действует до следующего.',
    en:'The return in effect: the last moment the Sun came back to its natal degree, cast for the birthplace or the relocated place. It holds until the next one.'},
  note_lunar:{ru:'Действующий лунар: последний момент, когда Луна вернулась в свой натальный градус, на место рождения или на место релокации. Действует около 27 дней, до следующего.',
    en:'The return in effect: the last moment the Moon came back to its natal degree, cast for the birthplace or the relocated place. It holds for about 27 days, until the next one.'},
  note_composite:{ru:'Одна карта из двух: каждая планета в ближней средней точке между двумя картами. Дома строятся от средней точки двух MC на средней широте.',
    en:'One chart made from two: each planet at the nearer midpoint between the two charts. The houses are built from the midpoint of the two Midheavens at the average latitude.'},
  ring_synastry:{ru:'Синастрия',en:'Synastry'},
  note_synastry:{ru:'Карта другого человека поверх вашей. Внутреннее колесо и дома остаются вашими, аспекты считаются от его планет к вашим.',en:'Another person\u2019s chart over yours. The inner wheel and the houses stay yours; the aspects run from their planets to yours.'},
  synaFind:{ru:'Кого сравниваем? Имя, город или год',en:'Compare with whom? Name, city or year'},
  synaSwap:{ru:'Поменять кольца местами',en:'Swap the rings'},
  synaInner:{ru:'внутри',en:'inner'},
  synaNone:{ru:'Никто не выбран. Найдите карту выше.',en:'Nobody chosen yet. Find a chart above.'},
  ring_transit:{ru:'Транзиты',en:'Transits'},
  ring_progressed:{ru:'Прогрессии',en:'Progressions'},
  ring_directed:{ru:'Дирекции',en:'Directions'},
  note_transit:{ru:'Где на самом деле находится небо в этот момент.',en:'Where the sky actually is at that moment.'},
  note_progressed:{ru:'Вторичные прогрессии: день эфемерид за год жизни. Углы идут солнечной дугой, около градуса в год.',en:'Secondary progressions: a day of ephemeris for a year of life. The angles move by the solar arc, about a degree a year.'},
  note_directed:{ru:'Соляр-арк: всё натальное смещено на одну дугу, равную пути прогрессивного Солнца от натального. Дома остаются натальными.',en:'Solar arc: everything natal is moved by one arc, the distance the progressed Sun has gone from the natal Sun. The houses stay natal.'},
  age:{ru:'возраст',en:'age'}, arc:{ru:'дуга',en:'arc'},
  progmoment:{ru:'прогрессивный момент',en:'progressed moment'},
  needbirth:{ru:'Постройте карту: прогрессии и дирекции считаются от момента рождения.',en:'Cast a chart first: progressions and directions are measured from the birth moment.'},
  transitdate:{ru:'Дата транзита',en:'Transit date'},
  /* time scrubber */
  scrubintro:{ru:'Тяните ползунок - транзитное кольцо и список пересчитываются на лету. Шаг задаёт, сколько времени в одном делении: от секунды до столетия.',en:'Drag the slider and the transit ring redraws live. The step sets how much time one notch is worth, from a second to a century.'},

  relocClear:{ru:'Вернуть место рождения',en:'Back to the birthplace'},
  relocMark:{ru:'(релокация)',en:'(relocated)'},
  relocNote:{ru:'Тот же момент, другое место. Планеты не сдвигаются - их положения геоцентрические и не зависят от того, где вы стоите; меняются только углы, дома и всё, что от них считается. Часовой пояс нового города ни при чём: момент остался прежним. Релокация сбрасывается при построении новой карты.',en:'The same instant, a different place. The planets do not move: their positions are geocentric and do not depend on where you stand. Only the angles, the houses and everything measured from them change. The new city\u2019s timezone is irrelevant, because the moment has not changed. Relocation resets when a new chart is cast.'},
  conf:{ru:'Конфигурации',en:'Configurations'},
  confNone:{ru:'Крупных фигур в орбисе нет.',en:'No major figures within orb.'},
  confNote:{ru:'Считаются десять планет, без Асцендента, MC и узлов: Асцендент и MC почти всегда стоят около девяноста градусов друг к другу, а узлы всегда строго напротив, и любая такая фигура была бы свойством рамки, а не карты. Орбисы берутся из настройки аспектов. Йод требует включённого квиконса. Коснитесь фигуры, чтобы подсветить её на колесе.',en:'Ten planets, without the Ascendant, Midheaven or nodes: the angles sit near ninety degrees apart in most charts and the nodes are always exactly opposed, so any figure built on them would be a property of the frame rather than of the chart. Orbs come from the aspect settings. A yod needs the quincunx switched on. Tap a figure to light it on the wheel.'},

  asteroidsNote:{ru:'Отдельный файл, около 320 КБ, скачивается один раз при включении и дальше работает офлайн. Подогнано к JPL Horizons, худшее расхождение 0,21 секунды дуги на 1600-2250.',
    en:'A separate file, about 320 KB, downloaded once when you switch this on and offline after that. Fitted to JPL Horizons, worst residual 0.21 arcseconds over 1600-2250.'},

  house3d:{ru:'Дом с учётом широты (3D, только Плацидус)',
    en:'House by latitude as well (3D, Placidus only)'},
  house3dNote:{ru:'Обычные программы ставят тело в дом только по долготе, и колесо рисует его так же. Включённая опция учитывает ещё и эклиптическую широту: на 4% положений ответ меняется, чаще всего у Плутона. Тогда глиф на колесе и номер дома в тексте могут разойтись.',
    en:'Ordinary programs place a body by longitude alone, and the wheel draws it that way. With this on, ecliptic latitude counts too: about 4% of placements change, most often Pluto. The glyph on the wheel and the house number in the text can then disagree.'},

  rulers_both:{ru:'Оба набора',en:'Both'},
  rulersNote:{ru:'Современные: Плутон управляет Скорпионом, Уран Водолеем, Нептун Рыбами, а Марс, Сатурн и Юпитер там коуправители. Классические: только семь видимых планет. Оба набора: у этих трёх знаков по два управителя, и цепочка диспозиторов может ветвиться. Секта, экзальтации и фазы относительно Солнца одинаковы во всех трёх.',
    en:'Modern: Pluto rules Scorpio, Uranus Aquarius, Neptune Pisces, and Mars, Saturn and Jupiter are co-rulers there. Traditional: the seven visible planets only. Both: each of those three signs has two rulers, so a chain of dispositors can branch. Sect, exaltations and solar phase are the same in all three.'},
  sfFinals:{ru:'Конечные диспозиторы',en:'Final dispositors'},
  rulersBy_modern:{ru:'Достоинства и диспозиторы считаются по современным управителям: Плутон, Уран и Нептун управляют Скорпионом, Водолеем и Рыбами, Марс, Сатурн и Юпитер там коуправители.',
    en:'Dignities and dispositors use the modern rulers: Pluto, Uranus and Neptune rule Scorpio, Aquarius and Pisces, with Mars, Saturn and Jupiter as co-rulers there.'},
  rulersBy_classical:{ru:'Достоинства и диспозиторы считаются по классическим управителям, только семь видимых планет.',
    en:'Dignities and dispositors use the traditional rulers, the seven visible planets only.'},
  rulersBy_both:{ru:'Достоинства и диспозиторы считаются по обоим наборам управителей: у Скорпиона, Водолея и Рыб по два, поэтому цепочки диспозиторов ветвятся.',

  sectIn:{ru:'в секте',en:'in sect'}, sectContrary:{ru:'вне секты',en:'contrary to sect'},
  solCazimi:{ru:'казими',en:'cazimi'}, solCombust:{ru:'сожжение',en:'combust'},
  solUnderBeams:{ru:'под лучами',en:'under the beams'}, solFree:{ru:'вне лучей',en:'free of the beams'},
  gridNote:{ru:'Десять планет, Хирон, Асцендент и MC. Знак в клетке - аспект, коснитесь клетки, чтобы увидеть пару и орбис. Без внешнего кольца таблица треугольная: верхняя половина повторяла бы нижнюю. С внешним кольцом строки - его тела, столбцы - ваши.',en:'The ten planets, Chiron, the Ascendant and the Midheaven. The mark in a cell is the aspect; tap a cell for the pair and the orb. Without an outer ring the grid is triangular, since the upper half would repeat the lower. With one, the rows are its bodies and the columns are yours.'},
  aspects:{ru:'Аспекты и орбисы',en:'Aspects and orbs'},
  orbReset:{ru:'Вернуть по умолчанию',en:'Reset to defaults'},
  orbNote:{ru:'Орбис в градусах. Минорные выключены по умолчанию: со всеми включёнными аспектов в карте становится примерно в полтора раза больше - на 60 картах библиотеки 11.6 против 16.4. Настройка действует и на натал, и на внешнее кольцо, где орбис дополнительно ограничен скоростью тела.',en:'Orbs in degrees. The minors are off by default: with all of them on a chart carries about half as many aspects again - 11.6 against 16.4, measured across 60 charts from the library. The setting applies to the natal chart and to the outer ring, where the orb is additionally capped by the speed of the body.'},

  balnote:{ru:'Считаются десять планет плюс Асцендент и MC, каждое тело весит одинаково. Хирон сюда не входит: это счёт, который совпадает с учебниками. Полушария - по домам: восток это дома 10-3, верх это дома 7-12.',en:'Ten planets plus the Ascendant and MC, each body weighted the same. Chiron is not counted here, so the tally matches the books. Hemispheres are by house: east is houses 10-3, south is houses 7-12.'},

   language, then English. */
function t(k){
  const add=I18N[LANG];
  if(add&&add[k]!==undefined) return add[k];
  return LX(STR[k])!==undefined?LX(STR[k]):k;

const D2R=Math.PI/180, R2D=180/Math.PI;
const rev=x=>{x=x%360;return x<0?x+360:x;};
const sind=x=>Math.sin(x*D2R), cosd=x=>Math.cos(x*D2R), tand=x=>Math.tan(x*D2R);
const atan2d=(y,x)=>rev(Math.atan2(y,x)*R2D);
const asind=x=>Math.asin(x)*R2D;

function dayNumber(y,m,day,utHours){
  let yy=y, mm=m;
  if(mm<=2){ yy-=1; mm+=12; }
  const A=Math.floor(yy/100), B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(yy+4716))+Math.floor(30.6001*(mm+1))+day+B-1524.5;
  return jd-2451543.5+utHours/24;
}
/* ---------- ephemeris: VSOP87D reduced to apparent geocentric ---------- */
/* vsop87d.js holds the series; it gives heliocentric ecliptic coordinates of
   date, good to about 0.4". Four corrections stand between that and the
   longitude an astrologer's table prints, and every one of them is larger
   than 0.4", so none can be skipped:
     TT vs UT   - 69 s today, which is 2.8" of Sun
     light-time - 8 minutes for the Sun, 4 hours for Neptune
     aberration - up to 20.5", the largest of the four
     nutation   - up to 17.2" in longitude
   Anything that stopped after the series would be precise and wrong. */

/* TT - UT in seconds, the way JPL Horizons converts a time given as "UT",
   so that anyone repeating our check there gets the same instant.
     -500 to 1972: JPL's own values (Stephenson, Morrison and Hohenkerk's
       reconstruction of Earth's rotation), every five years to 1550 and every
       year after, fetched from Horizons by tools-deltat.mjs. Before 1650 the
       models disagree by up to 20 seconds - Swiss Ephemeris has another - and
       no program can do better: Earth's rotation then is not known closer.
     1972 to the last announced leap second: TT minus UTC exactly, 32.184 s
       plus the leap seconds. A birth time is clock time, the clock has kept
       UTC since 1972, and the smoothed TT minus UT1 this used before was up
       to a second off, half an arcsecond of Moon.
     After 2027: a projection and nothing more. Earth's rotation has hardly
       changed since 2020, so it starts flat and bends upward at the long-term
       tidal rate of Stephenson et al. (32.5 s per century squared). The old
       projection reached 93 s by 2050 and 221 s by 2100; this gives 71 and 87,
       near Swiss Ephemeris's 75 and 93, where astro.com and its users are.

/* VSOP87D series evaluation. VS/VF come from vsop87d.js. */
/* 'pl' and 'ch' are not VSOP series names - there are none. They are markers
   that send the body to its own Chebyshev fit instead. */
const VKEY={Sun:'ea',Pluto:'pl',Chiron:'ch',Mercury:'me',Venus:'ve',Mars:'ma',Jupiter:'ju',Saturn:'sa',Uranus:'ur',Neptune:'ne',
  Ceres:'as',Pallas:'as',Juno:'as',Vesta:'as'};
function vsSum(a,t){
  let s=0;
  for(let i=0;i<a.length;i+=3){ const f=a[i+2]; s+=a[i]*Math.cos(a[i+1]+(f<0?0:VF[f]*t)); }
  return s;
}
function vsCoord(k,c,t){                       // Horner over the powers of t
  const w=VS[k][c]; let s=0;
  for(let i=w.length-1;i>=0;i--) s=s*t+vsSum(w[i],t);
  return s;
}
/* VSOP87 speaks its own dynamical frame; Meeus 32.3 turns it into FK5,
   which is where JPL's ecliptic is. Measured: the Sun, Mercury and Venus sat
   0.19" ahead of Horizons on average without it, 0.10" with it. */
function vsopXYZ(k,t){
  let L=vsCoord(k,0,t), B=vsCoord(k,1,t); const R=vsCoord(k,2,t);
  const T=t*10, Lp=L-(1.397*T+0.00031*T*T)*D2R;
  L+=(-0.09033+0.03916*(Math.cos(Lp)+Math.sin(Lp))*Math.tan(B))*ASR;
  B+=0.03916*(Math.cos(Lp)-Math.sin(Lp))*ASR;
  const cb=Math.cos(B);
  return [R*cb*Math.cos(L), R*cb*Math.sin(L), R*Math.sin(B)];
}
/* Venus, Mars and Jupiter to Neptune come from planets.js, Chebyshev fits to
   JPL DE441 over 1550-2250 (tools-planets.mjs), and from VSOP87D outside that
   span. The truncated series drifted: Neptune by 1.5" a century and 5.8" at
   the edges, Mars 1.4". The fits hold Venus and Mars to 0.007", Jupiter to
   0.005", Saturn, Uranus and Neptune to 0.07-0.15" (their heliocentric orbits
   carry the Sun's own small, fast wobble, which a long segment cannot follow).
   Mercury stays on VSOP87D, within 0.34": its 88-day orbit would need a
   segment a fortnight long, megabytes for seven centuries. */

/* Jupiter to Neptune, Pluto and Chiron are fitted about the solar-system
   barycentre, where their orbits are smooth, and brought to the Sun here.
   About the Sun they carry the Sun's own wobble from Venus and the Earth,
   months long and some hundreds of km, which a segment of years cannot follow;
   that held them at 0.15-0.2". The Sun's place about the barycentre follows
   from the masses (DE430 Sun/planet ratios) and the planets themselves:
   x_sun = -(sum mu_i h_i + sum mu_j b_j) / (1 + sum mu_i), inner bodies by
   their heliocentric fits h, outer by their barycentric fits b. Mercury is
   left out: its 10 km pull moves Jupiter by 0.003" at the closest. */

const MU_OUT=[['JupiterB',1/1047.348625],['SaturnB',1/3497.901768],['UranusB',1/22902.981613],
  ['NeptuneB',1/19412.237346],['PlutoB',1/136566000]];

function sunBary(t){
  if(SUN_CACHE.has(t)) return SUN_CACHE.get(t);
  let x=[0,0,0], m=1;
  for(const [n,mu] of MU_IN){ const F=fitOf(n), p=F&&chebFit(F,t); if(!p) return null;

    x=[x[0]+mu*p[0],x[1]+mu*p[1],x[2]+mu*p[2]]; }

  const n=BARY_OF[k], F=n&&fitOf(n), b=F&&chebFit(F,t); if(!b) return null;

/* A body's coefficients arrive as base-36 integers of 1e-9 AU and are decoded
   the first time it is asked for: nobody waits for a planet nobody cast. */
function fitOf(n){
  const F=typeof PLANET_FIT!=='undefined'&&PLANET_FIT[n]; if(!F) return null;
  if(!F.c){
    const v=F.e.split(','), m=F.deg+1, c=[]; let i=0;
    for(let s=0;s<F.nseg;s++){ const sg=[];
      for(let k=0;k<3;k++){ const a=new Float64Array(m); for(let j=0;j<m;j++) a[j]=parseInt(v[i++],36)*1e-9; sg.push(a); }
      c.push(sg); }

  }

/* The Earth is the Earth-Moon barycentre less its share of the Moon: the
   barycentre's orbit is smooth enough to fit, the Earth's carries a monthly
   wobble of 4,700 km that no year-long segment follows. The Moon comes from
   ELP82B, and its arcsecond of error moves the Earth by 0.006" here. */

function earthFromEMB(B,t){
  const T=t*10, r=moonXYZ(T,true), d=Math.hypot(r[0],r[1],r[2]);
  const [l,b]=precessEcl(Math.atan2(r[1],r[0]),Math.asin(r[2]/d),T), k=d/AU_KM*EM_RATIO;
  return [B[0]-k*Math.cos(b)*Math.cos(l), B[1]-k*Math.cos(b)*Math.sin(l), B[2]-k*Math.sin(b)];

/* A fit is read a day past either end without clamping: light-time asks for
   the planet hours before the moment, and at the very first day of the span
   a clamp froze it there - 3" of Pluto on 1 January 1550. A Chebyshev series
   is still exact that close to its edge. */
function chebFit(F,tm){
  const jd=2451545.0+tm*365250, end=F.jd0+F.seg*F.nseg;
  if(jd<F.jd0-1||jd>end+1) return null;
  const s=Math.max(0,Math.min(F.nseg-1,Math.floor((jd-F.jd0)/F.seg)));
  const u=2*(jd-(F.jd0+s*F.seg))/F.seg-1;
  return [chebEval(F.c[s][0],u),chebEval(F.c[s][1],u),chebEval(F.c[s][2],u)];

function helioXYZ(k,t){
  if(k==='ea'){ const F=fitOf('EMB'), B=F&&chebFit(F,t); if(B) return earthFromEMB(B,t); return vsopXYZ(k,t); }

  const n=FIT_OF[k], F=n&&fitOf(n);
  if(F){ const p=chebFit(F,t); if(p) return p; }

   three-year period, and a mean point is a definition rather than something
   to measure, so the definition is taken from them - the way Selena already
   is - fitted by tools-lilith.py to pyswisseph's own mean apogee over
   1550-2250: 419" apart before, 1.45" at worst after. Arcseconds. */
const LILITH_SE=[0.00309894,-0.523091,0.0146409,-416.428,0.555731,-0.000948028,-0.357118,0.42254,0.0118464,0.00426637,0.00128607,-0.00122891,-0.000201895,0.000529881,0.000819176,0.00312869,-0.00783827,-0.00235146,-0.00201408,-0.000970817,0.0014588,-0.000317422,-0.00066922,-0.0135237,0.0029447,-0.00653433,-0.0066382];

/* True (osculating) Black Moon: the apogee of the ellipse the Moon is actually
   on at this instant, rather than the averaged one. The two disagree by up to
   30 degrees, a whole sign, and the true one turns retrograde, so this is a
   different point and not a refinement of the same number - both are offered.

   Method: take the Moon's geocentric position and velocity from ELP82B, build
   the eccentricity vector e = ((v^2 - mu/r) r - (r.v) v) / mu, which points at
   perigee, and read the ecliptic direction of -e. Geometric position only: no
   light-time and no aberration, because the apsidal line is a property of the
   orbit and not something we observe arriving. */
const GM_EM=403503.2415*86400*86400;    // km^3/day^2, Earth + Moon
/* Five-point stencil rather than a central difference: over the h below the
   Moon turns about half a degree, and the O(h^2) error of a plain central
   difference lands in the fourth digit of the velocity, which the eccentricity
   vector then divides by e = 0.055 and turns into arc-minutes of apogee. */
function moonVel(t){
  const h=1e-6;                          // Julian centuries, about 53 minutes
  const a=moonXYZ(t+2*h), b=moonXYZ(t+h), c=moonXYZ(t-h), d=moonXYZ(t-2*h);
  const k=1/(12*h*36525);                // ... and per day, not per century
  return [(-a[0]+8*b[0]-8*c[0]+d[0])*k,(-a[1]+8*b[1]-8*c[1]+d[1])*k,(-a[2]+8*b[2]-8*c[2]+d[2])*k];

function lilithTrue(T,dpsi){
  const r=moonXYZ(T), v=moonVel(T);

  const rv=r[0]*v[0]+r[1]*v[1]+r[2]*v[2];
  const k1=(v2-GM_EM/rr)/GM_EM, k2=rv/GM_EM;
  const ex=k1*r[0]-k2*v[0], ey=k1*r[1]-k2*v[1], ez=k1*r[2]-k2*v[2];
  const em=Math.hypot(ex,ey,ez);
  if(!(em>1e-6)) return null;            // a circular osculating orbit has no apsis
  const [l2,b2]=precessEcl(Math.atan2(-ey,-ex),Math.asin(-ez/em),T);
  const w=to2006([Math.cos(b2)*Math.cos(l2),Math.cos(b2)*Math.sin(l2),Math.sin(b2)],T);
  return {lon:rev(Math.atan2(w[1],w[0])*R2D+dpsi*R2D), lat:Math.asin(w[2])*R2D};
}

const SELENA={d0:0, lon0:242.00932, rate:5143.5418158/36525};

/* NFD first, then strip the combining marks: without the decomposition step

   "Ростов на Дону" did not find Ростов-на-Дону, nor "Saint-Petersburg" Saint
   Petersburg. */
function normStr(s){
  return (s||'').normalize('NFD').toLowerCase().replace(/[̀-ͯ]/g,'')
    .replace(/[-‐‑‒–—.'’ʼ`]+/g,' ').replace(/\s+/g,' ');

/* The atlas is searched as one flat string rather than 235k objects: building
   objects costs about 90 MB of heap on a phone and half a second of parse,
   while indexOf over a single normalised blob answers in a few milliseconds and
   allocates only for the eight rows actually shown. */
const ATLAS={state:'idle', tz:[], body:'', blob:'', rowAt:null, foldAt:null};
function atlasParse(text){
  const nl=text.indexOf('\n');
  ATLAS.tz=text.slice(0,nl).split(',');
  const body=text.slice(nl+2);                 // header line, blank line, then rows
  ATLAS.body=body;
  /* Each row contributes "\n" + folded local name + "\n" + folded Russian name
     to one blob, plus "\n" + the ASCII alias where the row carries one (Zürich
     is also findable as Zuerich). Every name therefore starts right after a
     newline, which is what lets one "\n"+query search find a prefix in any of
     them; a plain query search then finds it anywhere inside a name. */
  const rowAt=[], foldAt=[], parts=[], aliasUsed=new Set();
  let pos=0, at=0;
  while(pos<body.length){
    let e=body.indexOf('\n',pos); if(e===-1) e=body.length;
    const t1=body.indexOf('\t',pos), t2=body.indexOf('\t',t1+1);
    const f=body.slice(pos,e).split('\t');
    let folded='\n'+normStr(f[0])+'\n'+normStr(f[1]);
    if(f[6]) folded+='\n'+normStr(f[6]);
    const ak=f[4]+'|'+f[0], al=CITY_ALIASES[ak];
    if(al&&!aliasUsed.has(ak)){ aliasUsed.add(ak); al.split(';').forEach(n=>{ folded+='\n'+normStr(n); }); }
    rowAt.push(pos); foldAt.push(at); at+=folded.length; parts.push(folded);
    pos=e+1;
  }
  ATLAS.blob=parts.join('');
  ATLAS.rowAt=Int32Array.from(rowAt);
  ATLAS.foldAt=Int32Array.from(foldAt);
  ATLAS.state='ready';
}
function atlasRow(i){
  const body=ATLAS.body, s=ATLAS.rowAt[i];
  const e=i+1<ATLAS.rowAt.length?ATLAS.rowAt[i+1]-1:body.length;
  const f=body.slice(s,e).split('\t');
  return {r:f[1]||f[0], e:f[0], c:f[4],
    lat:parseInt(f[2],36)/1e4, lon:parseInt(f[3],36)/1e4,
    z:ATLAS.tz[parseInt(f[5],36)]};
}
/* Blob offset -> row index. The blob is built in row order, so the row is the
   last one whose folded text starts at or before the match. */
function atlasRowOf(at){
  const a=ATLAS.foldAt; let lo=0, hi=a.length-1, i=0;
  while(lo<=hi){ const m=(lo+hi)>>1; if(a[m]<=at){i=m;lo=m+1;} else hi=m-1; }
  return i;
}

function atlasProgress(frac,msgKey){
  const box=document.getElementById('atlasBar');
  if(!box) return;
  box.hidden=false;
  document.getElementById('atlasFill').style.width=Math.round(Math.min(1,frac)*100)+'%';
  document.getElementById('atlasMsg').textContent=
    msgKey==='atlasFail' ? t('atlasFail')
    : `${t('atlasLoading')} · ${Math.round(Math.min(1,frac)*100)}%`;
  document.getElementById('atlasNote').textContent=
    msgKey==='atlasFail' ? '' : t('atlasOnce').replace('{n}',ATLAS_PLACES.toLocaleString(LANG));

  rt.hidden=msgKey!=='atlasFail';
  rt.textContent=t('atlasRetry');
}

const libTz=e=>{
  /* tzo is an exact offset carried by the entry itself, for charts whose time
     came from a civil register already reduced to a named zone. It beats any
     lookup: the instant is then right even where the coordinates are not. */
  if(e.tzo!=null) return e.tzo;
  const hh=e.t==null?12:e.t;
  return placeOffset(e.z,e.lon,e.y,e.mo,e.d,Math.floor(hh),Math.round((hh%1)*60));
};

/* Whether the twelve cusps run round the circle once, in either direction.
   Forward they always do outside the polar circles; turned round there, as
   Swiss Ephemeris turns Regiomontanus and Campanus, they run backwards. */
function cuspsRunOneWay(c){
  let fwd=0, back=0;
  for(let h=0;h<12;h++){ fwd+=rev(c[(h+1)%12]-c[h]); back+=rev(c[h]-c[(h+1)%12]); }
  return Math.abs(fwd-360)<1e-6||Math.abs(back-360)<1e-6;

/* The house a longitude falls in, in whichever direction the cusps run. The
   forward reading alone put every planet in house 1 once the cusps had been
   turned round beyond the polar circle: each span read as 330 degrees. Checked
   against swe.house_pos at Tromso for Regiomontanus and Campanus. */
function houseOf(lon,cusps){
  let fwd=0; for(let h=0;h<12;h++) fwd+=rev(cusps[(h+1)%12]-cusps[h]);
  const back=Math.abs(fwd-360)>1e-6;
  for(let h=0;h<12;h++){

/* A body is not on the ecliptic, and it rises and culminates from where it
   actually is. Pluto stands up to 17.5 degrees off it, the Moon 5, and taking
   the longitude alone puts them in the neighbouring house often enough to
   fabricate a result: a study run on this app produced a 3-sigma "finding"
   for Pluto that was nothing but this projection.
   Placidus trisects each body's OWN semi-arc, so the house follows from the
   body's hour angle measured against that arc - not from where its longitude
   happens to fall between cusps. */
function eqFromEcl(lon,lat,ecl){
  const cb=cosd(lat), sb=sind(lat);
  const x=cb*cosd(lon);
  const y=cb*sind(lon)*cosd(ecl)-sb*sind(ecl);
  const z=cb*sind(lon)*sind(ecl)+sb*cosd(ecl);
  return {ra:atan2d(y,x), dec:asind(z)};

function placidusHousePos(lon,lat,ramc,geolat,ecl){
  const {ra,dec}=eqFromEcl(lon,lat,ecl);
  let ha=rev(ramc-ra); if(ha>180) ha-=360;        // west of the meridian is positive
  const t=tand(dec)*tand(geolat);

   contradiction inside one screen: on Pieter de Hooch's chart the wheel drew
   Venus at 7°58′ Aquarius, plainly before the twelfth cusp at 10°53′ Aquarius,
   and the text beside it said house 12. Reported by a reader checking our own
   printed cusps against our own printed house numbers, which is exactly the
   check the export block invites. Measured across 340 library charts: 4.12% of
   placements differed, Pluto worst at 82 of 210 because of its inclination.

   The latitude-aware form is a real technique and the code for it is kept, but
   it is an option and it is off. Astrolog, which offers it, calls it "3D

   technique nobody else applies by default must not be applied by us silently,

   to 12 are "above" only where cusps 1 and 7 are the Ascendant and the
   Descendant; in whole signs the first house starts at 0 degrees of the
   rising sign, so a Sun that rose forty minutes ago sits in house 1 and the
   chart was being called nocturnal. The altitude is the definition, so it is
   used directly: equatorial coordinates from the ecliptic ones, hour angle
   from the local sidereal time the chart already carries. Geocentric, no
   refraction - the horizon an astrologer draws, not the one a camera sees. */

  const b=ch.pos[name]; if(!b) return null;
  const l=b.lon*D2R, bt=(b.lat||0)*D2R, e=ch.ecl*D2R, f=ch.geolat*D2R;

  const H=ch.ramc*D2R-ra;
  return Math.asin(Math.sin(f)*Math.sin(dec)+Math.cos(f)*Math.cos(dec)*Math.cos(H))*R2D;

      because "Pluto disposits nothing back into the seven, so chains end on a

     classical  the seven visible planets. Astro Gold computes its house
                dispositors and almutens this way whatever else is chosen.
     both       each of the three signs has two rulers, both full: a body in
                Pisces is disposed by Neptune AND by Jupiter, so a chain can
                branch, both receive it, and both rule a Pisces house.
   Measured on the library as it stood in September 2026: the single final
   dispositor differed between modern and classical in about one chart in six. Not a cosmetic choice.

   What does NOT change with it: sect, solar phase, angularity, and the
   exaltations and falls of the seven. The outer planets get no exaltation in
   any mode, because the sources disagree - Solar Fire's own table puts Uranus
   in Scorpio and says Neptune "may also be considered" exalted in Cancer or in
   Pisces - and picking one would be a decision dressed up as a calculation. */
const RULER_MODES=['modern','classical','both'];
const RULER_KEY='astrarium_rulers';
let RULER_MODE=RULER_MODES.includes(localStorage.getItem(RULER_KEY))
  ? localStorage.getItem(RULER_KEY) : 'modern';
/* The rulers of a sign under a mode, modern first. Every reader of rulership
   in the layer goes through this, so the three modes cannot drift apart one
   field at a time - which is how the modern canon once leaked into the
   classical layer, through a shared dignity() nobody had looked at. */
function rulersOf(s,mode=RULER_MODE){
  if(mode==='classical') return [CLASSICAL_RULERS[s]];
  if(mode==='modern') return [MODERN_RULERS[s]];
  const a=MODERN_RULERS[s], b=CLASSICAL_RULERS[s];

/* Only these seven appear as values above, so only they can hold a chain, and
   only they have essential dignity: the outers and Chiron take a dispositor
   like any other body but are never one, which is also what guarantees every
   walk ends. */
const TRAD_BODIES=['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn'];
const SECT_OF={Sun:'diurnal',Jupiter:'diurnal',Saturn:'diurnal',
  Moon:'nocturnal',Venus:'nocturnal',Mars:'nocturnal'};
/* Cazimi 17' and combust 8°30' are Lilly's figures; under the beams at 15° is
   the Hellenistic one (Lilly's own is 17°). The mix is the one most
   traditional practice uses today, and it is named as a mix, not as Lilly. Kept as one table so that changing a
   threshold is one edit and not a hunt. */
const SOLAR_LIMITS={cazimi:17/60, combust:8.5, underBeams:15};

   the aspect engine. The two lists are the same four and must stay so; the
   test suite compares them rather than trusting this comment. */
const FACT_POINTS=['NNode','SNode','Lilith','Selena','Fortune'];

/* Essential dignity on the classical tables, used when RULER_MODE is
   'classical' and by nothing else. It exists separately because the modern
   canon once leaked into the traditional layer through a shared dignity()
   that read modern rulers and co-rulers at once: Pluto in Scorpio came out
   "ruler", and Aquarius had two. That function is gone; dignityOf() below
   picks this one or the modern reading by mode.

   Three values and they are not interchangeable. A dignity name is the state.
   'peregrine' means a body that COULD hold dignity and holds none here. null
   means a body outside the scheme altogether - the outers and Chiron have no
   traditional dignity, and calling them peregrine would quietly enrol them. */
function classicalDignity(p,s){
  if(!TRAD_BODIES.includes(p)) return null;
  if(CLASSICAL_RULERS[s]===p) return 'ruler';
  if(EXALT[p]===s) return 'exalt';
  const o=(s+6)%12;
  if(CLASSICAL_RULERS[o]===p) return 'detriment';
  if(EXALT[p]===o) return 'fall';
  return 'peregrine';
}
/* Dignity under the chosen rulers. Classical is the function above, untouched.
   Modern gives the outers their domicile and detriment and calls Mars in
   Scorpio, Saturn in Aquarius and Jupiter in Pisces co-rulers, which is how
   the ZET manual puts it. Both makes those co-rulers full rulers, because in
   that mode they are: they dispose, they receive, they rule the house. */
function dignityOf(p,s,mode=RULER_MODE){
  if(mode==='classical') return classicalDignity(p,s);
  const o=(s+6)%12;
  if(rulersOf(s,mode).includes(p)) return 'ruler';
  if(CLASSICAL_RULERS[s]===p) return 'coRuler';
  if(EXALT[p]===s) return 'exalt';
  if(rulersOf(o,'both').includes(p)) return 'detriment';
  if(EXALT[p]===o) return 'fall';
  return TRAD_BODIES.includes(p)?'peregrine':null;
}
/* The second dignity a body can hold in the same sign. Only Mercury does: in
   Virgo it rules and is exalted, in Pisces it is in detriment and in fall.
   One value kept only the first, and the card said "detriment" where Solar
   Fire and Astro Gold say Det, Fall. The first stays the dignity (the chain,
   the reception and the parity contract read it); this one is shown beside it. */
function dignityAlso(p,s,first){
  if(first==null||!TRAD_BODIES.includes(p)) return null;
  const o=(s+6)%12;
  if((first==='ruler'||first==='coRuler')&&EXALT[p]===s) return 'exalt';
  if(first==='detriment'&&EXALT[p]===o) return 'fall';
