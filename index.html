/* Runs before any paint so the page never flashes the wrong theme. Until the
   switch is touched there is nothing stored and the system decides; after
   that the stored choice holds. */

/* Self-hosted so the app looks identical on every OS: system fonts would
   render as SF Pro on Apple, Roboto on Android and Segoe on Windows. Both
   families carry purpose-drawn Cyrillic (not auto-derived), subset to
   Latin+Cyrillic+the symbols the UI actually draws, pinned to the two weights
   the CSS uses. Inter also covers the rating stars and prime marks, so those
   never fall back to a platform symbol font. */
@font-face{font-family:'Inter';src:url(./inter-400.woff2) format('woff2');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Inter';src:url(./inter-500.woff2) format('woff2');
  font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Literata';src:url(./literata-500.woff2) format('woff2');
  font-weight:500;font-style:normal;font-display:swap}
:root{
  /* Palette solved for contrast, not picked by eye: every text/background pair
     clears WCAG AA. The old one failed twice, labels at 2.63:1 in light and the
     primary button's white text at 2.70:1 in dark, against 4.5:1 required. */
  --paper:#f9f7f3; --paper2:#f4f0e9; --paper3:#ede7da; --line:#e1d8c6;
  --ink:#201d18; --ink2:#686050; --ink3:#746c5b;
  --accent:#9d5d25; --accentBtn:#aa6428; --accentInk:#ffffff;
  /* Chart colours solved the same way: lines hold 3.5:1 against the wheel
     ground, sector fills keep glyphs above 12:1. MC was identical to harm
     before, so the MC axis and harmonious aspects were the same colour. */
  --axis:#ce5692; --mc:#976bd4;
  --harm:#4683c9; --hard:#cb614c; --conj:#2a9256;
  --wheelbg:#f4f2ee;
  --fire:#e3bdaa; --earth:#8cd685; --air:#d4c57d; --water:#9cccde;
  --radius:16px;
  --glass:rgba(246,242,234,.72);
}
:root[data-theme="dark"]{
    /* Night sky rather than dark paper: deep indigo, no pure black, surfaces
       lifted step by step. Button text is dark on the light accent, which is
       what fixes the 2.70:1 failure and reads better besides. */
    --paper:#100f17; --paper2:#171520; --paper3:#201e2c; --line:#332f43;
    --ink:#e7e6ea; --ink2:#9693a6; --ink3:#827e93;
    --accent:#bc773a; --accentBtn:#bc773a; --accentInk:#12101e;
    --wheelbg:#0f0d19;
    --axis:#b13e78; --mc:#7f50c2; --harm:#3a6ba4;
    --hard:#a94e3b; --conj:#2a774a;
    --fire:#583321; --earth:#1d4519; --air:#433c19; --water:#1d414e;
    --glass:rgba(16,15,23,.72);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font:15px/1.5 'Inter',system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%; padding:0 0 60px;
}
h1,h2,h3,.serif{font-family:'Literata',Georgia,"Times New Roman",serif;font-weight:500}
header{padding:20px 20px 8px;max-width:760px;margin:0 auto;display:flex;align-items:flex-start;gap:12px}
header .ht{flex:1}
header h1{font-size:26px;margin:0;letter-spacing:.2px}
/* Version rides the title so it is obvious from a phone whether the build in
   front of you is the one that was just deployed. */
header h1 .ver{font-size:11px;font-weight:400;letter-spacing:.04em;color:var(--ink3);
  vertical-align:.55em;margin-left:5px;font-feature-settings:'tnum' 1}
header p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}
.card h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin:0 0 4px}
input,select{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--paper3);color:var(--ink);padding:9px 14px}

   across a phone, and a native select gets the platform's own picker. It sits

.langsel{width:auto;flex:none;min-height:34px;padding:4px 22px 4px 10px;font-size:13px;letter-spacing:.04em;
  border-radius:9px;background:var(--paper2);

.lang button{min-height:32px;display:inline-flex;align-items:center;justify-content:center}

/* ---- time scrubber ---- */
/* Reuses the language switch's segmented look, one row, full width, with 44px

.lang.ringsw button{flex:1;padding:0 14px;min-height:44px;font-size:13px;white-space:nowrap}
/* Wheel and controls share one screen, so the wheel gets whatever height is

/* A 32px thumb on a 4px rail: the rail is a hairline you read, the thumb is a

   Safari and Chrome disagree about everything else on a range input. */

  background:transparent;margin:0 0 6px;touch-action:none}
#scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
#scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;
  margin-top:-11px;border-radius:50%;background:var(--accentBtn);border:2px solid var(--paper);

button.ico{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}

button.ico svg{width:18px;height:18px;flex:none}

a{color:var(--accent)}

/* ---------- craft layer (Apple design principles) ----------
   Scope note: this is a reading surface driven by taps, not drags. So the
   gesture machinery (springs, velocity handoff, momentum projection,
   rubber-banding) is deliberately NOT used - there is nothing here to throw
   or grab mid-flight. What applies is response, materials, type and a11y. */

/* Response (§1): every interactive surface answers on pointer-DOWN, instantly.
   Compositor-only properties (transform/opacity) so nothing drops a frame. */
button,.chip,.stars span,details.unit summary,details.fold>summary,.citylist div,.lang button{
  -webkit-tap-highlight-color:transparent;
  transition:transform 100ms ease-out,background-color 120ms ease-out,
             border-color 120ms ease-out,opacity 120ms ease-out;
}
button:active,.lang button:active{transform:scale(.97)}
button:disabled{opacity:.42;cursor:default}
button:disabled:active{transform:none}
.chip:active{transform:scale(.94)}
.stars span:active{transform:scale(.88)}
details.unit summary:active .sh{opacity:.55}
details.fold>summary:active h2{opacity:.55}

/* Collapsible reference card: the heading IS the control, so it carries the
   disclosure marker and the press feedback above. */
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{margin:0}
details.fold>summary::after{content:'+';margin-left:auto;color:var(--ink3);font-size:15px}
details.fold[open]>summary::after{content:'−'}
details.fold[open]>summary{margin-bottom:12px}
.citylist div:active{background:var(--paper3)}
@media (hover:hover){
  button:hover,.chip:hover{border-color:var(--ink3)}
}

/* Hit targets (§10): visually small controls still get a comfortable area */
.stars span{display:inline-block;padding:2px 3px}
.chip{padding:7px 11px}

/* Craft (§16): keyboard focus is visible and consistent */
/* No border-radius here: the outline already follows each element's own
   radius, and setting one would reshape the pill chips (999px) on focus. */
:where(button,.chip,input,summary,.stars span):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}

/* Materials & depth (§12): translucent chrome with content scrolling under,
   and a soft edge fade where content meets it instead of a hard 1px rule. */
header{
  position:sticky;top:0;z-index:30;
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
}
header::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:14px;
  background:linear-gradient(var(--glass),transparent);pointer-events:none;
}

/* Type (§15): tracking is size-specific - tighten as text grows, leave body
   near 0, and keep the positive tracking on uppercase micro-labels. */
header h1{letter-spacing:-.02em;line-height:1.1}
.card h2{letter-spacing:-.01em;line-height:1.25}

/* Reveal (§7): the unit opens along one short path and settles in place */
details.unit[open] .dt{animation:unitIn 240ms cubic-bezier(.2,.7,.2,1) both}
@keyframes unitIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* Accessibility signals (§14): a gentler equivalent, never "no feedback" */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  details.unit[open] .dt{animation:none}
  button:active,.chip:active,.stars span:active,.lang button:active{
    transform:none;opacity:.6;
  }
}
@media (prefers-reduced-transparency:reduce){
  header{background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none}
  header::after{display:none}
}
@media (prefers-contrast:more){
  .card,.transit,.chip,button,input{border-color:var(--ink2)}
  header{background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* NFD first, then strip the combining marks: without the decomposition step
   "Zürich" keeps its precomposed ü and never matches a typed "zurich". */
function normStr(s){ return (s||'').normalize('NFD').toLowerCase().replace(/[̀-ͯ]/g,''); }

/* The atlas is searched as one flat string rather than 235k objects: building
   objects costs about 90 MB of heap on a phone and half a second of parse,
   while indexOf over a single normalised blob answers in a few milliseconds and
   allocates only for the eight rows actually shown. */
const ATLAS={state:'idle', tz:[], body:'', blob:'', rowAt:null, foldAt:null};
function atlasParse(text){
  const nl=text.indexOf('\n');
  ATLAS.tz=text.slice(0,nl).split(',');
  const body=text.slice(nl+2);                 // header line, blank line, then rows
  ATLAS.body=body;
  /* Each row contributes "\n" + folded local name + "\n" + folded Russian name
     to one blob, plus "\n" + the ASCII alias where the row carries one (Zürich
     is also findable as Zuerich). Every name therefore starts right after a
     newline, which is what lets one "\n"+query search find a prefix in any of
     them; a plain query search then finds it anywhere inside a name. */
  const rowAt=[], foldAt=[], parts=[];
  let pos=0, at=0;
  while(pos<body.length){
    let e=body.indexOf('\n',pos); if(e===-1) e=body.length;
    const t1=body.indexOf('\t',pos), t2=body.indexOf('\t',t1+1);
    const f=body.slice(pos,e).split('\t');
    let folded='\n'+normStr(f[0])+'\n'+normStr(f[1]);
    if(f[6]) folded+='\n'+normStr(f[6]);
    rowAt.push(pos); foldAt.push(at); at+=folded.length; parts.push(folded);
    pos=e+1;
  }
  ATLAS.blob=parts.join('');
  ATLAS.rowAt=Int32Array.from(rowAt);
  ATLAS.foldAt=Int32Array.from(foldAt);
  ATLAS.state='ready';
}
function atlasRow(i){
  const body=ATLAS.body, s=ATLAS.rowAt[i];
  const e=i+1<ATLAS.rowAt.length?ATLAS.rowAt[i+1]-1:body.length;
  const f=body.slice(s,e).split('\t');
  return {r:f[1]||f[0], e:f[0], c:f[4],
    lat:parseInt(f[2],36)/1e4, lon:parseInt(f[3],36)/1e4,
    z:ATLAS.tz[parseInt(f[5],36)]};
}
/* Blob offset -> row index. The blob is built in row order, so the row is the

/* Before standard time a birth was recorded in local mean time, so those
   entries take longitude/15 - and the birthplace's own longitude, not the
   zone's reference city, which can sit a quarter hour away.
   From 1900 the offset comes from the tz database through Intl, the same
   path the form uses, rather than from a constant written here by hand. */
const libTz=e=>{
  /* tzo is an exact offset carried by the entry itself, for charts whose time
     came from a civil register already reduced to a named zone. It beats any
     lookup: the instant is then right even where the coordinates are not. */
  if(e.tzo!=null) return e.tzo;
  const hh=e.t==null?12:e.t;
  const off=e.z==null?null:ianaOffset(e.z,e.y,e.mo,e.d,Math.floor(hh),Math.round((hh%1)*60));
  /* A standard zone offset is always a whole quarter hour. When the database
     answers with something else it is reporting local mean time, because the
     place had not adopted standard time yet - and then it is the LMT of the
     zone's reference city, which can be a quarter hour from the birthplace.
     So take the database when it names a real zone, and compute local mean
     time from the birthplace's own longitude when it does not. This is why
     the rule is not a year: Brno was already on Central European Time in
     1897, while Eisenach in 1685 was on nothing but the Sun. */
  if(off==null||Math.abs(off*60-Math.round(off*60/15)*15)>0.01) return LMT(e.lon);
  return off;
};

function houseOf(lon,cusps){
  for(let h=0;h<12;h++){

    if(rev(lon-a)<span) return h+1;

/* A body is not on the ecliptic, and it rises and culminates from where it
   actually is. Pluto stands up to 17.5 degrees off it, the Moon 5, and taking
   the longitude alone puts them in the neighbouring house often enough to
   fabricate a result: a study run on this app produced a 3-sigma "finding"
   for Pluto that was nothing but this projection.
   Placidus trisects each body's OWN semi-arc, so the house follows from the
   body's hour angle measured against that arc - not from where its longitude
   happens to fall between cusps. */
function eqFromEcl(lon,lat,ecl){
  const cb=cosd(lat), sb=sind(lat);
  const x=cb*cosd(lon);
  const y=cb*sind(lon)*cosd(ecl)-sb*sind(ecl);
  const z=cb*sind(lon)*sind(ecl)+sb*cosd(ecl);
  return {ra:atan2d(y,x), dec:asind(z)};
}
function placidusHousePos(lon,lat,ramc,geolat,ecl){
  const {ra,dec}=eqFromEcl(lon,lat,ecl);
  let ha=rev(ramc-ra); if(ha>180) ha-=360;        // west of the meridian is positive
  const t=tand(dec)*tand(geolat);
  if(!isFinite(t)||Math.abs(t)>=1) return null;   // never rises or never sets
  const ad=asind(t), dsa=90+ad, nsa=90-ad;
  let p;
  if(Math.abs(ha)<=dsa)  p=10-3*(ha/dsa);         // above the horizon
  else if(ha>dsa)        p=7-3*((ha-dsa)/nsa);    // below, west of the IC
  else                   p=4-3*((180+ha)/nsa);    // below, east of the IC
  return ((p-1)%12+12)%12+1;
}

function bodyHouse(ch,name){
  const b=ch.pos[name]; if(!b) return null;

    const p=placidusHousePos(b.lon,b.lat,ch.ramc,ch.geolat,ch.ecl);
    if(p!=null) return Math.floor(p);
  }
  return houseOf(b.lon,ch.houses.cusps);
}

    for(const asp of ASPECTS){const orb=Math.abs(diff-asp.angle);if(orb<=asp.orb){out.push({p1:BODIES[a],p2:BODIES[b],asp,orb});break;}}

   aspects to the karmic points. This is what the node/Lilith/Selena readings
   (and their aspect-configuration checks) need instead. */
function aspectsInvolving(ch,key){
  const lon=ch.pos[key].lon;
  // the nodes are always exactly opposite each other by definition - not a
  // meaningful, informative aspect, so that pairing is never reported
  const skip=(key==='NNode'&&'SNode')||(key==='SNode'&&'NNode');
  const others=BODIES.concat(POINTS.filter(k=>ch.pos[k])).filter(k=>k!==key&&k!==skip);

  others.forEach(o=>{
    let diff=Math.abs(rev(ch.pos[o].lon-lon)); if(diff>180)diff=360-diff;

   name. Two variants per aspect kill word-for-word repeats when a chart has,
   say, two oppositions. */

/* ---------- what the outer ring is showing ----------
   The inner wheel is always the natal chart. The outer ring is one of three
   things, and all three are driven by the same slider, because all three are
   a function of one moment.

   TRANSIT - where the sky actually is at that moment.

   PROGRESSED - secondary progressions, a day of ephemeris for a year of life.
   The progressed moment is birth + (elapsed tropical years) days, and the
   planets are read there.

   The angles need a rule of their own, and the choice matters. Casting the
   progressed moment as an ordinary chart looks tempting and is wrong for this
   purpose: the progressed moment's time of day drifts through a whole day
   over each year of life, so its sidereal time - and with it the Midheaven -
   goes round the entire circle every year. That is the quotidian method, a
   real technique but not what "progressed Ascendant" means to almost anyone.
   Here the angles move by the solar arc instead, which is the common default:
   progressed MC = natal MC + arc, and the Ascendant and cusps are rebuilt
   from that Midheaven at the birth latitude. About a degree a year, smooth.

   DIRECTED - solar arc. Every natal body and both angles move by one arc, the
   arc being the distance the progressed Sun has travelled from the natal Sun,
   which is close to a degree a year. Read against the natal cusps, since
   nothing about the houses is being directed.

   The Moon is a transiting body only in the last two: at thirteen degrees a
   day it swamps a transit list, but the progressed Moon at a degree a month

const RING_MODES=['transit','progressed','directed'];
let RING_MODE=RING_MODES.includes(localStorage.getItem('astrarium_ring'))
  ? localStorage.getItem('astrarium_ring') : 'transit';
const TROPICAL_YEAR=365.242190;
/* How far ahead to look when deciding applying or separating. A progressed or

   four ten-thousandths of a degree and the comparison would be measuring
   rounding rather than motion. */
const PROBE_MS={transit:3600000, progressed:7*86400000, directed:30*86400000};
/* Two ways to move time, on purpose.

   Dragging uses these lengths and interpolates continuously, so the wheel
   turns smoothly under the finger instead of snapping between whole units.
   A month here is the average month and a year the tropical year, which is
   what you want while sweeping and not what you want when stepping.

   one press of "month" from 31 January lands on 28 February, not 2 March.
   Smooth where it is being aimed, exact where it is being counted. */
const UNIT_MS={sec:1000, min:60000, hour:3600000, day:86400000, week:604800000,
  month:30.436875*86400000, year:TROPICAL_YEAR*86400000,
  dec:10*TROPICAL_YEAR*86400000, cent:100*TROPICAL_YEAR*86400000};
function progressedMs(ch,ms){
  return BIRTH_MS==null?ms:BIRTH_MS+(ms-BIRTH_MS)/TROPICAL_YEAR;
}
/* Ascendant and house cusps rebuilt from a Midheaven that was moved by hand.
   Same construction the natal chart uses, run backwards from MC to RAMC. */
function anglesFromMC(mc,lat,ecl){
  const ramc=atan2d(sind(mc)*cosd(ecl),cosd(mc));
  let asc=atan2d(cosd(ramc),-(sind(ramc)*cosd(ecl)+tand(lat)*sind(ecl)));

/* Positions for the outer ring, plus its own angles. */
function outerChart(ch,ms){

  const arc=rev(pr.pos.Sun.lon-ch.pos.Sun.lon);
  const mc=rev(ch.mc+arc);
  const a=anglesFromMC(mc,ch.geolat,ch.ecl);

    return {...pr, mc, asc:a.asc, ramc:a.ramc, houses:a.houses, arc};
  const pos={};
  Object.keys(ch.pos).forEach(k=>{ pos[k]={...ch.pos[k], lon:rev(ch.pos[k].lon+arc)}; });

const RING_MOVERS={
  transit:['Jupiter','Saturn','Uranus','Neptune','Pluto','Mars','Sun','Venus','Mercury'],
  progressed:['Moon','Sun','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto'],
  directed:['Moon','Sun','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto']
};
function aspectOrbs(ch,tp){
  const hits=[];
  const receivers=BODIES.concat(['ASC','MC','NNode','Lilith']);
  RING_MOVERS[RING_MODE].forEach(T=>{
    if(!tp[T]) return;
    receivers.forEach(np=>{
      const nlon=np==='ASC'?ch.asc:np==='MC'?ch.mc:(ch.pos[np]?ch.pos[np].lon:null);
      if(nlon==null)return;
      let diff=Math.abs(rev(tp[T].lon-nlon));if(diff>180)diff=360-diff;
      /* Progressed and directed points move about a degree a year, so a
         six-degree orb would keep an aspect "active" for six years and the
         list would never change. One degree is the working convention. */
      const cap=RING_MODE==='transit'?SPEED_ORB[T]+2:1;

/* Applying or separating, decided by looking rather than by table: the same

   long enough that the Moon's 33 arc-minutes dwarf any rounding and short
   enough that nothing changes aspect. */
function markApplying(ch,tp,tpLater,hits){
  const later=new Map();
  aspectOrbs(ch,tpLater).forEach(h=>later.set(`${h.tp}.${h.asp.name}.${h.np}`,h.orb));
  hits.forEach(h=>{
    const o2=later.get(`${h.tp}.${h.asp.name}.${h.np}`);

function personalWeight(o,h){

const sig=h=>`${h.tp}.${h.asp.name}.${h.np}`;

/* Nominative subjects only, so the verb carries agreement and no case form

const T_TOUCH={

function transitText(o,h){

/* Synthesized read of the whole day: merges the top hits' planet+aspect

/* ---------- the time scrubber ----------
   One moment, held in UTC milliseconds, drives the transit ring, the transit
   list and the readout. Everything that moves time goes through setMoment, so
   there is exactly one place where the moment can become inconsistent with
   what is drawn.

   The moment is UT because that is what the ephemeris consumes and what makes
   a scrub reproducible; the birthplace's own clock is shown underneath at the
   offset the chart was cast with, which is a display convenience and does not
   track later daylight-saving changes at that place. */
const SCRUB_UNITS=[['sec','u_sec'],['min','u_min'],['hour','u_hour'],['day','u_day'],

/* Calendar steps, not millisecond steps, for month and up: adding "a month" to
   31 January must not land in March, and adding "a year" to 29 February must
   not land on 1 March. Both are clamped to the last valid day instead. */
function addUnits(ms,n,unit){
  if(unit==='sec') return ms+n*1000;
  if(unit==='min') return ms+n*60000;
  if(unit==='hour') return ms+n*3600000;
  if(unit==='day') return ms+n*86400000;
  if(unit==='week') return ms+n*604800000;

  d.setUTCDate(1);

  else d.setUTCFullYear(d.getUTCFullYear()+n*(unit==='year'?1:unit==='dec'?10:100));
  const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
  d.setUTCDate(Math.min(day,last));
  return d.getTime();
}
/* Date.UTC maps years 0-99 onto 1900-1999, which would silently move a chart by

function utcMs(y,mo,da,hh,mi,ss){
  const d=new Date(0);
  d.setUTCFullYear(y,mo-1,da);
  d.setUTCHours(hh||0,mi||0,ss||0,0);
  return d.getTime();
}
function momParts(ms){
  const d=new Date(ms);

const pad2=x=>String(x).padStart(2,'0');
function momText(ms,offH){

function transitChartAt(ch,ms){

let scrubQueued=false;
function scrubDraw(){

function setMoment(ms,{recenter=false}={}){

function renderTransits(ch){

      <div class="tiny">${PN(h.tp)} ${LX(ASPECT_NAME)[h.asp.name]} ${PN(h.np)} · ${t('orb')} ${fmtOrb(h.orb)}${weight}</div>
      <div class="bar"><i style="width:${Math.round(intensity*100)}%"></i></div>
      ${rating}</div>`;
  }).join('');
  if(FEATURES.interpretation){
    box.querySelectorAll('.stars span[data-r]').forEach(st=>st.addEventListener('click',e=>rate(ranked,e.currentTarget.parentElement.dataset.sig,{r:+e.currentTarget.dataset.r})));

/* Degrees and arc-minutes, not tenths of a degree: at a one-second step the
   whole point is to watch an orb close, and 0.1 degrees is six arc-minutes of
   nothing happening. */
function fmtOrb(o){
  const d=Math.floor(o), m=Math.round((o-d)*60);
  return m===60?`${d+1}°00'`:`${d}°${pad2(m)}'`;
}
function rate(hits,s,patch){
  const o=learn(),hit=hits.find(x=>sig(x.h)===s); if(!hit)return; const h=hit.h;
  let obs=o.obs.find(x=>x.sig===s&&Date.now()-x.t<86400000*3);
  if(!obs){obs={sig:s,t:Date.now(),tp:h.tp,np:h.np,asp:h.asp.name,r:null,val:null,area:null};o.obs.push(obs);}
  Object.assign(obs,patch); obs.t=Date.now();
  o.feat={};
  o.obs.forEach(x=>{
    const rv=x.r!=null?x.r:1.5, vv=x.val==='hard'?-1.5:x.val==='easy'?1.5:x.val==='neutral'?0:null;
    ['tp:'+x.tp,'np:'+x.np,'as:'+x.asp].forEach(k=>{const f=o.feat[k]=o.feat[k]||{rSum:0,rN:0,vSum:0,vN:0};if(x.r!=null){f.rSum+=rv;f.rN++;}if(vv!=null){f.vSum+=vv;f.vN++;}});
    if(x.area){const k='ar:'+x.area;o.feat[k]=o.feat[k]||{rSum:0,rN:0,vSum:0,vN:0};o.feat[k].rN++;}
  });
  saveLearn(o); renderTransits(CURRENT);
}

     19 px of arc - fourteen bodies on a 300 px circle leaves no more, and

     way and this is the one that always works. */
  box.querySelectorAll('.planet-row.hit').forEach(r=>{

/* ---------- chart balance ----------
   Counts, and only counts. Which element is short is a fact about the chart;
   what a short element means about the person is not, so nothing here says it.
   Twelve bodies: the ten planets plus the Ascendant and Midheaven, each worth
   one. Weighting schemes exist (luminaries double, angles half) and every
   school has a different one, so this uses the only version that needs no
   defending. Hemispheres take the ten planets alone, the angles being the
   boundaries themselves. */
const ELEM_KEYS=['el_fire','el_earth','el_air','el_water'];
const MODE_KEYS=['mo_card','mo_fix','mo_mut'];
function chartBalance(ch){
  const el=[0,0,0,0], mo=[0,0,0], hemi={e:0,w:0,n:0,s:0};
  const bodies=BODIES.concat(['ASC','MC']);
  bodies.forEach(p=>{
    const lon=p==='ASC'?ch.asc:p==='MC'?ch.mc:(ch.pos[p]?ch.pos[p].lon:null);
    if(lon==null) return;
    const s=Math.floor(rev(lon)/30);
    el[s%4]++; mo[s%3]++;
  });
  BODIES.forEach(p=>{
    if(!ch.pos[p]) return;
    const h=bodyHouse(ch,p);
    if(h>=10||h<=3) hemi.e++; else hemi.w++;
    if(h<=6) hemi.n++; else hemi.s++;
  });
  return {el,mo,hemi,total:bodies.filter(p=>p==='ASC'||p==='MC'||ch.pos[p]).length};
}
function balBar(name,n,total,colour){
  const pct=total?Math.round(n/total*100):0;
  return `<div class="balrow"><span class="nm">${name}</span><span class="n">${n}</span>`
    +`<span class="bar"><i style="width:${pct}%;background:${colour}"></i></span></div>`;
}
function renderBalance(ch){
  const b=chartBalance(ch);
  const grp=(title,rows)=>`<div class="balgrp"><h3>${title}</h3>${rows}</div>`;
  let h='';
  h+=grp(t('elements'),
    ELEM_KEYS.map((k,i)=>balBar(t(k),b.el[i],b.total,ELEM_VAR[i])).join(''));
  h+=grp(t('modes'),
    MODE_KEYS.map((k,i)=>balBar(t(k),b.mo[i],b.total,'var(--accent)')).join(''));
  h+=grp(t('hemi'),
    [['hemi_e',b.hemi.e],['hemi_w',b.hemi.w],['hemi_n',b.hemi.n],['hemi_s',b.hemi.s]]
      .map(([k,n])=>balBar(t(k),n,BODIES.length,'var(--ink3)')).join(''));
  document.getElementById('balance').innerHTML=h;
  /* The summary line carries the tally so the card answers without opening. */
  document.getElementById('balBrief').textContent=

/* Russian needs three forms where English needs two, so the count cannot be

/* Search over everything visible in a row - name, city, year - because that is
   what a person actually remembers about a chart. Diacritics are folded so

const libFold=s=>(s||'').toLowerCase().replace(/ё/g,'е')

const LIB_SORTS={
  date:{ru:'по дате рождения',en:'by birth date',
        fn:(a,b)=>a.y-b.y||a.mo-b.mo||a.d-b.d},
  name:{ru:'по имени',en:'by name',
        fn:(a,b)=>libFold(a._n).localeCompare(libFold(b._n),LANG)},
  place:{ru:'по месту',en:'by place',
        fn:(a,b)=>libFold(a._c).localeCompare(libFold(b._c),LANG)||a.y-b.y}
};

/* Russian needs three forms where English needs two, so the count cannot be
   a single STR entry. */
/* Plural of "chart". Russian and Ukrainian take the three-way rule, the
   Romance and Germanic languages two, and Georgian keeps the singular after a
   numeral, so it needs only one form. */
const PLURAL={
  en:['chart','charts'], es:['carta','cartas'], fr:['carte','cartes'],
  ru:['карта','карты','карт'], de:['Chart','Charts'], it:['carta','carte'],
  uk:['карта','карти','карт'], ka:['რუკა']
};
function plural(n){
  const f=PLURAL[LANG]||PLURAL.en;
  if(f.length===1) return f[0];
  if(f.length===2) return f[n===1?0:1];
  const a=n%10, b=n%100;
  return a===1&&b!==11 ? f[0] : (a>=2&&a<=4&&(b<12||b>14) ? f[1] : f[2]);
}
function libCountText(n,total){
  /* "5 / 1019 charts" rather than "5 of 1019": the preposition would need a
     case rule in half these languages and carries nothing the slash does not. */
  return total!=null&&total!==n
    ? `${n} / ${total} ${plural(total)}`
    : `${n} ${plural(n)}`;
}
/* Era headings come free from the chronological sort and give the eye
   somewhere to land in a list this long. They are meaningless under the other
   sorts, so they only appear under this one. */
function libEra(y){
  return t(y<1880?'era1':y<1920?'era2':y<1950?'era3':'era4');
}
function renderLibrary(){
  const box=document.getElementById('libList'); if(!box) return;
  const own=savedCharts().map(e=>({...e,_own:1,_n:e.name,_c:e.city}));
  const lib=CHART_LIBRARY.map(e=>({...e,_own:0,_n:LX(e.name),_c:LX(e.city)}));
  const all=own.concat(lib);
  /* The haystack is everything you might remember about an entry: the name,
     the place, the year, what the person did, and the note - which for the
     hand-written entries holds the films they are known for, so "чернобыль"
     finds Guðnadóttir. */
  const kindWords=e=>e._own ? 'моя своя mine'
    : (e.k==='c' ? 'классика классик composer classical'
                 : 'кино кинокомпозитор film score');
  /* Both language variants go into the haystack, not just the displayed one:
     with the app in Russian, "rozsa" typed on a Latin keyboard should still
     find Миклош Рожа. */
  const both=e=>e._own ? [e.name,e.city]
    : [e.name.ru,e.name.en,e.city.ru,e.city.en];
  const q=libFold((document.getElementById('libFind')||{}).value);
  const hit=q ? all.filter(e=>libFold(
      both(e).concat([e.y,kindWords(e),e.src||'']).join(' ')).includes(q)) : all;
  /* Own charts stay on top: they are the ones you came for. */
  const mine=hit.filter(e=>e._own), rest=hit.filter(e=>!e._own);
  rest.sort(LIB_SORTS[LIB_SORT].fn);
  let html=mine.map(e=>libRow(e,true)).join(''), era=null;
  rest.forEach(e=>{
    if(LIB_SORT==='date'){
      const h=libEra(e.y);
      if(h!==era){ era=h; html+=`<div class="libera">${h}</div>`; }
    }
    html+=libRow(e,false);
  });
  box.innerHTML=html||`<div class="tiny" style="padding:8px 0">${t('libNone')}</div>`;
  /* The count is on the closed summary so the section reads as full rather
     than as one more empty fold to skip. */
  const c=document.getElementById('libCount');
  if(c) c.textContent=libCountText(hit.length, all.length);
}

/* ---------- CSV exchange ----------
   A personal chart database is only yours if you can get it out. The format is
   deliberately the dullest possible: RFC 4180 CSV with a header row, one chart
   per line, times as HH:MM and offsets as +HH:MM, so it opens in any
   spreadsheet, survives editing by hand, and can be diffed. Only your own
   saved charts are exported; the built-in library is not yours to carry off.

   Reading is more forgiving than writing: the header decides the column order,
   so a file with the columns rearranged or with extra columns still loads. */
const LIB_CAP=2000;
const CSV_COLS=['name','date','time','utc_offset','latitude','longitude','city','rodden','source'];
const csvCell=v=>{ const s=v==null?'':String(v);
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
function csvParse(text){
  const rows=[]; let row=[], cell='', q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length>1||r[0]!=='');
}
const hhmm=h=>{ const t=Math.round(h*60); return pad2(Math.floor(t/60)%24)+':'+pad2(((t%60)+60)%60); };
function libToCsv(){
  const lines=[CSV_COLS.join(',')];
  savedCharts().forEach(e=>lines.push([
    e.name, `${String(e.y).padStart(4,'0')}-${pad2(e.mo)}-${pad2(e.d)}`,
    e.t==null?'':hhmm(e.t), e.tz==null?'':formatOffset(e.tz),
    e.lat, e.lon, e.city||'', e.rr||'', e.src||''
  ].map(csvCell).join(',')));
  return lines.join('\r\n')+'\r\n';
}
function csvToLib(text){
  const rows=csvParse(text);
  if(rows.length<2) return 0;
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const at=n=>head.indexOf(n);
  if(at('date')===-1||at('latitude')===-1) return -1;
  const have=new Set(savedCharts().map(e=>`${e.name}|${e.y}-${e.mo}-${e.d}|${e.t}`));
  const list=savedCharts(); let n=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const g=k=>{const j=at(k);return j===-1?'':(r[j]||'').trim();};
    const dm=/^(-?\d{1,6})-(\d{1,2})-(\d{1,2})$/.exec(g('date')); if(!dm) continue;
    const tm=/^(\d{1,2}):(\d{2})/.exec(g('time'));
    const lat=parseFloat(g('latitude')), lon=parseFloat(g('longitude'));
    if(isNaN(lat)||isNaN(lon)) continue;
    const t=tm?(+tm[1]+ +tm[2]/60):12;
    const key=`${g('name')}|${+dm[1]}-${+dm[2]}-${+dm[3]}|${t}`;
    if(have.has(key)) continue;
    have.add(key);
    list.unshift({id:'u'+Date.now()+'_'+n, name:g('name')||g('city')||g('date'),
      y:+dm[1], mo:+dm[2], d:+dm[3], t, lat, lon,
      tz:parseOffset(g('utc_offset')), city:g('city'), rr:g('rodden')||'', src:g('source')||''});
    n++;
  }
  localStorage.setItem(LKEY_CHARTS,JSON.stringify(list.slice(0,LIB_CAP)));
  return n;
}
document.getElementById('expCsv').addEventListener('click',()=>{

});

});
/* Живой поиск: перерисовка списка из 150 строк занимает доли миллисекунды,
   поэтому откладывать её нечем и незачем. */
document.getElementById('libFind').addEventListener('input',renderLibrary);
document.getElementById('libSort').addEventListener('change',function(){
  LIB_SORT=this.value; localStorage.setItem('astrarium_libsort',LIB_SORT); renderLibrary();
});
fillLibSort();
renderLibrary();

/* Offline shell. Registered after load so it never competes with first paint,
   and failures stay silent: the app works fine without it, it just loses
   offline. Needs https or localhost, so it is inert on file:// */
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
