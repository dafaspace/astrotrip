/* One facts object per chart per mode. A single cache slot would hand back
   the classical answer after the switch had been moved to modern. */
function factsOf(ch){
  const c=ch.__factsBy||(ch.__factsBy={});
  return c[RULER_MODE]||(c[RULER_MODE]=chartFacts(ch,RULER_MODE));
}
const signOfLon=lon=>Math.floor(rev(lon)/30);
/* Shortest separation between two longitudes, 0 to 180. */
const arcBetween=(a,b)=>{const d=Math.abs(rev(a-b));return d>180?360-d:d;};

function chartFacts(ch,mode=RULER_MODE){
  /* The karmic points are here too. They have no essential dignity and rule no
     house, but "the North Node in Taurus, disposed by Venus" is ordinary
     practice and the walk costs nothing once the signs are known. Leaving them
     out was the same defect as leaving them out of the aspects: drawn on the
     ring, inert everywhere else. */
  const bodies=WHEEL_BODIES.concat(FACT_POINTS).filter(p=>ch.pos[p]);
  const sign={}, house={};
  bodies.forEach(p=>{ sign[p]=signOfLon(ch.pos[p].lon); house[p]=bodyHouse(ch,p); });

  /* ---- sect ----
     The primitives are stored beside the verdict on purpose. Hayz and the
     fuller traditional schemes need "above the horizon" and "diurnal by
     nature" separately, and recovering them from the verdict later is not
     possible. */
  const sunAbove=aboveHorizon(ch,'Sun');
  const chartSect=sunAbove?'day':'night';
  /* Mercury takes the sect of the half of the sky it rises in: ahead of the
     Sun in zodiacal order it rises after, behind it rises before. */
  const mercOriental=ch.pos.Mercury?rev(ch.pos.Mercury.lon-ch.pos.Sun.lon)>180:null;

  const F={
    rulers:mode,
    sect:{chart:chartSect, sunAboveHorizon:sunAbove, sunHouse:house.Sun},
    planets:{}, houses:[], receptions:[], mutualReceptions:[],
    terminals:[], loops:[],
    intercepted:[],
    gaps:['receptions by triplicity, term and face',
          'antiscia and other mirror positions']
  };
  /* Which signs fall on no cusp at all. They have no house ruler under the
     cusp-sign convention used here, and in this very chart there are two of
     them, so reporting the gap in the abstract would have been useless. */
  {
    const onCusp=new Set(ch.houses.cusps.map(signOfLon));
    for(let i=0;i<12;i++) if(!onCusp.has(i)) F.intercepted.push(i);
  }

  /* ---- houses: the sign on each cusp, its ruler, and where that ruler sits ---- */
  for(let h=1;h<=12;h++){
    const cusp=ch.houses.cusps[h-1], s=signOfLon(cusp);
    /* `ruler` is the first of `rulers`, kept because most readers want one
       name; anything that asks "does this body rule this house" reads
       `rulers`, or a Pisces house in both mode would lose Jupiter. */
    const rulers=rulersOf(s,mode), ruler=rulers[0];
    F.houses.push({
      house:h, cuspSign:s, cuspLon:cusp,
      ruler, rulers,
      rulerSign:sign[ruler]!=null?sign[ruler]:null,
      rulerHouse:house[ruler]!=null?house[ruler]:null,
      rulerDignity:sign[ruler]!=null?dignityOf(ruler,sign[ruler],mode):null,
      derivedFrom:['cusp_'+h]
    });
  }

  const angles={ASC:ch.asc, IC:rev(ch.mc+180), DSC:rev(ch.asc+180), MC:ch.mc};

  /* ---- one pass per body ---- */
  bodies.forEach(p=>{
    const s=sign[p], hs=house[p], lon=ch.pos[p].lon;

    /* Dispositor, then the walk. It stops on a planet standing in its own
       sign (the chain's end) or on a planet already seen in this walk (a
       closed loop). Both are real answers; forcing one of them into the
       other is how software quietly simplifies a chart.

       With both sets of rulers a sign can have two, so the walk is a tree and
       every branch is followed to its own end. With one set there is one
       branch and the fields below are exactly what the single walk always
       produced - parity.txt holds the classical answers byte for byte. A body
       standing in a sign it rules, as either ruler, is at home and ends its
       branch there. */
    const dispositors=rulersOf(s,mode).includes(p)?[]:rulersOf(s,mode);
    const paths=[];
    const walk=(cur,chain)=>{
      const at=chain.indexOf(cur);
      if(at>=0){ paths.push({chain,loop:chain.slice(at),terminal:null}); return; }
      const cs=sign[cur];
      if(cs==null){ paths.push({chain,loop:null,terminal:null}); return; }   // not in this chart
      const rs=rulersOf(cs,mode);
      if(rs.includes(cur)){ paths.push({chain,loop:null,terminal:cur}); return; }
      rs.forEach(next=>walk(next,[...chain,cur]));
    };
    walk(p,[]);
    const {chain,loop,terminal}=paths[0];

    /* Which houses this body rules, and the theme it therefore carries into
       the house it occupies. This is the part no mobile app does, and it is
       the cheapest of all of them: the cusp signs are already computed. */
    const rules=F.houses.filter(x=>x.rulers.includes(p)).map(x=>x.house);
    const carries=hs!=null?rules.filter(r=>r!==hs).map(r=>({from:r,into:hs})):[];

    /* Angularity as the category AND the distance, because the category is a
       convention and the distance is a measurement. Later work can use either
       without this having to be recomputed. */
    let nearest=null, dist=999;
    Object.entries(angles).forEach(([k,v])=>{
      const d=arcBetween(lon,v); if(d<dist){dist=d;nearest=k;}
    });
    const angularity=hs==null?null
      :[1,4,7,10].includes(hs)?'angular'
      :[2,5,8,11].includes(hs)?'succedent':'cadent';

    /* Solar condition. The Sun has none by definition, and the categories are
       exclusive, so this is one value rather than three flags. */
    /* Bodies only. Combustion and cazimi are conditions of a planet near the
       Sun; no school applies them to the nodes, the Black Moon, Selena or the
       Lot of Fortune, and the card printed "North Node: combust" in every
       eclipse season. */
    const elong=p==='Sun'||FACT_POINTS.includes(p)?null:arcBetween(lon,ch.pos.Sun.lon);
    const solar=elong==null?null
      :elong<=SOLAR_LIMITS.cazimi?'cazimi'
      :elong<=SOLAR_LIMITS.combust?'combust'
      :elong<=SOLAR_LIMITS.underBeams?'underBeams':'free';

    const natal=SECT_OF[p]||(p==='Mercury'?(mercOriental?'diurnal':'nocturnal'):null);
    /* A point is not a body that happens to be missing its dignity: it is
       outside the scheme, the same as the outers, and it rules nothing. */
    F.planets[p]={
      sign:s, house:hs, lon,
      dignity:dignityOf(p,s,mode),
      dignityAlso:dignityAlso(p,s,dignityOf(p,s,mode)),
      dispositor:dispositors[0]||null,
      dispositors,
      dispositorChain:chain.slice(1),           // without the body itself
      terminal, loop,
      /* Every branch, for both mode; one entry otherwise. */
      branches:paths.map(x=>({via:x.chain.slice(1),terminal:x.terminal,loop:x.loop})),
      rulesHouses:rules, carries,
      angularity, nearestAngle:nearest, distanceToAngle:dist,
      sect:{planet:natal, aboveHorizon:aboveHorizon(ch,p),
            status:natal==null?'neutral':natal===(sunAbove?'diurnal':'nocturnal')
              ?'inSect':'contraryToSect'},
      solar:{condition:solar, elongation:elong},
      derivedFrom:{dispositor:['sign_'+p], rulesHouses:rules.map(r=>'cusp_'+r)}
    };
  });

  /* Every distinct end a chain reaches, and every closed loop, once. */
  const seenT=new Set(), seenL=new Set();
  bodies.forEach(p=>F.planets[p].branches.forEach(b=>{
    if(b.terminal&&!seenT.has(b.terminal)){ seenT.add(b.terminal); F.terminals.push(b.terminal); }
    if(b.loop){ const k=[...b.loop].sort().join('-');
      if(!seenL.has(k)){ seenL.add(k); F.loops.push(b.loop); } }
  }));

  /* ---- receptions ----
     Directed: the receiver is the planet whose sign the other one stands in.
     A mutual reception is not a fact of its own, it is the name for two
     directed ones pointing back at each other, and it is stored that way so
     that nothing downstream counts the pair three times. */
  const recKey=r=>`${r.from}>${r.to}:${r.type}`;
  bodies.forEach(guest=>{
    const s=sign[guest];
    rulersOf(s,mode).forEach(byDom=>{
      if(byDom&&byDom!==guest&&sign[byDom]!=null)
        F.receptions.push({from:byDom,to:guest,type:'domicile',derivedFrom:['sign_'+guest]});
    });
    Object.entries(EXALT).forEach(([host,es])=>{
      if(es===s&&host!==guest&&sign[host]!=null)
        F.receptions.push({from:host,to:guest,type:'exaltation',derivedFrom:['sign_'+guest]});
    });
  });
  const pairSeen=new Set();
  F.receptions.forEach(r=>{
    const back=F.receptions.filter(x=>x.from===r.to&&x.to===r.from);
    if(!back.length) return;
    const k=[r.from,r.to].sort().join('-');
    if(pairSeen.has(k)) return;
    pairSeen.add(k);
    const fwd=F.receptions.filter(x=>x.from===r.from&&x.to===r.to);
    /* The two directions are kept apart. A single `types` list was enough
       while both happened to be domicile, and lost the answer the moment they
       differed: "A receives B by domicile, B receives A by exaltation" is not
       the same arrangement as the reverse, and the pair is the whole point. */
    F.mutualReceptions.push({a:r.from, b:r.to,
      aReceivesB:fwd.map(x=>x.type), bReceivesA:back.map(x=>x.type),
      derivedFrom:[...fwd.map(recKey),...back.map(recKey)]});
  });
  return F;
}

function fmtPos(lon){
  /* Rounded once, in the smallest unit shown, and then split - rounding the
     seconds on their own printed 10°59′60″ for about one position in 120. */
  const unit=SHOW_SECONDS?3600:60;
  let n=Math.round(rev(lon)*unit); if(n>=360*unit) n-=360*unit;
  const s=Math.floor(n/(30*unit)); n-=s*30*unit;
  const dd=Math.floor(n/unit), rest=n-dd*unit;
  const mm=SHOW_SECONDS?Math.floor(rest/60):rest, ss=SHOW_SECONDS?rest%60:0;
  const secPart=SHOW_SECONDS?`${String(ss).padStart(2,'0')}″`:'';
  return {sign:s,html:`${dd}°${String(mm).padStart(2,'0')}′${secPart} <span class="af">${SIGN_GLYPH[s]}</span>`};
}

/* ---------- the Lot of Fortune ----------
   Sect-sensitive, which is the traditional form and the one that makes the Lot
   mean anything: by day Asc + Moon - Sun, by night Asc + Sun - Moon. The
   single formula that ignores sect is a modern simplification and it makes
   every night chart's Lot the mirror of what the tradition computes.

   It is a point, not a body: no dignity, no dispositor of its own, and it does
   not rule a house. It aspects on the same narrowed orb as the other points,
   because it is exactly as sensitive to a minute of birth time as the
   Ascendant it is built from. */
/* ---------- the karmic points aspect too ----------
   Until now they did not. findAspects looped over WHEEL_BODIES, so a Moon
   exactly conjunct the North Node had no chord on the wheel, no line in the
   detail panel, no cell in the grid and no part in any configuration, while
   the glyph sat on the ring looking like a participant. Drawn but inert is the
   worst of the three states, because it reads as an answer.

   They come in on a tighter orb, which is both the usual convention and a
   measured necessity. Across 60 library charts, letting them use the planets'
   orbs takes a chart from 14.4 aspects to 27.5 and the worst case from 25 to

const ASPECT_POINTS=['NNode','SNode','Lilith','Selena','Fortune'];
const POINT_ORB_KEY='astrarium_pointorb';
let POINT_ORB=(()=>{const v=parseFloat(localStorage.getItem(POINT_ORB_KEY));

const isAspectPoint=p=>ASPECT_POINTS.includes(p);

const aspectingBodies=pos=>WHEEL_BODIES.concat(ASPECT_POINTS).filter(p=>pos[p]);

function aspectBetween(l1,l2,cap){
  let diff=Math.abs(rev(l1-l2)); if(diff>180) diff=360-diff;
  for(const asp of ASPECTS){
    const orb=Math.abs(diff-asp.angle);
    if(orb<=(cap==null?asp.orb:Math.min(asp.orb,cap))) return {asp,orb};

function findAspects(pos){
  const out=[], B=aspectingBodies(pos);

    if(nodePair(A,C)) continue;
    const h=aspectBetween(pos[A].lon,pos[C].lon,pairOrbCap(A,C));
    if(h) out.push({p1:A,p2:C,asp:h.asp,orb:h.orb});

/* Aspects to/from ANY point (planet, node, Lilith, Selena) against the 10

   pairs bodies with each other, so it silently never finds aspects to the
   karmic points. This is what the node/Lilith/Selena readings (and their
   aspect-configuration checks) need instead.

   This one feeds the interpretation corpus, and so it stops at the ten planets
   and the four karmic points - the set the corpus was written for. Chiron is
   excluded on purpose: there is no corpus entry for it, and letting it in put
   an extra "Сюда же," sentence into Saturn's card on two library charts, which
   is what half a system looks like from the reader's side. Chiron aspects are
   drawn, listed and tabulated everywhere else. */
const CORPUS_POINTS=['NNode','SNode','Lilith','Selena'];
function aspectsInvolving(ch,key){
  const lon=ch.pos[key].lon;
  // the nodes are always exactly opposite each other by definition - not a
  // meaningful, informative aspect, so that pairing is never reported
  const skip=(key==='NNode'&&'SNode')||(key==='SNode'&&'NNode');
  const others=BODIES.concat(CORPUS_POINTS.filter(k=>ch.pos[k])).filter(k=>k!==key&&k!==skip);
  const out=[];
  others.forEach(o=>{
    let diff=Math.abs(rev(ch.pos[o].lon-lon)); if(diff>180)diff=360-diff;
    for(const asp of ASPECTS){const orb=Math.abs(diff-asp.angle);if(orb<=asp.orb){out.push({p1:key,p2:o,asp,orb});break;}}
  });
  return out.sort((a,b)=>a.orb-b.orb);

      const sv=document.querySelector('#wheel svg'); if(!sv) return;
      const k=(S/WZ.s)/sv.getBoundingClientRect().width;
      WZ.cx-=(e.clientX-prev.x)*k; WZ.cy-=(e.clientY-prev.y)*k; wzClamp(); applyWheelZoom();
      if(Math.hypot(e.clientX-pan.x,e.clientY-pan.y)>6) moved=true;
    }
  });
  const end=e=>{
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if(moved) WZ_GESTURE_AT=Date.now();
    if(pts.size<2) pinch=null;
    if(!pts.size) pan=null;
    if(e.type!=='pointerup'||moved||pts.size) return;
    const now=Date.now();                 // a second tap close by in time and place
    if(lastTap&&now-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30){
      lastTap=null; WZ_GESTURE_AT=now; clearTimeout(WZ_TAP_T);
      if(WZ.s>1) resetWheelZoom(); else wzZoomAt(WZ_STEP,e.clientX,e.clientY);
    }else lastTap={t:now,x:e.clientX,y:e.clientY};
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  /* Touch double taps are handled above; browsers can also fire dblclick for them,
     and answering both would zoom in and straight back out. */
  el.addEventListener('dblclick',e=>{ if(lastType!=='mouse') return;
    if(LAST_PICK&&Date.now()-LAST_PICK.at<700){ const u=LAST_PICK.undo; LAST_PICK=null; u(); }
    if(WZ.s>1) resetWheelZoom(); else wzZoomAt(WZ_STEP,e.clientX,e.clientY); });
  /* A trackpad pinch arrives as a wheel event with ctrlKey; a plain wheel scrolls. */
  el.addEventListener('wheel',e=>{ if(!e.ctrlKey) return; e.preventDefault();
    wzZoomAt(WZ.s*Math.exp(-e.deltaY/100),e.clientX,e.clientY); },{passive:false});
  document.getElementById('wzReset').addEventListener('click',resetWheelZoom);
  addEventListener('resize',()=>{ if(WZ.s>1) applyWheelZoom(); });
  /* Paper gets the whole wheel, and all of it: a body or a figure lit on the
     screen printed as a wheel with every other aspect at 7 percent, and the
     card that explained why is not on paper. The light comes back after. */
  let printLit=null;
  addEventListener('beforeprint',()=>{
    resetWheelZoom(); renderPrintRing();
    if(ISO||CONF_ISO){ printLit={iso:ISO,conf:CONF_ISO}; ISO=null; CONF_ISO=null; redrawWheel(); }
  });
  addEventListener('afterprint',()=>{
    if(printLit){ ISO=printLit.iso; CONF_ISO=printLit.conf; printLit=null; redrawWheel(); }
  });
}

/* ---------- the structural block of the planet card ----------
   It answers one question, "what structural state is this body in", and the
   aspect list below answers a different one, "what is it interacting with".
   They are kept apart on purpose: the interpretation layer will want the two
   separately, and merging them now would have to be undone then.

   Two rules hold this block together. Nothing is shown that has nothing to
   say, so there is never a line reading "Receptions: none" - the panel reports
   structure, it does not demonstrate the completeness of a database. And the
   order is fully determined: receptions by dignity then by planet name, ruled
   houses by number, the chain always starting at the tapped body. The same
   chart therefore always renders identically, which is what makes a screenshot
   comparison possible at all. */
const DIG_KEY={ruler:'digRuler',coRuler:'digCoRuler',exalt:'digExalt',detriment:'digDetriment',
  fall:'digFall',peregrine:'digPeregrine'};
const ANG_KEY={angular:'angAngular',succedent:'angSuccedent',cadent:'angCadent'};
const SOL_KEY={cazimi:'solCazimi',combust:'solCombust',
  underBeams:'solUnderBeams',free:'solFree'};
const REC_KEY={domicile:'sfByDomicile',exaltation:'sfByExaltation'};
const REC_ORDER={domicile:0,exaltation:1};
/* "Юпитер принимает Луна" was wrong: the object takes the accusative. Planet
   names are grammatically inanimate in Russian, so every masculine one already
   matches its nominative and only the two feminine ones need a form. */
const PLANET_ACC={ru:{Moon:'Луну',Venus:'Венеру'}};
const PNacc=n=>((PLANET_ACC[LANG]||{})[n])||PN(n);

/* The dispositors reachable from one body, each listed once with its own
   dispositors, plus every end the walks reach. For both sets of rulers, where
   the walk is a tree: listing the walks themselves was tried first and gave
   the Sun in Spitzweg's chart 32 of them, about a hundred lines in a card. The
   graph has at most one row per body, and says the same thing. */
function dispositorGraph(F,p){
  const order=[], q=[p];
  while(q.length){
    const x=q.shift(); if(order.includes(x)||!F.planets[x]) continue;
    order.push(x); F.planets[x].dispositors.forEach(d=>q.push(d));
  }
  const f=F.planets[p];
  const ends=[...new Set(f.branches.filter(b=>b.terminal).map(b=>b.terminal))];
  const seenL=new Set(), loops=[];
  f.branches.forEach(b=>{ if(!b.loop) return; const k=[...b.loop].sort().join('-');
    if(!seenL.has(k)){ seenL.add(k); loops.push(b.loop); } });
  return {rows:order.filter(x=>F.planets[x].dispositors.length).map(x=>[x,F.planets[x].dispositors]),
    ends, loops};
}
const cycleText=(l,arrow,pair)=>l.length===2?l.map(PN).join(pair):[...l,l[0]].map(PN).join(arrow);
/* The lines, once. The panel stacks them and the print sheet lays them across,
   and two copies of this logic would have drifted the first time a label
   changed on one side only - which is the defect this repo has paid for before
   in two apps that shared button CSS. */
function structureLines(ch,p){
  const F=factsOf(ch);
  const f=F.planets[p]; if(!f) return null;
  const out=[];

  /* Dispositors. Three distinct endings and they are not interchangeable: the
     body stands in its own sign, the walk reaches a body that does, or the
     walk closes into a cycle. "Cycle" and not "pair" because three and four
     are just as possible, and a name that only fits the common case quietly
     becomes wrong the day it does not. */
  {
    /* One block per branch. With one set of rulers there is one branch and
       this prints exactly what it always printed; with both, a body in
       Pisces walks once through Neptune and once through Jupiter, and the two
       walks can end in different places, so each is shown to its own end. */
    const one=b=>{
      let o=[p,...b.via].map(PN).join(' \u2192 ');
      if(b.loop){
        const cyc=b.loop.length===2?b.loop.map(PN).join(' \u2194 ')
          :[...b.loop,b.loop[0]].map(PN).join(' \u2192 ');
        o+=`<br><span class="dim">${t('sfCycle')}: ${cyc}<br>${t('sfNoFinal')}</span>`;
      }else if(b.terminal){
        o+=`<br><span class="dim">${t('sfFinal')}: ${PN(b.terminal)}</span>`;
      }
      return o;
    };
    let body='';
    if(f.dispositor==null) body=`<span class="dim">${t('sfOwnSign')}</span>`;
    else if(f.branches.length===1) body=one(f.branches[0]);
    else{
      const g=dispositorGraph(F,p);
      body=g.rows.map(([x,ds])=>`${PN(x)} \u2192 ${ds.map(PN).join(', ')}`).join('<br>');
      const tail=[];
      if(g.ends.length) tail.push(`${t(g.ends.length>1?'sfFinals':'sfFinal')}: ${g.ends.map(PN).join(', ')}`);
      if(g.loops.length) tail.push(`${t(g.loops.length>1?'sfCycles':'sfCycle')}: `
        +g.loops.map(l=>cycleText(l,' \u2192 ',' \u2194 ')).join('; '));
      body+=`<br><span class="dim">${tail.join('<br>')}</span>`;
    }
    out.push([t('sfDispositor'),body]);
  }

  /* Houses ruled, and the theme each one is carried into. The arrow is a
     shorthand; the title spells the same fact out in words, so that a reader
     who is not sure what it means never has to guess, and so the arrow cannot
     drift into meaning something the data does not say. */
  if(f.rulesHouses.length){
    const arrows=f.carries.map(c=>{
      const plain=t('carriesPlain').replace('{p}',PN(p)).replace('{from}',c.from).replace('{into}',c.into);
      return `<span class="dim" title="${plain}">${c.from} \u2192 ${c.into}</span>`;
    }).join(' · ');
    const hs2=f.rulesHouses.slice().sort((a,b)=>a-b);
    const head=housesRuled(hs2,'rulesOne','rulesMany');
    out.push([t('sfRules'),head+(arrows?' · '+arrows:'')]);
  }

  /* Who receives this body. Sorted by dignity and then by the giver's name so
     that two runs of the same chart cannot swap two lines. A reception that is
     answered back is marked, rather than repeated as a separate fact. */
  {
    const mine=F.receptions.filter(r=>r.to===p).slice().sort((a,b)=>
      (REC_ORDER[a.type]-REC_ORDER[b.type])||PN(a.from).localeCompare(PN(b.from)));
    const isMutual=(a,b)=>F.mutualReceptions.some(m=>
      (m.a===a&&m.b===b)||(m.a===b&&m.b===a));
    if(mine.length) out.push([t('sfReceptions'),mine.map(r=>
      `${PN(r.from)} ${t('sfReceives')} ${PNacc(p)} ${t(REC_KEY[r.type])}`
      +(isMutual(r.from,p)?` <span class="dim">(${t('sfMutual')})</span>`:'')).join('<br>')]);
  }

  {
    /* Which pairs this body stands on the midpoint of. Only this body's own,
       because the full list runs to thirty a chart and the card answers about
       one. */
    const mine=midpointHits(ch).filter(h=>h.body===p).slice(0,6);
    if(mine.length) out.push([t('sfMidpoints'),
      mine.map(h=>`${PN(h.a)}/${PN(h.b)} <span class="dim">${h.orb.toFixed(1)}°</span>`).join('<br>')]);
  }

  {
    const bits=[];
    if(f.angularity) bits.push(t(ANG_KEY[f.angularity]));
    if(f.sect.status!=='neutral') bits.push(t(f.sect.status==='inSect'?'sectIn':'sectContrary'));
    if(f.solar.condition) bits.push(t(SOL_KEY[f.solar.condition]));
    if(bits.length) out.push([t('sfPlacement'),bits.join(' · ')]);
  }
  return {f,lines:out};
}

/* Sign, house and dignity on one line. Shared for the same reason as above:
   the panel prints it in its own header, the sheet needs it per body. */
function structureHead(ch,p){
  const r=structureLines(ch,p); if(!r) return '';
  const f=r.f;
  const bits=[LX(SIGN_NAME)[f.sign], t('houseHead').replace('{n}',f.house)];
  if(f.dignity) bits.push(t(DIG_KEY[f.dignity])+(f.dignityAlso?', '+t(DIG_KEY[f.dignityAlso]).toLowerCase():''));
  return bits.join(' · ');
}

function structureBlock(ch,p){
  const r=structureLines(ch,p); if(!r) return '';
  return r.lines.map(([label,body])=>
    `<div class="sfact"><div class="lbl">${label}</div><div class="val">${body}</div></div>`).join('');
}

/* Filled on the way to paper, not on every render: nothing on screen reads it,
   and the browser's own print command bypasses the button entirely, so both
   doors lead here. */
/* The block is built when its fold is opened and after every recast, not on
   every render: nobody reads it on the way past, and it is the most expensive
   text the app produces. */
function fillExport(){
  const el=document.getElementById('exportText'); if(!el) return;
  const card=document.getElementById('exportCard');
  if(card&&!card.open) return;
  el.textContent=(typeof CURRENT!=='undefined'&&CURRENT)?chartExportText(CURRENT):'';
}
function fillPrintSheet(){
  const el=document.getElementById('printFacts'); if(!el) return;
  el.innerHTML=(typeof CURRENT!=='undefined'&&CURRENT)?printFactsSheet(CURRENT):'';
}
if(typeof window!=='undefined') window.addEventListener('beforeprint',fillPrintSheet);

/* ---------- one press to copy ----------
   navigator.clipboard needs a secure context, which https and capacitor://
   both are and file:// is not, so the textarea fallback is not decoration.
   The button reports what happened either way: a copy control that stays
   silent leaves you pressing it twice and still not knowing. */
async function copyText(txt,btn){
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      ok=document.execCommand('copy'); ta.remove();
    }catch(e2){}
  }
  if(btn){
    const was=btn.textContent;
    btn.textContent=ok?t('copied'):t('copyFail');
    btn.classList.toggle('done',ok);
    setTimeout(()=>{btn.textContent=was;btn.classList.remove('done');},1600);
  }
  return ok;
}
/* Delegated once, so any control marked data-copy works, including the ones
   rendered after this runs. The source is named by selector rather than by a
   closure, which is what lets a redrawn card keep its button. */
/* Named producers, not selectors. The detail panel is the one place where the
   rendered text IS the text - it is already one fact per line - so it is read
   from the DOM; everything else is generated. */
const COPY_SOURCES={
  export:()=>chartExportText(CURRENT),
  placements:()=>placementLines(CURRENT).join('\n'),
  aspects:()=>aspectLines(CURRENT).join('\n'),
  configurations:()=>configurationLines(CURRENT).join('\n'),
  midpoints:()=>midpointHits(CURRENT)
    .map(h=>`${PN(h.body)} = ${PN(h.a)}/${PN(h.b)}, ${t('orb')} ${h.orb.toFixed(2)}°`).join('\n'),
  /* Buttons are hidden for the read: "Copy" and "edit" are controls, and they
     ended up in the pasted text. innerText needs them hidden, not removed, to
     keep the line breaks it reads from the layout. */
  detail:()=>{ const el=document.getElementById('detail'), bs=[...el.querySelectorAll('button')];
    bs.forEach(b=>b.style.display='none');
    try{ return el.innerText; } finally{ bs.forEach(b=>b.style.display=''); } }
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]'); if(!b) return;
  const fn=COPY_SOURCES[b.getAttribute('data-copy')]; if(!fn) return;
  if(typeof CURRENT==='undefined'||!CURRENT) return;
  const txt=fn()||'';
  if(txt.trim()) copyText(txt,b);
});
const copyBtnHTML=(src,label)=>
  `<button type="button" class="copybtn noprint" data-copy="${src}">${label||t('copy')}</button>`;

/* ---------- midpoints ----------
   Not a list of 120 midpoints, which nobody reads, but the answer to the
   question the technique is actually used for: WHICH body sits on the midpoint
   of which pair. Ebertin's school reads a midpoint as occupied when a body
   stands on it, on its opposition or on either square, which is the same thing
   as being within orb on a 90-degree dial, so that is the test.

   The orb is narrow and separate from the aspect orbs, because a midpoint is a
   point rather than a body and the whole method depends on tightness: at three
   degrees every chart has a hundred of them and the technique says nothing. */
const MIDPOINT_ORB_KEY='astrarium_midorb';
let MIDPOINT_ORB=(()=>{const v=parseFloat(localStorage.getItem(MIDPOINT_ORB_KEY));
  return isFinite(v)&&v>0&&v<=5?v:1.5;})();
function midpointHits(ch){
  const src=WHEEL_BODIES.filter(p=>ch.pos[p]).concat(['ASC','MC']);
  const lonOf=p=>p==='ASC'?ch.asc:p==='MC'?ch.mc:ch.pos[p].lon;
  const out=[];
  for(let i=0;i<src.length;i++)for(let j=i+1;j<src.length;j++){
    const a=src[i], b=src[j];
    const m=rev(lonOf(a)+(((lonOf(b)-lonOf(a)+540)%360)-180)/2);
    src.forEach(p=>{
      if(p===a||p===b) return;
      const d=((lonOf(p)-m)%90+90)%90;
      const orb=Math.min(d,90-d);
      if(orb<=MIDPOINT_ORB) out.push({a,b,body:p,orb});
    });
  }
  return out.sort((x,y)=>x.orb-y.orb);
}

/* ---------- the whole chart as text ----------
   Everything the engine knows, in one block, meant to be copied and pasted
   into a language model. The reason it exists is a real complaint about how
   astrology is published online: sites give a page per element, so "Moon in
   Scorpio" is read on its own and comes out sounding far harsher than it is in
   a chart where its dispositor is well placed, where it is received, and where
   three other factors pull the other way. A reader then has to weigh the
   contradictions themselves, which is the hard part and the part nobody hands
   over. Giving a model the whole evidence set at once is what makes weighing
   possible at all.

   Plain words rather than the terse form parityDigest uses: that one is a
   contract between two builds and is read by a diff, this one is read by a
   model and by a person, and it should not need a key. In the app's language,
   like everything else.

   What it cannot do is force the model to weigh rather than list. The header
   asks for it, and asking is all a block of text can do. */
const MEAN_MOTION={Sun:0.9856,Moon:13.176,Mercury:1.383,Venus:1.602,Mars:0.524,
  Jupiter:0.0831,Saturn:0.0335,Uranus:0.0117,Neptune:0.006,Pluto:0.004,
  Chiron:0.0195,NNode:0.0529,SNode:0.0529,Lilith:0.1114,Selena:0.1408};
/* Stationary is a real and strong condition and it is the only thing the raw
   daily figure was carrying that the retrograde mark does not already say.
   A tenth of mean motion is roughly the couple of days either side of a
   station, which is when practice calls a body stationary. */
const isStationary=(p,spd)=>spd!=null&&MEAN_MOTION[p]!=null
  &&Math.abs(spd)<MEAN_MOTION[p]*0.1;

/* Applying or separating, from the two speeds rather than from a table: the
   same aspect is one or the other depending on where in its loop each body is.
   Absent when the chart was cast without speed. */
function aspectDirection(ch,a,b,asp){
  const sa=ch.pos[a]&&ch.pos[a].spd, sb=ch.pos[b]&&ch.pos[b].spd;
  if(sa==null||sb==null) return null;
  /* The sign of the orb's rate of change at this instant, not a comparison
     with the orb a step later. The step was 0.05 days, in which the Moon runs
     0.6 degrees and jumps clean over a 0.2-degree applying aspect, so the
     tightest applying aspects - the ones a reader looks at first - all came
     out "separating". The separation's rate is the difference of the speeds,
     with its sign turned when the shorter arc runs the other way round. */
  const diff=rev(ch.pos[b].lon-ch.pos[a].lon), arc=diff<=180?diff:360-diff;
  const arcRate=(diff<=180?1:-1)*(sb-sa);
  const orbRate=Math.sign(arc-asp.angle)*arcRate;
  return orbRate<0?'applying':'separating';
}

/* "house 5" / "houses 5, 7" in each language's own grammar: Russian wants the
   instrumental and an "и" before the last, the others a plain list. The
   templates carry it; the code only fills them. */
function housesRuled(hs,one,many){
  return hs.length===1 ? t(one).replace('{n}',hs[0])
    : t(many).replace('{list}',hs.slice(0,-1).join(', ')).replace('{last}',hs[hs.length-1]);
}
function chartExportText(ch){
  if(!ch) return '';
  const F=factsOf(ch);
  const S=n=>LX(SIGN_NAME)[n];
  const deg=lon=>{const d=rev(lon)%30;
    return `${Math.floor(d)}°${String(Math.floor((d-Math.floor(d))*60)).padStart(2,'0')}′`;};
  const place=lon=>`${deg(lon)} ${S(signOfLon(lon))}`;
  const L=[];

  const meta=document.getElementById('chartMeta');
  L.push(t('xChart').toUpperCase());
  if(meta&&meta.innerText.trim()) L.push(meta.innerText.trim());
  /* The house system is already in the meta line above; repeating it was the
     first thing a reader noticed. */
  L.push(t(F.sect.chart==='day'?'sheetDay':'sheetNight')
    +(F.intercepted.length?` · ${t('sheetIntercepted')}: ${F.intercepted.map(S).join(', ')}`:''));
  /* Which rulers the chains below were walked with. Without it a reader is
     handed "Neptune disposes the Sun" and cannot tell whether that is a claim
     about the chart or about the setting. */
  L.push(rulersLine(F));
  L.push('');

  L.push(t('xAngles'));
  L.push(`ASC ${place(ch.asc)}   MC ${place(ch.mc)}`);
  L.push(F.houses.map(h=>`${h.house} ${place(h.cuspLon)}`).join(' · '));
  L.push('');

  L.push(t('xPlacements'));
  L.push(...placementLines(ch));
  L.push('');

  const asps=findAspects(ch.pos).sort((a,b)=>a.orb-b.orb);
  L.push(t('xAspects')+` (${asps.length})`);
  L.push(...aspectLines(ch));
  L.push('');

  const mid=midpointHits(ch).slice(0,14);
  if(mid.length){
    /* The heading says the limit without using the word the data lines use:
       a test counts aspect lines by that word, and a heading that borrowed it
       made the count one too many. */
    L.push(t('xMidpoints')+` (${t('xMidNote').replace('{orb}',MIDPOINT_ORB)})`);
    mid.forEach(h=>L.push(`${PN(h.body)} = ${PN(h.a)}/${PN(h.b)}, ${t('orb')} ${h.orb.toFixed(2)}°`));
    L.push('');
  }

  const cfgL=configurationLines(ch);
  if(cfgL.length){ L.push(t('xConfigs')); L.push(...cfgL); L.push(''); }

  const bal=chartBalance(ch);
  L.push(t('xBalance'));
  L.push(ELEM_KEYS.map((k,i)=>`${t(k)} ${bal.el[i]}`).join(' · '));
  L.push(MODE_KEYS.map((k,i)=>`${t(k)} ${bal.mo[i]}`).join(' · '));
  L.push([['hemi_e',bal.hemi.e],['hemi_w',bal.hemi.w],['hemi_n',bal.hemi.n],['hemi_s',bal.hemi.s]]
    .map(([k,n])=>`${t(k)} ${n}`).join(' · '));
  L.push('');
  /* Names the scheme actually used. Until v3.12.1 this line said "classical"
     whatever the setting, so with modern rulers on - the default - the block
     opened with "Rulers: modern" and closed by contradicting it, and the model
     writing the reading was handed both. */
  L.push(t('rulersBy_'+F.rulers)+' '+t('xFooter'));
  return L.join('\n');
}

/* The three blocks that are worth copying on their own, each generated rather
   than scraped. Reading innerText off the rendered card was the first idea and
   it was wrong: the aspect grid's text form is "down ☉ ☽ ☿ ♀ ♂ ..." with no
   pairs and no aspects in it at all, and the positions list comes out one span
   per line. A control that copies something useless is worse than no control,
   so the grid has none and the reason is here rather than in a bug report. */
function placementLines(ch){
  const F=factsOf(ch);
  const S=n=>LX(SIGN_NAME)[n];
  const deg=lon=>{const d=rev(lon)%30;
    return `${Math.floor(d)}°${String(Math.floor((d-Math.floor(d))*60)).padStart(2,'0')}′`;};
  const place=lon=>`${deg(lon)} ${S(signOfLon(lon))}`;
  const L=[];
  WHEEL_BODIES.concat(FACT_POINTS).filter(p=>ch.pos[p]).forEach(p=>{
    const f=F.planets[p], b=ch.pos[p];
    const head=[`${PN(p)} ${place(b.lon)}`, t('houseNum').replace('{n}',f.house)];
    if(b.retro) head.push(t('retrograde'));
    if(isStationary(p,b.spd)) head.push(t('stationary'));
    if(f.dignity) head.push(t(DIG_KEY[f.dignity])+(f.dignityAlso?', '+t(DIG_KEY[f.dignityAlso]).toLowerCase():''));
    if(f.angularity) head.push(t(ANG_KEY[f.angularity]));
    if(f.sect.status!=='neutral') head.push(t(f.sect.status==='inSect'?'sectIn':'sectContrary'));
    if(f.solar.condition&&f.solar.condition!=='free') head.push(t(SOL_KEY[f.solar.condition]));
    L.push(head.join(', '));
    if(f.dispositor==null) L.push('  '+t('sfOwnSign'));
    else if(f.branches.length===1){
      const b=f.branches[0];
      let d='  '+t('sfDispositor').toLowerCase()+': '+[p,...b.via].map(PN).join(' -> ');

/* ---------- golden parity ----------
   One string that stands for the whole structural layer on a fixed set of
   charts. The web build and the store build must produce the same one, and if
   they do not, the wrapper has changed an answer rather than only the way it
   is delivered - which is a far more dangerous class of defect than anything
   visual, and invisible without this.

   Deliberately not a hash: when it differs you want to see WHERE, and a digest
   tells you only that it does. It is small enough to diff by eye. */
const PARITY_CHARTS=[
  [1985,3,20,6.5,3,55.7558,37.6173],        // the hand-checked one, with a cycle
  [1990,1,1,12,3,55.75,37.62],              // the ephemeris anchor
  [2000,1,1,0,0,0,0],                       // equator, prime meridian, midnight UT
  [1650,6,15,0,0,48.8566,2.3522],           // before the atlas, before ΔT is known
  [2001,6,21,23.75,2,69.6492,18.9553],      // above the polar circle, Placidus falls back
  [2200,3,1,0,0,-33.8688,151.2093]          // far future, southern hemisphere
];
/* Every ruler mode, classical first and in exactly the form it always had, so
   the lines that existed before the modes did are the proof that adding them
   changed nothing in the classical layer. The other two follow, each under a
   header line. */
function parityDigest(){
  /* Pinned to the settings parity.txt was generated with, and put back after.
     Without this the digest read whatever the person had chosen: on the Android
     emulator on 11 Oct 2026 asteroids had been switched on, Ceres appeared in the
     digest, and the probe reported a mismatch in a build that was correct. The
     test suite never saw it because it clears the settings before every run. */
  const keep={HSYS,LILMODE,HOUSE_3D,ASTEROIDS};
  HSYS='placidus'; LILMODE='mean'; HOUSE_3D=false; ASTEROIDS=false;
  try{
    return [parityFor('classical'),
      '== rulers:modern\n'+parityFor('modern'),
      '== rulers:both\n'+parityFor('both')].join('\n--\n');
  }finally{ ({HSYS,LILMODE,HOUSE_3D,ASTEROIDS}=keep); }
}
function parityFor(mode){
  const S=['Ari','Tau','Gem','Cnc','Leo','Vir','Lib','Sco','Sgr','Cap','Aqr','Psc'];
  return PARITY_CHARTS.map(a=>{
    const ch=computeChart(a[0],a[1],a[2],a[3],a[4],a[5],a[6],false);
    const F=chartFacts(ch,mode);
    const head=`${a[0]}-${a[1]}-${a[2]} ${ch.houses.system} ${F.sect.chart}`
      +` int:${F.intercepted.map(i=>S[i]).join('')||'-'}`
      +` term:${F.terminals.join('/')||'-'}`
      +` loop:${F.loops.map(l=>l.join('+')).join('/')||'-'}`;
    const bodies=WHEEL_BODIES.filter(p=>ch.pos[p]).map(p=>{
      const f=F.planets[p];
      return `${p} ${S[f.sign]}${Math.floor(rev(ch.pos[p].lon)%30)} h${f.house}`
        +` ${f.dignity||'-'} d:${mode==='both'&&f.dispositors.length>1?f.dispositors.join('|'):(f.dispositor||'self')}`
        +` r:${f.rulesHouses.join(',')||'-'} ${f.angularity} ${f.sect.status}`
        +` ${f.solar.condition||'-'}`;
    });
    const rec=F.receptions.map(r=>`${r.from}>${r.to}:${r.type[0]}`).sort().join(' ');
    return [head,...bodies,'rec '+(rec||'-')].join('\n');
  }).join('\n--\n');
}

/* ---------- returns ----------
   A return is the instant a body comes back to the degree it held at birth.
   Found by bisection rather than by a table: the app already casts a chart in
   a fifth of a millisecond, so forty passes cost less than drawing the wheel,
   and bisection cannot diverge the way a Newton step can when the body is near
   a station. The bracket is a window around the anniversary wide enough to
   contain exactly one crossing.

   Cast for the place the SLIDER is set to, not the birthplace, because that is

function returnChart(ch,ms,body){
  const target=ch.pos[body].lon;

    const dt=new Date(t);

     the first lunar return it found was the opposition, 180 degrees out. A

     asked that the return be near the requested date, which the next one was
     for the date they happened to use. Forwards remains as a fallback only. */
  let f=lonAt(ms).d;
  let lo=null,hi=null;
  for(let k=1;k<=60;k++){
    const t2=ms-k*step, f2=lonAt(t2).d;
    if(crossing(f2,f)){ lo=t2; hi=t2+step; break; }
    f=f2;
  }
  if(lo==null){
    f=lonAt(ms).d;
    for(let k=1;k<=60;k++){
      const t2=ms+k*step, f2=lonAt(t2).d;
      if(crossing(f,f2)){ lo=t2-step; hi=t2; break; }
      f=f2;
    }
  }
  if(lo==null) return null;
  let fl=lonAt(lo).d;
  for(let i=0;i<40;i++){
    const mid=(lo+hi)/2, fm=lonAt(mid).d;
    if((fl<=0)===(fm<=0)){ lo=mid; fl=fm; } else hi=mid;
  }
  const at=(lo+hi)/2, dt=new Date(at);
  /* Recast once at the moment found, with retrograde marked; the search
     itself does not need it. */
  const c=computeChart(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate(),
    dt.getUTCHours()+dt.getUTCMinutes()/60+(dt.getUTCSeconds()+dt.getUTCMilliseconds()/1000)/3600,0,
    RELOC?RELOC.lat:ch.geolat, RELOC?RELOC.lon:ch.geolon, 'retro');
  return {...c, returnMs:at, returnBody:body};
}

/* ---------- the composite ----------
   Midpoint composite: every body sits at the nearer midpoint of the two
   charts' positions, and the angles are the midpoint of the two sets. The
   nearer one matters - taking the plain average of two longitudes puts a pair
   straddling 0 Aries on the opposite side of the wheel from where both of them
   are, which is the classic way this is got wrong.

   The derived-space composite (a chart cast for the midpoint in time and
   place) is a different technique and not this one; it is named here so that
   nobody has to guess which is on offer. */
function compositeChart(ch){
  const p=partnerChart(ch); if(!p) return null;
  const mid=(a,b)=>{const m=rev(a+(((b-a+540)%360)-180)/2); return m;};
  const pos={};
  Object.keys(ch.pos).forEach(k=>{ if(p.pos[k]) pos[k]={lon:mid(ch.pos[k].lon,p.pos[k].lon)}; });
  const mc=mid(ch.mc,p.mc);
  const a=anglesFromMC(mc,(ch.geolat+p.geolat)/2,ch.ecl);
  return {...ch, pos, mc, asc:a.asc, ramc:a.ramc, houses:a.houses, composite:true};
}

function outerChart(ch,ms){ return ringChart(ch,ms,RING_MODE); }
/* Any ring's chart for any mode. It was outerChart reading RING_MODE directly,
   which is fine with one ring and wrong with two: the third ring would have
   been cast as whatever the first select said. */
function ringChart(ch,ms,mode){
  if(mode==='none') return null;
  if(mode==='synastry') return partnerChart(ch);
  if(mode==='composite') return compositeChart(ch);
  if(mode==='solar') return returnChart(ch,ms,'Sun');
  if(mode==='lunar') return returnChart(ch,ms,'Moon');
  if(mode==='transit') return transitChartAt(ch,ms);
  const pr=transitChartAt(ch,progressedMs(ch,ms));
  const arc=rev(pr.pos.Sun.lon-ch.pos.Sun.lon);
  const mc=rev(ch.mc+arc);
  const a=anglesFromMC(mc,ch.geolat,ch.ecl);

    return {...pr, mc, asc:a.asc, ramc:a.ramc, houses:a.houses, arc};

/* The orb cap for a pair across two rings. Three different jobs, three
   different caps. A transit is capped by how fast the body moves. A
   progression or a direction moves about a degree a year, so a six-degree orb
   would keep an aspect "active" for six years and the list would never
   change. Synastry is not moving at all: neither chart advances, so nothing
   needs narrowing and the orb you configured is the orb you get. A karmic
   point on EITHER side narrows it the same way it does in the natal chart -
   it said either side and checked only the receiving one, so a transiting
   node kept a 3.5 degree orb whatever the point orb was. The grid reads the
   same function, so the grid, the list and the wheel agree. */
function ringOrbCap(T,np){
  let cap=RING_MODE==='transit'?(SPEED_ORB[T]||1.5)+2:(STATIC_RING.includes(RING_MODE)?99:1);
  if(isAspectPoint(np)||isAspectPoint(T)) cap=Math.min(cap,POINT_ORB);

}
function aspectOrbs(ch,tp){
  const hits=[];

     without it in this list that event would never be reported. */
  const receivers=WHEEL_BODIES.concat(['ASC','MC'],ASPECT_POINTS);
  RING_MOVERS[RING_MODE].forEach(T=>{
    if(!tp[T]) return;
    receivers.forEach(np=>{
      const nlon=np==='ASC'?ch.asc:np==='MC'?ch.mc:(ch.pos[np]?ch.pos[np].lon:null);
      if(nlon==null)return;
      let diff=Math.abs(rev(tp[T].lon-nlon));if(diff>180)diff=360-diff;
      /* Three different jobs, three different caps. A transit is capped by how
         fast the body moves. A progression or a direction moves about a degree
         a year, so a six-degree orb would keep an aspect "active" for six years
         and the list would never change. Synastry is not moving at all: neither
         chart advances, so nothing needs narrowing and the orb you configured
         is the orb you get. */
      const cap=ringOrbCap(T,np);
      for(const asp of ASPECTS){const orb=Math.abs(diff-asp.angle),maxo=Math.min(asp.orb,cap);if(orb<=maxo){hits.push({tp:T,np,asp,orb,maxo});break;}}
    });

}
/* Applying or separating, decided by looking rather than by table: the same
   aspect is applying or separating depending on where in its retrograde loop
   the planet is, so the orb is simply measured again an hour later. An hour is
   long enough that the Moon's 33 arc-minutes dwarf any rounding and short
   enough that nothing changes aspect. */
/* It compared the orb now with the orb a step later. With a step of seven
   days for progressions and thirty for directions, an aspect whose exact
   moment fell inside the step came out "separating" days before it was
   exact, and one about to leave the orb lost its label. Now it is the sign of
   the deviation times the direction the separation itself is moving, which
   has no kink at the exact moment and needs nothing to still be in orb. */
function markApplying(ch,tp,tpLater,hits){
  /* Signed, not folded to 0-180: a folded separation bounces at 0 and 180, so
     a conjunction or opposition made exact inside the step still looked as if
     it were opening. The signed one runs straight through. */
  const sgn=(a,b)=>((a-b+540)%360)-180;
  hits.forEach(h=>{
    const nlon=h.np==='ASC'?ch.asc:h.np==='MC'?ch.mc:(ch.pos[h.np]?ch.pos[h.np].lon:null);

const SCRUB_UNITS=[['sec','u_sec'],['min','u_min'],['hour','u_hour'],['day','u_day'],

function addUnits(ms,n,unit){

     how old the person is and where that puts the ephemeris. */
  let sub = TR_TZ ? momText(TR_MS,TR_TZ)+' '+formatOffset(TR_TZ) : '';
  /* A return is a moment of its own, and which one is drawn has to be said:
     a lunar return changes every 27 days and the slider only picks the one in
     force. Its place too, since that is what the return is cast for. */
  if((RING_MODE==='solar'||RING_MODE==='lunar')&&TR_CHART&&TR_CHART.returnMs!=null){
    sub=`${t('ring_'+RING_MODE)} ${momText(TR_CHART.returnMs,0)} UT · ${fmtGeo(TR_CHART.geolat,TR_CHART.geolon)}`;
  }else if(RING_MODE!=='transit'&&BIRTH_MS!=null){
    const yrs=(TR_MS-BIRTH_MS)/86400000/TROPICAL_YEAR;
    sub=`${t('age')} ${yrs.toFixed(2)}`;
    if(RING_MODE==='progressed') sub+=` · ${t('progmoment')} ${momText(progressedMs(null,TR_MS),0).slice(0,10)}`;
    else if(TR_CHART&&TR_CHART.arc!=null) sub+=` · ${t('arc')} ${fmtOrb(TR_CHART.arc)}`;
  }
  document.getElementById('momLoc').textContent=sub;
}

function renderTransits(ch){
  const o=learn();
  const tr=outerChart(ch,TR_MS);
  TR_CHART=tr;
  /* Cast at the same moment as the middle ring, so dragging the slider moves
     both - progressed and transiting Moon walking together is the reason a
     tri-wheel exists. */
  TR3_CHART=tr&&triOn()?ringChart(ch,TR_MS,RING2_MODE):null;
  if(!tr){
    /* The list and the day line go too: with no partner chosen, or a return
       not found, the card's title already named the new mode while the last
       mode's transits stayed under it and read as synastry. */
    TR_HITS=[]; document.getElementById('transitlist').innerHTML=''; document.getElementById('daysyn').textContent='';
    drawWheel(ch,null); renderGrid(ch,null); renderConfigurations(ch); renderLearned(); return; }
  const stat=STATIC_RING.includes(RING_MODE);
  const syn=RING_MODE==='synastry';
  /* Swapped, the partner's chart supplies the frame and the houses, and the
     aspects run the other way. Only the wheel, the hit list and the grid
     follow the swap: the positions, the balance and the configurations are
     readings of a single chart, and that chart is yours whichever ring it is
     drawn in. */
  const swapped=syn&&RING_SWAP;
  const inner=swapped?tr:ch, outer=swapped?ch:tr;
  if(!stat||RING_MODE==='solar'||RING_MODE==='lunar') renderMoment();
  /* Outer-planet-to-outer-planet hits are dropped for transits because they
     are generational: everyone born that decade has them. In a progressed or
     directed chart they are personal again, since the arc is this person's. */
  let hits=aspectOrbs(inner,outer.pos)
    .filter(h=>RING_MODE!=='transit'
      ||!(['Uranus','Neptune','Pluto'].includes(h.tp)&&['Uranus','Neptune','Pluto'].includes(h.np)));
  /* Synastry is read both ways. The outer person's planets reach the inner
     person's angles and points above; the inner person's planets reaching the
     OUTER person's angles and points were missing, so "my Venus on your
     Ascendant" appeared only after the swap, and the same pair gave two
     different lists. They are added here, marked so the list can say whose
     angle it is. */
  if(syn){
    aspectOrbs(outer,inner.pos).filter(h=>h.np==='ASC'||h.np==='MC'||isAspectPoint(h.np))
      .forEach(h=>hits.push({...h,rev:true}));
  }
  /* A chart whose birth time is unknown is cast for noon, and its angles are
     the noon angles: nothing is reported against them. */
  hits=hits.filter(h=>!((h.np==='ASC'||h.np==='MC')&&(h.rev?outer:inner).timeUnknown));
  /* Applying and separating mean nothing in synastry: neither chart is going
     anywhere. Left unset so the label simply does not appear, rather than
     printed as "separating" because two identical orbs compared equal. */
  if(!stat) markApplying(ch,tr.pos,outerChart(ch,TR_MS+PROBE_MS[RING_MODE]).pos,hits);
  TR_HITS=hits;
  drawWheel(inner,outer);
  renderGrid(inner,outer);
  renderConfigurations(ch);
  /* Ranked by receiver rank times exactness. With the interpretation flag on,
     the private model multiplies that in; with it off the order is that rule
     and nothing else, which is why the personal-weight column disappears too. */
  const ranked=hits.map(h=>({h,w:FEATURES.interpretation?personalWeight(o,h)
    :(RECEIVER_RANK[h.np]||0.6)*Math.cos((h.orb/h.maxo)*Math.PI/2)**2}))
    .sort((a,b)=>b.w-a.w).slice(0,FEATURES.interpretation?4:8);
  const box=document.getElementById('transitlist');
  document.getElementById('daysyn').textContent=
    FEATURES.interpretation?daySynthesis(o,ranked):'';
  if(!ranked.length){box.innerHTML=`<p class="tiny">${t('notransits')}</p>`;renderLearned();return;}
  box.innerHTML=ranked.map(({h,w})=>{
    const s=sig(h), intensity=Math.cos((h.orb/h.maxo)*Math.PI/2)**2;
    const rated=o.obs.find(x=>x.sig===s&&Date.now()-x.t<86400000*3);
    const app=h.applying==null?'':`<span class="app">${t(h.applying?'applying':'separating')}</span>`;
    const prose=FEATURES.interpretation
      ? `<span style="margin-left:4px">${transitText(o,h)}</span>` : '';
    const weight=FEATURES.interpretation?` · ${t('weight')} ${w.toFixed(2)}`:'';
    const rating=FEATURES.interpretation?`${recall(o,s)}
      <div class="rate">
        <span class="tiny">${t('landq')}</span>
        <span class="stars" data-sig="${s}">${[1,2,3].map(n=>`<span data-r="${n}">${rated&&rated.r>=n?'<b>★</b>':'☆'}</span>`).join('')}</span>
        <span class="tiny" style="margin-left:8px">${t('felt')}</span>
        ${[['hard','−'],['neutral','·'],['easy','+']].map(([k,g])=>`<span class="chip val ${rated&&rated.val===k?'on':''}" data-sig="${s}" data-val="${k}">${g}</span>`).join('')}
        ${AREA_KEYS.map(a=>`<span class="chip area ${rated&&rated.area===a?'on':''}" data-sig="${s}" data-area="${a}">${LX(AREA_NAME)[a]}</span>`).join('')}
      </div>`:'';
    return `<div class="transit" data-sig="${s}">
      <div class="head"><span class="af" style="font-size:18px">${GLYPH[h.tp]}</span><span class="af" style="font-size:14px;color:var(--ink3)">${ASPECT_GLYPH[h.asp.name]}</span><span class="af" style="font-size:18px">${GLYPH[h.np]||''}</span>${prose}${app}</div>
      <div class="tiny">${PN(h.tp)} ${LX(ASPECT_NAME)[h.asp.name]} ${PN(h.np)}${h.rev?` (${escH(ringOwner(true))})`:''} · ${t('orb')} ${fmtOrb(h.orb)}${weight}</div>
      <div class="bar"><i style="width:${Math.round(intensity*100)}%"></i></div>
      ${rating}</div>`;
  }).join('');
  if(FEATURES.interpretation){
    box.querySelectorAll('.stars span[data-r]').forEach(st=>st.addEventListener('click',e=>rate(ranked,e.currentTarget.parentElement.dataset.sig,{r:+e.currentTarget.dataset.r})));
    box.querySelectorAll('.chip.val').forEach(c=>c.addEventListener('click',()=>rate(ranked,c.dataset.sig,{val:c.dataset.val})));
    box.querySelectorAll('.chip.area').forEach(c=>c.addEventListener('click',()=>rate(ranked,c.dataset.sig,{area:c.dataset.area})));
  }
  renderLearned();
}
/* Degrees and arc-minutes, not tenths of a degree: at a one-second step the
   whole point is to watch an orb close, and 0.1 degrees is six arc-minutes of
   nothing happening. */
function fmtOrb(o){
  const d=Math.floor(o), m=Math.round((o-d)*60);
  return m===60?`${d+1}°00'`:`${d}°${pad2(m)}'`;
}
function rate(hits,s,patch){
  const o=learn(),hit=hits.find(x=>sig(x.h)===s); if(!hit)return; const h=hit.h;
  let obs=o.obs.find(x=>x.sig===s&&Date.now()-x.t<86400000*3);
  if(!obs){obs={sig:s,t:Date.now(),tp:h.tp,np:h.np,asp:h.asp.name,r:null,val:null,area:null};o.obs.push(obs);}
  Object.assign(obs,patch); obs.t=Date.now();
  o.feat={};
  o.obs.forEach(x=>{
    const rv=x.r!=null?x.r:1.5, vv=x.val==='hard'?-1.5:x.val==='easy'?1.5:x.val==='neutral'?0:null;
    ['tp:'+x.tp,'np:'+x.np,'as:'+x.asp].forEach(k=>{const f=o.feat[k]=o.feat[k]||{rSum:0,rN:0,vSum:0,vN:0};if(x.r!=null){f.rSum+=rv;f.rN++;}if(vv!=null){f.vSum+=vv;f.vN++;}});
    if(x.area){const k='ar:'+x.area;o.feat[k]=o.feat[k]||{rSum:0,rN:0,vSum:0,vN:0};o.feat[k].rN++;}
  });
  saveLearn(o); renderTransits(CURRENT);
}

function renderPositions(ch){

  box.querySelectorAll('.planet-row.hit').forEach(r=>{

}

/* ---------- chart balance ----------
   Counts, and only counts. Which element is short is a fact about the chart;
   what a short element means about the person is not, so nothing here says it.
   Twelve bodies: the ten planets plus the Ascendant and Midheaven, each worth
   one. Weighting schemes exist (luminaries double, angles half) and every
   school has a different one, so this uses the only version that needs no
   defending. Hemispheres take the ten planets alone, the angles being the
   boundaries themselves. */
const ELEM_KEYS=['el_fire','el_earth','el_air','el_water'];
const MODE_KEYS=['mo_card','mo_fix','mo_mut'];
function chartBalance(ch){
  const el=[0,0,0,0], mo=[0,0,0], hemi={e:0,w:0,n:0,s:0};
  const bodies=BODIES.concat(['ASC','MC']);
  bodies.forEach(p=>{
    const lon=p==='ASC'?ch.asc:p==='MC'?ch.mc:(ch.pos[p]?ch.pos[p].lon:null);
    if(lon==null) return;
    const s=Math.floor(rev(lon)/30);
    el[s%4]++; mo[s%3]++;
  });
  BODIES.forEach(p=>{
    if(!ch.pos[p]) return;
    const h=bodyHouse(ch,p);
    if(h>=10||h<=3) hemi.e++; else hemi.w++;
    if(h<=6) hemi.n++; else hemi.s++;
  });
  return {el,mo,hemi,total:bodies.filter(p=>p==='ASC'||p==='MC'||ch.pos[p]).length};
}
function balBar(name,n,total,colour){
  const pct=total?Math.round(n/total*100):0;
  return `<div class="balrow"><span class="nm">${name}</span><span class="n">${n}</span>`
    +`<span class="bar"><i style="width:${pct}%;background:${colour}"></i></span></div>`;
}
function renderBalance(ch){
  const b=chartBalance(ch);
  const grp=(title,rows)=>`<div class="balgrp"><h3>${title}</h3>${rows}</div>`;
  let h='';
  h+=grp(t('elements'),
    ELEM_KEYS.map((k,i)=>balBar(t(k),b.el[i],b.total,ELEM_VAR[i])).join(''));
  h+=grp(t('modes'),
    MODE_KEYS.map((k,i)=>balBar(t(k),b.mo[i],b.total,'var(--accent)')).join(''));
  h+=grp(t('hemi'),
    [['hemi_e',b.hemi.e],['hemi_w',b.hemi.w],['hemi_n',b.hemi.n],['hemi_s',b.hemi.s]]
      .map(([k,n])=>balBar(t(k),n,BODIES.length,'var(--ink3)')).join(''));
  document.getElementById('balance').innerHTML=h;
  /* The summary line carries the tally so the card answers without opening. */
  document.getElementById('balBrief').textContent=
    ELEM_KEYS.map((k,i)=>`${t(k)} ${b.el[i]}`).join(' · ');
}

      <span class="g af" style="color:${ASPECT_COLOR[a.kind]}">${ASPECT_GLYPH[a.name]}</span>

    </div>`;
  }).join('');
  /* One number for the four karmic points, under the eleven aspects rather
     than beside each of them: the argument is never "how wide a trine to the
     node" but "how much weight the node gets at all", and eleven boxes would
     invite an answer nobody has. */
  box.insertAdjacentHTML('beforeend',
    `<div class="orbrow" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">
      <span class="g af" style="color:var(--ink3);grid-column:span 2">${GLYPH.NNode}${GLYPH.Lilith}</span>
      <span class="nm">${t('pointOrb')}</span>
      <span class="ang"></span>
      <input class="orb" type="number" min="0.1" max="10" step="0.5" value="${POINT_ORB}" data-pointorb aria-label="${t('pointOrb')}">
    </div>`);
  box.insertAdjacentHTML('beforeend',
    `<div class="orbrow">
      <span class="g af" style="color:var(--ink3);grid-column:span 2">/</span>
      <span class="nm">${t('midOrb')}</span>
      <span class="ang"></span>
      <input class="orb" type="number" min="0.1" max="5" step="0.5" value="${MIDPOINT_ORB}" data-midorb aria-label="${t('midOrb')}">
    </div>`);
  const mo2=box.querySelector('input[data-midorb]');
  mo2.addEventListener('change',()=>{
    const v=parseFloat(mo2.value);
    if(!isFinite(v)||v<=0||v>5){ mo2.value=MIDPOINT_ORB; return; }
    MIDPOINT_ORB=v; localStorage.setItem(MIDPOINT_ORB_KEY,String(v));
    redrawAspects(); fillExport(); if(ISO&&CURRENT) showDetail(ISO,CURRENT);
  });
  const po=box.querySelector('input[data-pointorb]');
  po.addEventListener('change',()=>{
    const v=parseFloat(po.value);
    if(!isFinite(v)||v<=0||v>10){ po.value=POINT_ORB; return; }
    POINT_ORB=v; localStorage.setItem(POINT_ORB_KEY,String(v));
    rebuildAspects(); redrawAspects();
  });
  box.querySelectorAll('input[data-orb-on]').forEach(el=>el.addEventListener('change',()=>{
    ORBS[el.dataset.orbOn].on=el.checked; saveOrbs(); rebuildAspects(); redrawAspects();
  }));
  box.querySelectorAll('input[data-orb]').forEach(el=>el.addEventListener('change',()=>{
    const v=parseFloat(el.value);
    /* Refused rather than clamped silently: a typed 40 is a mistake, and
       snapping it to 15 without saying so hides the mistake. */
    if(!isFinite(v)||v<=0||v>15){ el.value=ORBS[el.dataset.orb].orb; return; }
    ORBS[el.dataset.orb].orb=v; saveOrbs(); rebuildAspects(); redrawAspects();
  }));
  const on=ASPECT_DEFS.filter(a=>ORBS[a.name].on).length;
  document.getElementById('orbBrief').textContent=`${on} / ${ASPECT_DEFS.length} ${t('orbOn')}`;
}
function redrawAspects(){

  /* The text block too: it lists aspects, and an open export kept the list

  if(CURRENT){ renderTransits(CURRENT); fillExport(); if(ISO) showDetail(ISO,CURRENT); }
}
/* ---------- configurations ----------
   Bodies and the karmic points, and deliberately not the angles. The
   Ascendant and Midheaven sit roughly ninety degrees apart in a great many
   charts, so admitting them would manufacture a T-square out of the frame
   itself in half the library. The nodes take part, but their opposition to
   each other is never an aspect (nodePair), so a planet square the nodal
   axis does not become a T-square.

   Orbs are the configured ones. Many astrologers tighten orbs for patterns;
   doing that here would mean a chord drawn on the wheel and a pattern that
   denies it exists, and one source of truth is worth more than one convention.

   A yod needs the quincunx, which ships off. That is not a gap: with the
   aspect switched off the app is being told not to count it, and inventing an
   exception for patterns would make the switch a lie. */
/* Configurations take the same participants as the aspects do. A grand trine
   that quietly omits the node is not a smaller answer, it is a different one. */
const CONF_BODIES=WHEEL_BODIES.concat(ASPECT_POINTS);
const CONF_DEFS=['stellium','grandtrine','tsquare','grandcross','kite','yod','mystic'];
function findConfigurations(pos){
  const B=CONF_BODIES.filter(n=>pos[n]);
  const A={};                                     // A[a][b] = aspect name or null
  B.forEach(a=>{ A[a]={}; });
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){
    const h=nodePair(B[i],B[j])?null
      :aspectBetween(pos[B[i]].lon,pos[B[j]].lon,pairOrbCap(B[i],B[j]));
    A[B[i]][B[j]]=A[B[j]][B[i]]=h?h.asp.name:null;
  }
  const is=(a,b,n)=>A[a][b]===n;
  const out=[];
  const add=(kind,bodies)=>out.push({kind,bodies:bodies.slice()});

  /* Stellium: conjunctions chained, not all-to-all. Three bodies spread over
     sixteen degrees are a stellium even though the outer two are ten degrees
     past each other's orb, which is how the eye reads them and how the sign
     they share behaves. */
  const seen=new Set();
  B.forEach(a=>{
    if(seen.has(a)) return;
    const group=[a]; seen.add(a);
    for(let k=0;k<group.length;k++){
      B.forEach(b=>{ if(!seen.has(b)&&is(group[k],b,'conjunction')){ group.push(b); seen.add(b); } });
    }
    if(group.length>=3) add('stellium',group);
  });

  const tri=[], cross=[];
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++)for(let k=j+1;k<B.length;k++){
    const a=B[i],b=B[j],c=B[k];
    if(is(a,b,'trine')&&is(b,c,'trine')&&is(a,c,'trine')) tri.push([a,b,c]);
  }
  /* Kite first, so a grand trine that is part of one is not also listed alone:
     the kite is the larger true statement and the trine inside it is implied. */
  const kited=new Set();
  tri.forEach(([a,b,c])=>{
    B.forEach(d=>{
      if(d===a||d===b||d===c) return;
      const trio=[[a,b,c],[b,a,c],[c,a,b]];
      for(const [opp,s1,s2] of trio){
        if(is(d,opp,'opposition')&&is(d,s1,'sextile')&&is(d,s2,'sextile')){
          add('kite',[a,b,c,d]); kited.add([a,b,c].join('|')); return;
        }
      }
    });
  });
  tri.forEach(t=>{ if(!kited.has(t.join('|'))) add('grandtrine',t); });

  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++)for(let k=j+1;k<B.length;k++)
    for(let l=k+1;l<B.length;l++){
      const q=[B[i],B[j],B[k],B[l]];
      const pairs=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
      const kinds=pairs.map(([x,y])=>A[q[x]][q[y]]);
      const nOpp=kinds.filter(x=>x==='opposition').length;
      const nSq=kinds.filter(x=>x==='square').length;
      const nTri=kinds.filter(x=>x==='trine').length;
      const nSex=kinds.filter(x=>x==='sextile').length;
      if(nOpp===2&&nSq===4){ cross.push(q.join('|')); add('grandcross',q); }
      else if(nOpp===2&&nTri===2&&nSex===2) add('mystic',q);
    }

  /* A grand cross contains four T-squares. Reporting both is not more
     information, it is the same fact four times over plus the real one. */
  const inCross=new Set();
  cross.forEach(c=>{ const q=c.split('|');
    for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)for(let k=0;k<4;k++)
      if(k!==i&&k!==j) inCross.add([q[i],q[j],q[k]].sort().join('|'));
  });
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){
    if(!is(B[i],B[j],'opposition')) continue;
    B.forEach(c=>{
      if(c===B[i]||c===B[j]) return;
      if(is(c,B[i],'square')&&is(c,B[j],'square')){
        if(inCross.has([B[i],B[j],c].sort().join('|'))) return;
        add('tsquare',[B[i],B[j],c]);              // apex last
      }
    });
  }
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){
    if(!is(B[i],B[j],'sextile')) continue;
    B.forEach(c=>{
      if(c===B[i]||c===B[j]) return;
      if(is(c,B[i],'quincunx')&&is(c,B[j],'quincunx')) add('yod',[B[i],B[j],c]);
    });
  }
  return out;
}

/* ---------- the aspect grid ----------
   Ten planets, Chiron, and the Ascendant and Midheaven. The nodes, Lilith and
   Selena are left out on purpose, and the limit is measured rather than
   guessed: on a 375 px phone the grid gets 349 px and a cell is 24 px, so
   fourteen columns (the corner plus thirteen bodies) come to 336 px and a
   fifteenth would overflow. Chiron takes the last free column; the four
   dropped are the four a grid is least often read for.

   Cells carry the mark alone. A mark plus an orb in a 24 px cell is two
   illegible things instead of one legible one, so the orb appears under the
   grid when a cell is tapped - which also gives the pair a name, since a grid
   is exactly the place where people lose track of which row they are on. */
const GRID_BODIES=WHEEL_BODIES.concat(ASPECT_POINTS,['ASC','MC']);
function gridLon(ch,n){ return n==='ASC'?ch.asc:n==='MC'?ch.mc:(ch.pos[n]?ch.pos[n].lon:null); }
function renderGrid(ch,tr){
  const box=document.getElementById('aspGrid'); if(!box) return;
  const cols=GRID_BODIES.filter(n=>gridLon(ch,n)!=null);
  const rows=tr ? WHEEL_BODIES.filter(n=>tr.pos[n])
      .concat(RING_MODE==='synastry'&&!tr.timeUnknown?['ASC','MC']:[]) : cols;
  const cell=(content,cls,data)=>`<div class="gc ${cls||''}"${data||''}>${content}</div>`;
  let html='', n=0;
  /* Header row of column glyphs, and a corner that names which chart the
     columns belong to when there are two. */
  html+=cell(tr?'<span class="tiny">'+t('gridInner')+'</span>':'','corner');
  cols.forEach(c=>html+=cell(`<span class="af">${GLYPH[c]}</span>`,'hd'));
  rows.forEach((r,ri)=>{
    html+=cell(`<span class="af">${GLYPH[r]}</span>`,'hd rw');
    cols.forEach((c,ci)=>{
      /* Without an outer ring the grid is a triangle: the upper half would
         repeat the lower half and the diagonal is a body against itself. */
      if(!tr&&ci>=ri){ html+=cell('', ci===ri?'self':'blank'); return; }
      const a=gridLon(tr||ch,r), b=gridLon(ch,c);
      if(a==null||b==null||(!tr&&nodePair(r,c))){ html+=cell('','blank'); return; }
      /* The same orb rules as the wheel and the list: the node opposition is
         a definition, points take the point orb, and across rings the ring's
         own cap. The grid used the bare aspect orbs and showed aspects that
         were nowhere else in the app. */
      const hit=aspectBetween(a,b,tr?ringOrbCap(r,c):pairOrbCap(r,c));
      if(!hit){ html+=cell('','empty'); return; }
      n++;
      html+=cell(`<span class="af" style="color:${hit.asp.color}">${ASPECT_GLYPH[hit.asp.name]}</span>`,
        'on', ` data-r="${r}" data-c="${c}" data-a="${hit.asp.name}" data-o="${hit.orb.toFixed(2)}" role="button" tabindex="0"`);
    });
  });
  box.style.setProperty('--gcols',cols.length+1);
  box.innerHTML=html;
  const pick=document.getElementById('gridPick');
  pick.textContent='';
  const say=el=>{
    const who=tr?`${PN(el.dataset.r)} (${t(RING_MODE==='synastry'?'gridOuterSyn':'gridOuter')}) - ${PN(el.dataset.c)}`
      :`${PN(el.dataset.r)} - ${PN(el.dataset.c)}`;
    pick.textContent=`${who} · ${LX(ASPECT_NAME)[el.dataset.a]} · ${t('orb')} ${fmtOrb(+el.dataset.o)}`;
    box.querySelectorAll('.gc.hot').forEach(x=>x.classList.remove('hot'));
    el.classList.add('hot');
  };
  box.querySelectorAll('.gc.on').forEach(el=>{
    el.addEventListener('click',()=>say(el));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); say(el); } });
  });
  document.getElementById('gridBrief').textContent=`${n} ${pluralOf(n,PLURAL_ASPECT)}`;
}
/* Which configuration is lit on the wheel, as an array of body names. Separate
   from ISO, which lights one body and its aspects: a figure is a set, and
   dimming everything outside it is the only way to see a grand cross as a
   shape rather than as four more chords. */
let CONF_ISO=null;
let CONF_CH=null;
function renderConfigurations(ch){
  const box=document.getElementById('confList'); if(!box) return;
  CONF_CH=ch;
  const found=findConfigurations(ch.pos);
  /* Biggest figures first, then by how tight they are: a grand cross outranks
     a T-square, and among equals the closer one is the one being asked about. */
  const rank={grandcross:0,kite:1,mystic:2,grandtrine:3,tsquare:4,yod:5,stellium:6};
  found.sort((a,b)=>(rank[a.kind]-rank[b.kind])||(b.bodies.length-a.bodies.length));
  if(!found.length){
    box.innerHTML=`<p class="tiny">${t('confNone')}</p>`;
    document.getElementById('confBrief').textContent='';
    CONF_ISO=null;
    return;
  }
  box.innerHTML=found.map((f,i)=>{
    const lit=CONF_ISO&&CONF_ISO.join('|')===f.bodies.join('|');
    return `<div class="confrow${lit?' on':''}" data-i="${i}" role="button" tabindex="0">
      <span class="nm">${t('conf_'+f.kind)}</span>
      <span class="who">${f.bodies.map(b=>`<span class="af">${GLYPH[b]}</span>`).join('')}</span>
      <span class="tiny names">${f.bodies.map(b=>PN(b)).join(', ')}</span>
    </div>`;
  }).join('');
  const go=el=>{
    const f=found[+el.dataset.i];
    const same=CONF_ISO&&CONF_ISO.join('|')===f.bodies.join('|');
    CONF_ISO=same?null:f.bodies.slice();
    ISO=null; LIT_RING=swappedSyn()?'outer':'inner';
    renderConfigurations(ch);
    redrawWheel();
    scrollChartIntoView();
  };
  box.querySelectorAll('.confrow').forEach(el=>{
    el.addEventListener('click',()=>go(el));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(el); } });
  });
  const counts={};
  found.forEach(f=>counts[f.kind]=(counts[f.kind]||0)+1);
  document.getElementById('confBrief').textContent=
    Object.entries(counts).map(([k,n])=>`${t('conf_'+k)}${n>1?' \u00d7'+n:''}`).join(' · ');
}
/* ---------- the app's own dropdown ----------
   A native select opens the platform's picker: a grey iOS wheel or a Windows
   listbox, in the system font, on the system background, ignoring everything
   the app looks like. Six of them sit in this app and each one was a hole in
   the middle of it.

   The <select> stays in the DOM as the source of truth - hidden, still
   focusable by label, still the thing every existing change handler listens
   to - and this draws a button and a listbox over it. Nothing downstream knows
   the difference, which is why all six could be converted at once rather than
   one at a time. A system applied halfway is worse than none. */
let DD_OPEN=null;
function closeDropdown(){
  if(!DD_OPEN) return;
  DD_OPEN.wrap.classList.remove('open');
  DD_OPEN.list.hidden=true;
  DD_OPEN.btn.setAttribute('aria-expanded','false');
  DD_OPEN=null;
}
document.addEventListener('click',e=>{ if(DD_OPEN&&!DD_OPEN.wrap.contains(e.target)) closeDropdown(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDropdown(); });
function upgradeSelect(sel){
  if(!sel||sel.dataset.dd) return;
  sel.dataset.dd='1';
  /* The wrapper inherits the select's classes, so every rule written for the
     old control keeps a handle on the new one instead of each call site
     needing a second selector. */
  const wrap=document.createElement('div');
  wrap.className=('dd '+(sel.className||'')).trim();
  const btn=document.createElement('button'); btn.type='button'; btn.className='ddbtn';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  const list=document.createElement('div'); list.className='ddlist'; list.hidden=true;
  list.setAttribute('role','listbox');
  sel.parentNode.insertBefore(wrap,sel);
  wrap.appendChild(sel); wrap.appendChild(btn); wrap.appendChild(list);
  sel.classList.add('ddnative');
  const paint=()=>{
    /* An option may carry a shorter label for the closed button; the list always
       shows the full one. */
    const o=sel.selectedOptions[0];
    btn.textContent=o?(o.dataset.short||o.textContent):'';
    /* A chip shows only the value, so the name of what it sets rides along as
       a tooltip. The labels are stored in capitals for the form; not here. */
    if(sel.title) btn.title=sel.title.charAt(0)+sel.title.slice(1).toLowerCase();
    list.innerHTML=[...sel.options].map((o,i)=>
      `<div class="ddopt${o.selected?' on':''}" role="option" data-i="${i}" tabindex="-1">${o.textContent}</div>`).join('');
    list.querySelectorAll('.ddopt').forEach(el=>{
      el.addEventListener('click',()=>{
        sel.selectedIndex=+el.dataset.i;
        sel.dispatchEvent(new Event('change',{bubbles:true}));
        closeDropdown(); paint(); btn.focus();
      });
      /* An open list is walked with the arrows and chosen with Enter, as a
         listbox is; Escape goes back to the button. */
      el.addEventListener('keydown',e=>{
        const opts=[...list.querySelectorAll('.ddopt')], i=opts.indexOf(el);
        const to=e.key==='ArrowDown'?Math.min(i+1,opts.length-1):e.key==='ArrowUp'?Math.max(i-1,0)
          :e.key==='Home'?0:e.key==='End'?opts.length-1:null;
        if(to!=null){ e.preventDefault(); opts[to].focus(); return; }
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); }
        else if(e.key==='Escape'){ e.preventDefault(); closeDropdown(); btn.focus(); }
      });
    });
  };
  /* Leaving with Tab closes it: the list used to hang over the form until a
     click somewhere else. */
  wrap.addEventListener('focusout',e=>{
    if(DD_OPEN&&DD_OPEN.wrap===wrap&&!wrap.contains(e.relatedTarget)) closeDropdown();
  });
  btn.addEventListener('click',()=>{
    const wasOpen=DD_OPEN&&DD_OPEN.wrap===wrap;
    closeDropdown();
    if(wasOpen) return;
    paint();
    list.hidden=false; wrap.classList.add('open'); btn.setAttribute('aria-expanded','true');
    DD_OPEN={wrap,list,btn};
    const on=list.querySelector('.ddopt.on'); if(on) on.scrollIntoView({block:'nearest'});
  });
  /* Arrow keys move the value without opening anything, which is what a native
     select does and what a keyboard user expects. */
  btn.addEventListener('keydown',e=>{
    const open=DD_OPEN&&DD_OPEN.wrap===wrap;
    if(open&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
      e.preventDefault(); (list.querySelector('.ddopt.on')||list.querySelector('.ddopt')).focus(); return;
    }
    const n=sel.options.length, i=sel.selectedIndex;
    /* Stops at the ends like a native select, rather than wrapping round. */
    const to=e.key==='ArrowDown'?Math.min(i+1,n-1):e.key==='ArrowUp'?Math.max(i-1,0)
      :e.key==='Home'?0:e.key==='End'?n-1:null;
    if(to==null) return;
    e.preventDefault();
    if(to===i) return;
    sel.selectedIndex=to;
    sel.dispatchEvent(new Event('change',{bubbles:true}));
    paint();
  });
  /* The app rebuilds these option lists whenever the language changes, so the
     button has to follow the select rather than remember what it drew. The
     observer catches anything that forgets to ask, but it fires on a
     microtask, so the repaint is also callable directly: code that rebuilds a
     list and reads the button in the same tick would otherwise see the old
     label, which is exactly what a test caught. */
  sel._ddPaint=paint;
  new MutationObserver(paint).observe(sel,{childList:true,subtree:true,attributes:true});
  sel.addEventListener('change',paint);
  paint();
}
function repaintDropdowns(){
  document.querySelectorAll('select[data-dd]').forEach(s=>{ if(s._ddPaint) s._ddPaint(); });
}
function upgradeAllSelects(){
  document.querySelectorAll('select').forEach(upgradeSelect);
}
/* When the full atlas lands, someone who started typing against the small seed
   should see their list upgraded. Only them: the field also has a value after a
   saved chart is restored, with nobody typing, and refreshing then opened the
   list on its own over the form at every launch - seen in the iOS build on
   10 Oct 2026, and in the web build all along. */

/* One row per place. Two places with the same name in the same country -

function cityRows(items){

}
