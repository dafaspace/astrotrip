function todayStr(){
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;
}
/* Weekday from the platform rather than a table of our own: Intl already has
   it in every language the app speaks, including Georgian. Built in UTC and
   read back in UTC so no local timezone can shift the day. */
function weekdayName(y,mo,d){
  try{
    const dt=new Date(0); dt.setUTCFullYear(y,mo-1,d); dt.setUTCHours(12,0,0,0);
    return new Intl.DateTimeFormat(LANG,{weekday:'short',timeZone:'UTC'}).format(dt);
  }catch(e){ return ''; }
}
let META_ARGS=null;
function renderChartMeta(ch,y,mo,da,hh,mi,tz){
  META_ARGS=[ch,y,mo,da,hh,mi,tz];
  const el=document.getElementById('chartMeta'); if(!el) return;
  const lt=document.getElementById('lilText');
  if(lt) lt.innerHTML=`<span class="af">${GLYPH.Lilith}</span> ${t(LILMODE==='true'?'m_true':'m_mean')}`;
  const name=(document.getElementById('chartName').value||'').trim();
  const city=(document.getElementById('city').value||'').trim();
  const hs=HOUSE_SYSTEMS[ch.houses.system];
  /* One line, and every abbreviation in it is there to keep it one line on a
     375px phone: no brackets round the offset, no minutes when the offset has
     none, and the date, weekday and time run together the way a printed chart
     writes them. */
  const off=utcLabel(tz);
  const line1=[
    `<b>${String(da).padStart(2,'0')}.${String(mo).padStart(2,'0')}.${y}</b>`
      +` ${weekdayName(y,mo,da)} <b>${pad2(hh)}:${pad2(mi)}</b> ${off}`,
    fmtGeo(ch.geolat,ch.geolon)+(RELOC?' '+t('relocMark'):'')
  ].filter(Boolean).join(' · ');
  /* "Geocentric" is dropped: it is the only thing this app computes, and a
     constant printed as though it were a setting is noise. "Tropical" stays -
     it changes how the chart is read, and a screenshot has to say which it is. */
  /* The Black Moon variant as its glyph plus one word. Spelling it out took a
     second line, and which of the two is in use has to be on the chart: they
     differ by up to a whole sign, so a screenshot without it is ambiguous. */
  const line2=[t('tropical'),(hs?LX(hs):ch.houses.system),
    `<span class="af">${GLYPH.Lilith}</span> ${t(LILMODE==='true'?'m_true':'m_mean')}`
  ].join(' · ');
  /* Name and place share a line. On their own they cost two lines of the
     phone screen the wheel and the slider are budgeted against, and the card
     then stopped fitting - which is the whole point of that budget. */
  /* A relocated chart names both places, and in the order it happened. A
     wheel that shows only the birth city while its houses belong to another
     one is a wrong chart to anyone reading it later. */
  /* With no birth city entered there is nothing to point an arrow away from,
     and "Relocation -> Berlin" reads as though the first word were a place. */
  const place=RELOC ? (city?`${escH(city)} \u2192 <b>${escH(RELOC.city)}</b>`:`<b>${escH(RELOC.city)}</b>`) : escH(city);
  let who=[name?`<b>${escH(name)}</b>`:'', place].filter(Boolean).join(' · ');
  /* In synastry the chart is about two people, so the header has to say both.
     A wheel that names only one of them is the wrong wheel to anyone reading
     it later. */
  if(RING_MODE==='synastry'){
    const pe=partnerEntry();
    if(pe) who=(who||t('natal'))+' &amp; <b>'+escH(partnerName(pe))+'</b>';
  }
  /* The third line is for paper. On screen the chips under it say the same
     thing and can be changed; printed, the chips are gone and this stays. */
  /* #2 of the review: outside its fit Pluto stands still, and a chart that
     draws it like any other body says nothing wrong. Now it says so. */
  const plutoOut=ch.d<dayNumber(1550,1,1,0)||ch.d>dayNumber(2250,1,1,0);
  el.innerHTML=[who, line1, plutoOut?`<span class="libwarn">${t('plutoEdge')}</span>`:''].filter(Boolean).map(x=>`<div>${x}</div>`).join('')
    +`<div class="printonly">${line2}</div><div class="printonly" id="printRing"></div>`;
}
/* What the outer rings are, on paper. The ring chips and the slider are not
   printed, so a sheet with two or three rings of glyphs said neither which
   technique they were nor for what moment, and could not be checked later.
   Filled when printing starts, because the slider moves after the chart is
   cast and this has to name the moment on the wheel, not the one at casting. */
function renderPrintRing(){
  const el=document.getElementById('printRing'); if(!el) return;
  if(!TR_CHART||RING_MODE==='none'){ el.textContent=''; return; }
  const modes=[RING_MODE].concat(TR3_CHART?[RING2_MODE]:[]).map(m=>t('ring_'+m));
  let when='';
  if(RING_MODE==='solar'||RING_MODE==='lunar'){ if(TR_CHART.returnMs!=null) when=momText(TR_CHART.returnMs,0)+' UT'; }
  else if(!STATIC_RING.includes(RING_MODE)||TR3_CHART) when=momText(TR_MS,0)+' UT';
  el.textContent=[modes.join(' + '),when].filter(Boolean).join(' · ');
}
function scrollChartIntoView(){
  const card=document.getElementById('chartCard'), hdr=document.querySelector('header');
  if(!card) return;
  const y=card.getBoundingClientRect().top+window.scrollY-(hdr?hdr.offsetHeight:0)-8;
  /* Instant, not smooth. A smooth scroll is an animation, and any scroll that
     arrives during it - including the layout settling as the wheel draws -
     cancels it, which left the page exactly where it started often enough to
     be the normal case. After pressing a button, arriving is better than
     gliding. */
  window.scrollTo(0,Math.max(0,y));
}
/* ---------- the form survives a restart ----------
   On the web a reload loses the chart, which is mildly annoying. In a store
   build it is a defect: iOS reclaims a backgrounded app whenever it likes, and
   coming back to an empty form after glancing at a message is the whole app
   forgetting what you were doing. Only the inputs are kept, never the computed
   chart - the engine is deterministic, so recasting is cheaper and safer than
   storing a result that a later version might compute differently. */
const FORM_KEY='astrarium_form';
const FORM_FIELDS=['date','time','city','chartName','lat','lng','tz'];
/* Two records, not one. The form as it stands is a draft and is written
   whenever the app goes to the background; the chart last CAST is written
   only when a chart is cast. A cold start used to cast whatever the draft
   held, so a date changed for the next client and left unfinished came back
   as a chart - new date, old time, old place, the old name on top - with the
   form closed and no way back to the chart that was on screen. Now the cast
   chart comes back, and an unfinished draft comes back in the open form. */
const CAST_KEY='astrarium_cast';
function formNow(){
  const o={};
  FORM_FIELDS.forEach(id=>{const e=document.getElementById(id); if(e) o[id]=e.value;});
  if(typeof SELECTED_CITY!=='undefined'&&SELECTED_CITY) o.__city=SELECTED_CITY;
  return o;
}
function saveForm(cast){
  try{
    const o=JSON.stringify(formNow());
    localStorage.setItem(FORM_KEY,o);
    if(cast===true) localStorage.setItem(CAST_KEY,o);
  }catch(e){}
}
function restoreForm(key){
  let o; try{ o=JSON.parse(localStorage.getItem(key||FORM_KEY)); }catch(e){ return false; }
  if(!o) return false;
  FORM_FIELDS.forEach(id=>{const e=document.getElementById(id);
    if(e&&o[id]!=null&&o[id]!=='') e.value=o[id];});
  if(o.__city&&typeof SELECTED_CITY!=='undefined') SELECTED_CITY=o.__city;
  syncSaveBtn(); renderGeoSum();
  return !!(o.date&&o.time);
}

function clearDetail(){
  const d=document.getElementById('detail'); d.className='detail empty'; d.textContent=t('tapdetail');
}
function run(){
  const dv=document.getElementById('date').value, tv=document.getElementById('time').value;
  /* Ranges too, not only presence: a latitude of 95 or an offset of +25 made a
     chart that looked like any other. */
  const geo=formGeo(), lat=geo?geo.lat:NaN, lng=geo?geo.lng:NaN, tz=geo?geo.tz:NaN;
  if(!dv||!tv||!geo){
    /* The coordinates are behind a line now, so a chart that fails on them has
       to show where they are, or the message names fields nobody can see. */
    if(dv&&tv) setGeoOpen(true);
    alert(t('needdata')); return false; }
  const [y,mo,da]=dv.split('-').map(Number);
  const [hh,mi]=tv.split(':').map(Number);
  /* Kept so the same moment can be recast at another place. Relocation is
     cleared on a new chart: carrying it over silently would put the next
     person's houses in a city they never mentioned. */
  CAST_ARGS={y,mo,da,hh,mi,tz,lat,lng};
  RELOC=null;
  CURRENT=computeChart(y,mo,da,hh+mi/60,tz,lat,lng); ISO=null; CONF_ISO=null; LIT_RING='inner';
  WZ={s:1,cx:C,cy:C};                     // a new chart starts with the whole wheel
  TR_TZ=tz;
  BIRTH_MS=utcMs(y,mo,da,0,0,0)+Math.round((hh+mi/60-tz)*3600000);
  document.getElementById('results').style.display='';
  document.getElementById('emptycard').style.display='none';
  document.getElementById('charttitle').textContent=chartTitle(CURRENT);
  renderPositions(CURRENT); renderBalance(CURRENT); renderChartMeta(CURRENT,y,mo,da,hh,mi,tz);
  fillExport();
  saveForm(true);
  renderRelocBrief();
  if(FEATURES.interpretation) document.getElementById('reading').innerHTML=natalReading(CURRENT);
  renderTransits(CURRENT);          // casts the transit ring and draws the wheel
  clearDetail();
  /* Land on the chart. Without this the wheel is cast below the fold and the
     first thing you see after pressing the button is the form you just filled
     in. The header is sticky and translucent, so the offset is measured rather
     than written down: it changes with the language and the window width. */
  scrollChartIntoView();
  syncSaveBtn();
  return true;
}
/* The house system is on its chip under the title, so the title names it only
   when the chart could not use the one asked for - Placidus and Koch beyond the
   polar circle, which fall back to equal houses. Then the two disagree on
   purpose, and the title is the one that is true. */
function chartTitle(ch){
  const sys=ch.houses.system, hs=HOUSE_SYSTEMS[sys];
  return sys===HSYS ? t('natal') : `${t('natal')} · ${hs?LX(hs):sys}`;
}
let CAST_ARGS=null, RELOC=null;
/* Recast the same instant at another place. Only the angles and the houses
   move: the planets are geocentric ecliptic longitudes and do not know where
   you are standing. The local time and the offset are passed through
   unchanged, which is what keeps the moment the same - the new city's own
   timezone is irrelevant, and getting that wrong is the usual way relocation
   is implemented badly. */
function applyRelocation(){
  const a=CAST_ARGS; if(!a) return;
  const lat=RELOC?RELOC.lat:a.lat, lng=RELOC?RELOC.lon:a.lng;
  CURRENT=computeChart(a.y,a.mo,a.da,a.hh+a.mi/60,a.tz,lat,lng);
  ISO=null; CONF_ISO=null; LIT_RING='inner';
  document.getElementById('charttitle').textContent=chartTitle(CURRENT);
  renderPositions(CURRENT); renderBalance(CURRENT);
  renderChartMeta(CURRENT,a.y,a.mo,a.da,a.hh,a.mi,a.tz);
  renderTransits(CURRENT);
  renderRelocBrief();
}
function renderRelocBrief(){
  const el=document.getElementById('relocBrief'); if(!el) return;
  el.textContent=RELOC?RELOC.city:t('relocOff');
}
/* Birth moment in UTC ms, so the scrubber can jump back to it. Held apart from
   the chart because a chart is positions and a moment is a clock reading. */
let BIRTH_MS=null;
/* A cast from the button puts the form away; a recast from a chip or the
   language does not, because whoever opened the form is still in it.
   A new chart replaces the one on screen, which may be a client's chart typed
   in a minute ago and never saved, so the one before is offered back. Only when
   it was a different moment or place: a recast of the same chart under a new
   name replaces nothing. */
let LAST_CAST=null;
const sameCast=(a,b)=>['date','time','lat','lng','tz'].every(k=>a.o[k]===b.o[k]);
document.getElementById('calc').addEventListener('click',()=>{
  const prev=CURRENT&&LAST_CAST?LAST_CAST:null;

});

/* Theme: the system decides until the switch is touched, the stored choice
   after that. The media-based theme-color tags cannot see a manual override,
   so they are rewritten here to keep the browser chrome in step. */
function applyTheme(){
  const stored=localStorage.getItem('astrarium_theme');
  const dark=stored?stored==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.querySelectorAll('#themeSw button').forEach(b=>
    b.classList.toggle('on',b.dataset.themeSet===(dark?'dark':'light')));
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.remove());
  const m=document.createElement('meta');
  m.name='theme-color'; m.content=dark?'#100f17':'#f9f7f3';
  document.head.appendChild(m);
}
document.getElementById('themeSw').addEventListener('click',e=>{
  const b=e.target.closest('button[data-theme-set]'); if(!b)return;
  localStorage.setItem('astrarium_theme',b.dataset.themeSet); applyTheme();
});
/* Only meaningful while nothing is stored, which is exactly when we follow it. */
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
  if(!localStorage.getItem('astrarium_theme')) applyTheme();
});

/* Chart library. Built-in entries are historical figures; saved charts are the
   user's own and live only in this browser. A chart with no known birth time is
   cast for noon and labelled, since its Ascendant, houses and Moon degree carry
   no information. */
const LKEY_CHARTS='astrarium_charts';
/* ---------- keeping the charts ----------
   localStorage is not a filing cabinet. A browser may evict it under pressure,
   "clear site data" takes it without a second dialog, and Safari discards it
   for a site nobody has opened in seven days. For an astrologer with a hundred
   clients in here that is not an inconvenience, it is the database gone.

   Three things, in the order they matter. Ask the browser to make the storage
   persistent, which is the only real defence and costs two lines. Record when
   the library was last exported, and say so where the library is, loudly once
   it has drifted. And keep the export working, which it already does.

   What is deliberately NOT done: syncing to a server. That would mean an
   account, a backend and somebody else holding the charts, and the whole point
   of this app is that nothing leaves the device. */
const LKEY_EXPORTED='astrarium_exported';
/* A function and not the NATIVE const, which is declared at the very end of the
   script: this runs during start-up, before that line, and reading a const there
   throws. Capacitor injects window.Capacitor before the page's scripts run. */
function inStoreShell(){
  const C=typeof window!=='undefined'&&window.Capacitor;
  return !!(C&&(C.isNativePlatform?C.isNativePlatform():true));
}
let STORAGE_PERSISTED=null;
function askPersistence(){
  if(!navigator.storage||!navigator.storage.persist) return;
  navigator.storage.persisted().then(p=>{
    STORAGE_PERSISTED=p;
    if(!p) navigator.storage.persist().then(ok=>{STORAGE_PERSISTED=ok; renderBackupLine();});
    else renderBackupLine();
  }).catch(()=>{});
}
function markExported(){ localStorage.setItem(LKEY_EXPORTED,String(Date.now())); renderBackupLine(); }
function renderBackupLine(){
  const el=document.getElementById('backupLine'); if(!el) return;
  const n=savedCharts().length;
  if(!n){ el.textContent=''; el.className='tiny'; return; }
  const last=parseInt(localStorage.getItem(LKEY_EXPORTED)||'0',10);
  const days=last?Math.floor((Date.now()-last)/86400000):null;
  const bits=[];
  const shell=inStoreShell();
  if(days==null) bits.push(t(shell?'bkNeverNative':'bkNever'));
  else bits.push(days===0?t('bkToday'):t('bkLast').replace('{d}',days+' '+pluralOf(days,PLURAL_DAY)));
  if(shell){ if(days!=null) bits.push(t('bkRiskNative')); }
  else if(STORAGE_PERSISTED===false) bits.push(t('bkNotPersisted'));
  el.textContent=bits.join(' · ');
  /* Loud only when it is actually at risk: never exported, or a month stale. */
  el.className='tiny'+((days==null||days>30||(!shell&&STORAGE_PERSISTED===false))?' libwarn':'');
}
function savedCharts(){ try{ return JSON.parse(localStorage.getItem(LKEY_CHARTS))||[] }catch(e){ return [] } }
/* ---------- the saved charts, kept where iOS will not clear them ----------
   Capacitor's storage guide: "the OS will reclaim local storage from Web Views if
   a device is running low on space". The saved charts and their notes are the one
   thing here a person cannot get back, so in the store build every write is also
   made to the native store (Capacitor Preferences, i.e. UserDefaults), and at
   launch the newer of the two copies wins. Decided by Dafa on 10 Oct 2026, before
   the first release, because now there is nobody's data to migrate.

   localStorage stays the working copy, because every reader of the library reads
   it synchronously, and the native store is asynchronous. Both copies carry the
   time of the write, so a write that reached localStorage but not the native
   store before the app was killed is not undone by an older native copy. Settings
   are not mirrored: losing a theme is an annoyance, losing a chart is not. */
const LKEY_CHARTS_AT='astrarium_charts_at';
function nativePrefs(){
  const C=typeof window!=='undefined'&&window.Capacitor;
  return inStoreShell()&&C&&C.Plugins&&C.Plugins.Preferences||null;
}
/* Returns false when nothing was written. A full store used to throw out of
   here: an import then said "could not read that file" about a good file, and
   a save did nothing and said nothing. Now it says what happened, once. */
function writeCharts(list){
  const json=JSON.stringify(list), at=Date.now();
  try{
    localStorage.setItem(LKEY_CHARTS,json);
    localStorage.setItem(LKEY_CHARTS_AT,String(at));
  }catch(e){ toast(t('storageFull')); return false; }
  const P=nativePrefs();
  if(P) P.set({key:LKEY_CHARTS,value:JSON.stringify({at,charts:json})}).catch(()=>{});
  return true;
}
/* Returns true when it changed the working copy, so the library is drawn again. */
async function syncChartsWithNative(){
  const P=nativePrefs(); if(!P) return false;
  try{
    const r=await P.get({key:LKEY_CHARTS});
    const nat=r&&r.value?JSON.parse(r.value):null;
    const local=localStorage.getItem(LKEY_CHARTS);
    const localAt=parseInt(localStorage.getItem(LKEY_CHARTS_AT)||'0',10);
    if(!nat){                                   // nothing native yet: seed it
      if(local) await P.set({key:LKEY_CHARTS,value:JSON.stringify({at:localAt||Date.now(),charts:local})});
      return false;
    }
    if(local===null||nat.at>localAt){           // cleared by iOS, or behind
      if(nat.charts===local) return false;
      localStorage.setItem(LKEY_CHARTS,nat.charts);
      localStorage.setItem(LKEY_CHARTS_AT,String(nat.at));
      return true;
    }
    if(localAt>nat.at)                          // a write the native copy missed
      await P.set({key:LKEY_CHARTS,value:JSON.stringify({at:localAt,charts:local})});
  }catch(e){}
  return false;
}
function libRow(e,own){
  const nm=e._n!==undefined?e._n:(own?e.name:LX(e.name));
  const city=e._c!==undefined?e._c:(own?e.city:LX(e.city));
  const date=`${String(e.d).padStart(2,'0')}.${String(e.mo).padStart(2,'0')}.${e.y}`;
  const time=e.t==null
    ? `<span class="libwarn">${t('noTime')}</span>`
    : `<span class="libmeta">${String(Math.floor(e.t)).padStart(2,'0')}:${String(Math.round((e.t%1)*60)).padStart(2,'0')}</span>`
      + (e.rr==='AA'?` <span class="libwarn">${t('rrKnown')}</span>`:'');
  const del=own?`<button class="libdel" data-del="${escH(e.id)}">${t('delChart')}</button>`:'';
  const note=own?`<input class="libnote" data-note="${escH(e.id)}" value="${escH(e.note||'')}" placeholder="${t('chartNote')}">`:'';
  /* City is dropped when it repeats the name, which it does whenever a chart was
     saved without one and fell back to the city. */
  const place=(city&&city!==nm)?` · ${city}`:'';
  return `<div class="libitem" data-id="${escH(e.id)}" data-own="${own?1:0}" title="${own?'':escH(e.src||'')}"><span class="libname">${escH(nm)}</span><span class="libmeta">${escH(date)}${escH(place)}</span>${time}${del}</div>`
    +note;
}

   a single STR entry. */
/* Plural of "chart". Russian and Ukrainian take the three-way rule, the
   Romance and Germanic languages two, and Georgian keeps the singular after a
   numeral, so it needs only one form. */
const PLURAL={
  en:['chart','charts'], es:['carta','cartas'], fr:['carte','cartes'],
  ru:['карта','карты','карт'], de:['Chart','Charts'], it:['carta','carte'],
  uk:['карта','карти','карт'], ka:['რუკა']
};
/* Days, in the case each language's "ago" takes: German "vor" wants the
   dative plural, Georgian "წინ" the genitive. */
const PLURAL_DAY={
  en:['day','days'], es:['día','días'], fr:['jour','jours'],
  ru:['день','дня','дней'], de:['Tag','Tagen'], it:['giorno','giorni'],
  uk:['день','дні','днів'], ka:['დღის']
};
const PLURAL_ASPECT={
  en:['aspect','aspects'], es:['aspecto','aspectos'], fr:['aspect','aspects'],
  ru:['аспект','аспекта','аспектов'], de:['Aspekt','Aspekte'], it:['aspetto','aspetti'],
  uk:['аспект','аспекти','аспектів'], ka:['ასპექტი']
};
/* The rule is the language's, so the table is the argument: Russian and
   Ukrainian take three forms, the Romance and Germanic two, Georgian one. */
function pluralOf(n,table){
  const f=table[LANG]||table.en;
  if(f.length===1) return f[0];
  if(f.length===2) return f[n===1?0:1];
  const a=n%10, b=n%100;
  return a===1&&b!==11 ? f[0] : (a>=2&&a<=4&&(b<12||b>14) ? f[1] : f[2]);
}
function plural(n){ return pluralOf(n,PLURAL); }
function libCountText(n,total){
  /* "5 / 40 charts" rather than "5 of 40": the preposition would need a
     case rule in half these languages and carries nothing the slash does not. */
  return total!=null&&total!==n
    ? `${n} / ${total} ${plural(total)}`
    : `${n} ${plural(n)}`;
}

  return t(y<1880?'era1':y<1920?'era2':y<1950?'era3':'era4');

/* ---------- CSV exchange ----------
   A personal chart database is only yours if you can get it out. The format is
   deliberately the dullest possible: RFC 4180 CSV with a header row, one chart
   per line, times as HH:MM and offsets as +HH:MM, so it opens in any
   spreadsheet, survives editing by hand, and can be diffed. Only your own
   saved charts are exported; the built-in library is not yours to carry off.

   Reading is more forgiving than writing: the header decides the column order,
   so a file with the columns rearranged or with extra columns still loads. */
const LIB_CAP=2000;
/* 'note' is last on purpose: a reader that knows only the old nine columns
   ignores a tenth, while inserting it in the middle would shift every field
   after it for anyone with an older export open in a spreadsheet. */
const CSV_COLS=['name','date','time','utc_offset','latitude','longitude','city','rodden','source','note'];
const csvCell=v=>{ const s=v==null?'':String(v);
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
/* The separator is whatever the header line uses most. Excel writes ';' in
   every locale where the comma is the decimal mark - Russian, German, French,
   Italian - so a file round-tripped through it on such a machine was refused
   whole as "not a CSV". */
function csvSep(text){
  const head=text.slice(0,(text.indexOf('\n')+1||text.length+1)-1);
  const n=c=>head.split(c).length-1;
  return [',',';','\t'].reduce((a,b)=>n(b)>n(a)?b:a);
}
function csvParse(text){
  const rows=[]; let row=[], cell='', q=false;
  text=text.replace(/^﻿/,'');
  const sep=csvSep(text);
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length>1||r[0]!=='');
}
const hhmm=h=>{ const t=Math.round(h*60); return pad2(Math.floor(t/60)%24)+':'+pad2(((t%60)+60)%60); };
/* The byte-order mark is for Excel, which otherwise opens UTF-8 as the
   machine's old code page and turns every Cyrillic name into noise. Every
   other reader, ours included, skips it. */
function libToCsv(){
  const lines=['\ufeff'+CSV_COLS.join(',')];
  savedCharts().forEach(e=>lines.push([
    e.name, `${String(e.y).padStart(4,'0')}-${pad2(e.mo)}-${pad2(e.d)}`,
    e.t==null?'':hhmm(e.t), e.tz==null?'':formatOffset(e.tz),
    e.lat, e.lon, e.city||'', e.rr||'', e.src||'', e.note||''
  ].map(csvCell).join(',')));
  return lines.join('\r\n')+'\r\n';
}
/* Cells are read strictly. parseFloat took "55,7558" as 55 and "37W30" as
   +37, the time pattern ignored "PM", and an empty time became a known noon;
   each of those made a chart that looked right and was not. A cell this
   cannot read sends the row to the rejected count instead. */
function csvDate(s){
  let m=/^(-?\d{1,6})-(\d{1,2})-(\d{1,2})$/.exec(s), y, mo, d;
  if(m){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  /* Day first with dots is how Excel writes dates in Europe and Russia, and
     it is unambiguous. Slashes are not - 03/04 is March in New York and April
     in London - so they are refused rather than guessed. */
  else if((m=/^(\d{1,2})\.(\d{1,2})\.(-?\d{1,6})$/.exec(s))){ d=+m[1]; mo=+m[2]; y=+m[3]; }
  else return null;
  if(mo<1||mo>12||d<1||d>new Date(Date.UTC(2000,mo,0)).getUTCDate()) return null;
  if(mo===2&&d===29&&!(y%4===0&&(y%100!==0||y%400===0))) return null;
  return [y,mo,d];
}
function csvClock(s){
  if(s==='') return null;                        // no time: a chart cast for noon, and marked so
  const m=/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]\.?m\.?)?$/i.exec(s);
  if(!m) return NaN;
  let h=+m[1]; const mi=+m[2], se=+(m[3]||0);
  if(mi>59||se>59) return NaN;
  if(m[4]){ if(h<1||h>12) return NaN; h=h%12+(/^p/i.test(m[4])?12:0); }
  else if(h>23) return NaN;
  return h+mi/60+se/3600;
}
function csvCoord(s,max){
  let v;
  const m=/^(\d{1,3})\s*([NSEWnsew])\s*(\d{1,2})(?:['′]?\s*(\d{1,2}))?$/.exec(s);
  if(m){
    if(+m[3]>59||+(m[4]||0)>59) return NaN;
    v=(+m[1]+ +m[3]/60+ +(m[4]||0)/3600)*(/[SWsw]/.test(m[2])?-1:1);
  }else if(/^[+-]?\d{1,3}([.,]\d+)?$/.test(s)) v=parseFloat(s.replace(',','.'));
  else return NaN;
  return Math.abs(v)<=max?v:NaN;
}
function csvToLib(text){
  csvToLib.skipped=0; csvToLib.rejected=0; csvToLib.added=[];
  const rows=csvParse(text);
  if(rows.length<2) return 0;
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const at=n=>head.indexOf(n);
  if(at('date')===-1||at('latitude')===-1) return -1;
  const have=new Set(savedCharts().map(e=>`${e.name}|${e.y}-${e.mo}-${e.d}|${e.t}`));
  const list=savedCharts(); let n=0, skipped=0, rejected=0; const added=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const g=k=>{const j=at(k);return j===-1?'':(r[j]||'').trim();};
    const dt=csvDate(g('date')), t=csvClock(g('time'));
    const lat=csvCoord(g('latitude'),90), lon=csvCoord(g('longitude'),180);
    /* No offset, no chart. Without it the row opened at UTC: three hours out
       for Moscow, and nothing on screen to say so. */
    const tz=parseOffset(g('utc_offset'));
    if(!dt||Number.isNaN(t)||Number.isNaN(lat)||Number.isNaN(lon)||Number.isNaN(tz)){ rejected++; continue; }
    const key=`${g('name')}|${dt[0]}-${dt[1]}-${dt[2]}|${t}`;
    if(have.has(key)) continue;
    have.add(key);
    if(list.length>=LIB_CAP){ skipped++; continue; }
    const id='u'+Date.now()+'_'+n;
    list.unshift({id, name:g('name')||g('city')||g('date'),
      y:dt[0], mo:dt[1], d:dt[2], t, lat, lon,
      tz, city:g('city'), rr:g('rodden')||'', src:g('source')||'',
      note:g('note')||''});
    added.push(id); n++;
  }
  /* What is already in the library stays. A file larger than the room left is
     imported up to the limit and the rest is counted, not dropped in silence -
     before, the oldest saved charts fell off the bottom with no word. */
  csvToLib.skipped=skipped; csvToLib.rejected=rejected;
  if(n&&!writeCharts(list)) return -2;
  csvToLib.added=added;
  return n;
}
document.getElementById('expCsv').addEventListener('click',async()=>{
  /* In the store build <a download> does nothing: WKWebView ignores it. Measured
     on the iOS build, 10 Oct 2026 - the button produced no file anywhere in the
     app's container, and the line above it still said "last export: today". A
     backup that is recorded and not made is worse than none. The share sheet
     hands the file to Files, AirDrop or Mail, and only a share that completed
     counts as an export; a cancelled one records nothing. */
  /* Two paths, one per platform, because neither works on both. iOS goes
     through Web Share, which opens the sheet there; Capacitor's Share plugin
     wrote the file on iOS but opened no sheet. Android's WebView has no Web
     Share at all (Android 16, WebView 133: navigator.share undefined), so there
     the file is written to the app's cache by the Filesystem plugin and handed
     to the sheet by the Share plugin. Without either, the <a download> below
     wrote nothing on Android while the line above said "last export: today" -
     the fault the iOS build had first. */
  const fname=`astrotrip-charts-${todayStr()}.csv`;
  if(inStoreShell()&&navigator.share&&navigator.canShare&&
     navigator.canShare({files:[new File(['a'],'a.csv',{type:'text/csv'})]})){
    const file=new File([libToCsv()],fname,{type:'text/csv'});
    try{ await navigator.share({files:[file]}); markExported(); }catch(e){}
    return;
  }
  const CP=inStoreShell()&&window.Capacitor&&window.Capacitor.Plugins;
  if(CP&&CP.Filesystem&&CP.Share){
    try{
      const w=await CP.Filesystem.writeFile({path:fname,data:libToCsv(),directory:'CACHE',encoding:'utf8'});
      await CP.Share.share({title:fname,files:[w.uri]});
      markExported();                     // only a share that completed counts
    }catch(e){}
    return;
  }
  const blob=new Blob([libToCsv()],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`astrotrip-charts-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  markExported();
});

/* The file's text in, the library updated, the result said. Kept apart from
   the file picker so the same path can be run without one. */
function importCsvText(txt){
  const n=csvToLib(txt);
  if(n===-2) return n;                           // writeCharts has said why
  if(n<0){ toast(t('importBad')); return n; }
  if(n>0) track('csvIn');
  renderLibrary(); renderBackupLine();
  const sk=csvToLib.skipped||0, rj=csvToLib.rejected||0, added=new Set(csvToLib.added);
  const msg=t('importDone')+n
    +(sk?' · '+t('importSkipped').replace('{n}',sk).replace('{cap}',LIB_CAP):'')
    +(rj?' · '+t('importRejected').replace('{n}',rj):'');
  /* The wrong file imported is a hundred rows to delete one by one. The way
     back takes out exactly what the import put in: restoring the library as
     it was before also took out a chart saved, or a note written, in the
     seconds since. */
  toast(msg, t('undo'), n>0?()=>{
    writeCharts(savedCharts().filter(e=>!added.has(e.id))); renderLibrary(); renderBackupLine(); }:null);
  return n;
}

renderBackupLine();
if(savedCharts().length) askPersistence();
document.getElementById('exportCard').addEventListener('toggle',fillExport);

/* Last, after every control exists and the atlas hook is in place: put the
   form back and recast. Recast rather than restore a stored chart, because the
   engine is deterministic and a saved result would be a second version of the
   truth that a later build could disagree with. */
{
  const ao=document.getElementById('astOn'), st=document.getElementById('astState');
  if(ao){
    ao.checked=ASTEROIDS;
    const recast=()=>{ if(CURRENT&&typeof run==='function') run(); };
    if(ASTEROIDS){ st.textContent=t('asteroidsLoading');
      loadAsteroids().then(ok=>{ st.textContent=ok?'':t('asteroidsFailed');
        ao.checked=ASTEROIDS; recast(); }); }
    ao.addEventListener('change',()=>{
      ASTEROIDS=ao.checked; localStorage.setItem(AST_KEY,ASTEROIDS?'1':'0');
      if(!ASTEROIDS){ st.textContent=''; recast(); return; }
      st.textContent=t('asteroidsLoading');
      loadAsteroids().then(ok=>{ st.textContent=ok?'':t('asteroidsFailed');
        ao.checked=ASTEROIDS; recast(); });
    });
  }
  const h3=document.getElementById('house3d');
  if(h3){ h3.checked=HOUSE_3D;
    h3.addEventListener('change',()=>{
      HOUSE_3D=h3.checked;
      localStorage.setItem(HOUSE3D_KEY,HOUSE_3D?'1':'0');
      if(CURRENT){ CURRENT.__factsBy=null; renderPositions(CURRENT); renderBalance(CURRENT);
        renderTransits(CURRENT); fillExport(); if(ISO) showDetail(ISO,CURRENT); }
    }); }
}
/* ---------- the birth-data card ----------
   Open while there is no chart, out of the way once there is one. The chart's
   header already says who, when and where, so a folded summary of the form
   above it would have said the same thing twice. */
function renderGeoSum(){
  const el=document.getElementById('geoSum'); if(!el) return;
  const lat=parseFloat(formVal('lat')), lng=parseFloat(formVal('lng')), tz=parseOffset(formVal('tz'));
  el.textContent=isNaN(lat)||isNaN(lng) ? t('geoNone')
    : fmtGeo(lat,lng)+(isNaN(tz)?'':' · '+utcLabel(tz));
}
function setGeoOpen(open){
  const f=document.getElementById('geoFields'), b=document.getElementById('geoEdit');
  f.hidden=!open; b.setAttribute('aria-expanded',String(open)); b.textContent=t(open?'hide':'edit');
}
document.getElementById('geoEdit').addEventListener('click',()=>
  setGeoOpen(document.getElementById('geoFields').hidden));
/* What the form held when it was opened over a chart, so that closing it
   without casting puts the chart's own data back. Otherwise the bookmark on
   the chart would save half-edited fields under the chart's name. */
let FORM_SNAP=null;
function snapForm(){
  const o={}; FORM_FIELDS.forEach(id=>o[id]=formVal(id));
  return {o, city:SELECTED_CITY, auto:TZ_AUTO};
}
function setFormOpen(open){
  if(!CURRENT) open=true;                   // nothing cast yet: the form is the page
  const card=document.getElementById('formCard');
  if(open&&card.hidden) FORM_SNAP=snapForm();
  if(!open) FORM_SNAP=null;
  card.hidden=!open;
  document.getElementById('formClose').hidden=!(open&&CURRENT);
  document.getElementById('formEdit').hidden=open;
  document.getElementById('saveQuick').hidden=open;
  if(!open){ setGeoOpen(false); scrollChartIntoView(); }
}
document.getElementById('formEdit').addEventListener('click',()=>{
  setFormOpen(true);
  const hdr=document.querySelector('header'), card=document.getElementById('formCard');
  window.scrollTo(0,Math.max(0,card.getBoundingClientRect().top+window.scrollY-(hdr?hdr.offsetHeight:0)-8));
});
document.getElementById('formClose').addEventListener('click',()=>{
  const s=FORM_SNAP;
  if(s){ FORM_FIELDS.forEach(id=>{document.getElementById(id).value=s.o[id];});
    SELECTED_CITY=s.city; TZ_AUTO=s.auto; renderGeoSum(); syncSaveBtn(); }
  setFormOpen(false);
});

/* ---------- the way back ----------
   One line, one button, a few seconds. Only one at a time: a new one replaces
   the old, and its way back with it, which is what a person expects - the last
   thing done is the one being undone. */
let TOAST_T=null, TOAST_UNDO=null;
function toast(text,undoLabel,undo){
  const el=document.getElementById('toast'), b=document.getElementById('toastBtn');
  const host=document.querySelector('dialog.panel[open]')||document.body;
  if(el.parentNode!==host) host.appendChild(el);
  document.getElementById('toastText').textContent=text;
  TOAST_UNDO=undo||null;
  b.hidden=!undo; b.textContent=undo?undoLabel:'';
  el.hidden=false;
  clearTimeout(TOAST_T); TOAST_T=setTimeout(hideToast,undo?8000:4000);
}
function hideToast(){
  clearTimeout(TOAST_T); TOAST_UNDO=null;
  document.getElementById('toast').hidden=true;
}
document.getElementById('toastBtn').addEventListener('click',()=>{
  const u=TOAST_UNDO; hideToast(); if(u){ track('undo'); u(); }
});

/* ---------- panels ----------
   Each opens over the page and adds a history entry, so the Android back
   button, a browser's back and Escape all close it rather than leaving the app
   or the page. */
function openPanel(id,byPointer){
  const d=document.getElementById(id); if(!d||d.open) return;
  closeDropdown(); track('open:'+id);
  if(id==='setCard') renderReport();
  if(id==='libCard'){ renderLibrary(); renderBackupLine(); }
  if(typeof d.showModal==='function') d.showModal(); else d.setAttribute('open','');
  /* showModal focuses the first control, and WebKit draws its ring even after a
     tap: the close button opened outlined in the iOS build. Opened by a finger
     or a mouse, focus goes to the panel itself, which has no ring and still
     keeps Escape and the tab order inside. From the keyboard it stays put. */
  if(byPointer){ const pin=d.querySelector('.panelin'); if(pin) pin.focus({preventScroll:true}); }
  try{ history.pushState({panel:id},''); PANEL_PUSHED.add(id); }catch(e){}
}
/* The history entries this page itself added for its panels. A closing panel
   steps back only over one of these: history.state outlives a reload, so an
   entry marked with a panel by an earlier load made the next close step back
   off the page - the test suite, reloading its frame, kept landing on the
   previous page. */
const PANEL_PUSHED=new Set();
function closePanel(id){
  const d=document.getElementById(id); if(!d||!d.open) return;
  if(typeof d.close==='function') d.close(); else d.removeAttribute('open');
}
document.querySelectorAll('dialog.panel').forEach(d=>{
  d.addEventListener('close',()=>{
    closeDropdown();
    /* A way back offered inside the panel stays on screen after it closes. */
    const tst=document.getElementById('toast'); if(d.contains(tst)) document.body.appendChild(tst);
    if(PANEL_PUSHED.has(d.id)&&history.state&&history.state.panel===d.id){ PANEL_PUSHED.delete(d.id); history.back(); }
  });
  d.addEventListener('click',e=>{
    if(e.target===d||e.target.closest('[data-close]')) closePanel(d.id);
  });
});
addEventListener('popstate',()=>
  document.querySelectorAll('dialog.panel[open]').forEach(d=>{ PANEL_PUSHED.delete(d.id); closePanel(d.id); }));
/* Going back to close a panel must not also move the page. With the default
   'auto' the browser restores the scroll it saved when the panel opened, and it
   did, once: a jump to the planet card made while the settings were closing was
   undone a moment later. The page never navigates, so nothing is lost. */
if('scrollRestoration' in history) history.scrollRestoration='manual';
/* detail is 0 for a click made with Enter or Space, the click count otherwise. */
document.getElementById('libBtn').addEventListener('click',e=>openPanel('libCard',e.detail>0));
document.getElementById('setBtn').addEventListener('click',e=>openPanel('setCard',e.detail>0));
/* A link from elsewhere to one settings row: the panel opens there, and the
   row is marked for a moment so the eye lands on it. */
function openSettingsAt(id,byPointer){
  openPanel('setCard',byPointer);
  const ctl=document.getElementById(id), row=ctl&&ctl.closest('.setrow');
  if(!row) return;
  row.scrollIntoView({block:'center'});
  row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1400);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-open-set]'); if(!b) return;
  openSettingsAt(b.dataset.openSet,e.detail>0);
});
document.getElementById('accessApply').addEventListener('click',()=>{
  const inp=document.getElementById('accessCode');
  applyAccessKey(inp.value,true,false).then(ok=>{ if(ok) inp.value=''; });
});
/* A key arrives as a link (#key=...) or is already stored. The fragment stays in
   the address. 3.18.0 took it off at once, and then the access lived only in the
   browser that had opened the link: a tester who opened it inside Telegram and
   later reached the site from Safari had nothing, and had to be told which
   browser to use. Kept, the link, a bookmark and a home-screen icon all carry
   the key for its whole week, in any browser. Forwarding is no easier than
   forwarding the link itself. The opening line is said only for a key not seen
   before, so a reload does not announce it again. A link opened in a tab where
   the site is already open changes only the fragment and reloads nothing, so
   that change is listened for as well. */
/* A key in the address is weighed against the stored one, not put over it.
   A home-screen icon keeps the link it was made from, so a week later it
   arrives with last week's key while a newer one sits in storage: that used
   to say "not valid" and close the paid part, or, while the old key still
   ran, overwrite the newer one. The later of the two valid keys wins, and a
   stale link over a good stored key says nothing at all. */
function keyFromAddress(){
  const m=/^#key=([A-Za-z0-9_-]+)$/.exec(location.hash); if(!m) return false;
  let saved=null; try{ saved=localStorage.getItem(ACCESS_KEY); }catch(e){}
  if(!saved||saved===m[1]){ applyAccessKey(m[1],saved!==m[1],true); return true; }
  Promise.all([verifyAccessKey(m[1]),verifyAccessKey(saved)]).then(([link,kept])=>{
    if(kept>Date.now()&&kept>=link) applyAccessKey(saved,false,true);
    else applyAccessKey(m[1],true,true);
  });
  return true;
}
addEventListener('hashchange',keyFromAddress);
if(!keyFromAddress()){
  let saved=null; try{ saved=localStorage.getItem(ACCESS_KEY); }catch(e){}
  if(saved) applyAccessKey(saved,false,true);
}
renderAccess();

/* ---------- the tester's report ----------
   Dafa, 14 Oct 2026: every person given a key should leave behind what they used.
   Not by sending anything on its own: the app promises, in its footer and on
   dafaspace.com, that nothing leaves the phone, and an astrologer's charts are
   other people's names and birth dates. So the counting stays on the device -
   which parts were opened and how often, minutes of use, settings touched, never
   a name, a date or a place - and only while a key is open or in a test build.
   The person sees the whole report under Settings and sends it with a button, to
   wherever they choose. A recorder of every tap was considered and refused: with
   five testers a conversation tells more, and a click log is exactly the data
   that would need a privacy policy and a server. */
const USAGE_KEY='astrarium_usage';
const reporting=()=>ACCESS_UNTIL>Date.now()||inStoreShell();
function loadUsage(){ try{ return JSON.parse(localStorage.getItem(USAGE_KEY))||null; }catch(e){ return null; } }
function track(name){
  if(!reporting()) return;
  const u=loadUsage()||{v:1,since:Date.now(),days:[],min:0,ev:{}};
  u.ev[name]=(u.ev[name]||0)+1;
  const d=todayStr(); if(!u.days.includes(d)) u.days.push(d);
  try{ localStorage.setItem(USAGE_KEY,JSON.stringify(u)); }catch(e){}
}
/* Minutes in front of the app: a minute counts when the page is visible and was
   touched within the last two, so a tab left open overnight is not a night of use. */
let LAST_ACT=0;
addEventListener('pointerdown',()=>{LAST_ACT=Date.now();},true);
addEventListener('keydown',()=>{LAST_ACT=Date.now();},true);
setInterval(()=>{
  if(!reporting()||document.visibilityState!=='visible'||Date.now()-LAST_ACT>120000) return;
  const u=loadUsage()||{v:1,since:Date.now(),days:[],min:0,ev:{}};
  u.min++; const d=todayStr(); if(!u.days.includes(d)) u.days.push(d);
  try{ localStorage.setItem(USAGE_KEY,JSON.stringify(u)); }catch(e){}
},60000);
/* One listener per kind of action, in the capture phase so a handler that stops
   propagation (the library's delete) is still counted. */
const CLICK_EVENTS={calc:'cast',saveChart:'save',printBtn:'print',expCsv:'csvOut',formEdit:'edit',
  momNow:'scrub',momBirth:'scrub',stepBack:'scrub',stepFwd:'scrub',playBtn:'scrub',wzReset:'zoom'};
document.addEventListener('click',e=>{
  const el=e.target.closest('button,.libitem,#wheel,.planet-row'); if(!el) return;
  if(el.id&&CLICK_EVENTS[el.id]) return track(CLICK_EVENTS[el.id]);
  if(el.matches('[data-del]')) return track('delete');
  if(el.matches('[data-copy]')) return track('copy');
  if(el.matches('[data-theme-set]')) return track('set:theme');
  if(el.matches('.libitem')) return track('library');
  if(el.matches('#wheel,.planet-row')) return track('planet');
},true);
const CHANGE_EVENTS={hsys:'set:hsys',hsysSet:'set:hsys',lilmode:'set:lilmode',rulerSel:'set:rulerSel',
  astOn:'set:astOn',house3d:'set:house3d',showSeconds:'set:showSeconds',wheelLabels:'set:wheelLabels',langSel:'set:langSel',
  scrub:'scrub',transitDate:'scrub',transitTime:'scrub'};
document.addEventListener('change',e=>{
  const el=e.target; if(!el) return;
  if(el.id==='ringSel') return track('ring:'+el.value);
  if(CHANGE_EVENTS[el.id]) return track(CHANGE_EVENTS[el.id]);
  if(el.closest&&el.closest('#orbList')) return track('set:orbs');
},true);
const OPEN_CARDS=['positionsCard','relocCard','confCard','gridCard','exportCard','balCard','orbCard','aboutCard'];
document.addEventListener('toggle',e=>{
  const el=e.target; if(el&&el.open&&OPEN_CARDS.includes(el.id)) track('open:'+el.id);
},true);
const OPEN_LABEL={positionsCard:'positions',relocCard:'reloc',confCard:'conf',gridCard:'grid',
  exportCard:'exportTitle',balCard:'balance',orbCard:'aspects',aboutCard:'aboutTitle',libCard:'libShort',setCard:'settings'};
const SET_LABEL={hsys:()=>t('setHsys'),lilmode:()=>t('setLil'),rulerSel:()=>t('setRulers'),orbs:()=>t('aspects'),
  astOn:()=>t('asteroids').split(':')[0],house3d:()=>t('house3d').split('(')[0].trim(),
  showSeconds:()=>t('secondsLabel'),wheelLabels:()=>t('wheelLabels'),langSel:()=>t('langLabel'),theme:()=>t('themeLabel')};
function devicePlatform(){
  const C=window.Capacitor;
  if(inStoreShell()&&C&&C.getPlatform) return C.getPlatform()+' app';
  const ua=navigator.userAgent||'';
  return (/iPhone|iPad|iPod/.test(ua)?'iOS':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'other')+' web';
}
function buildReport(){
  const u=loadUsage()||{since:Date.now(),days:[],min:0,ev:{}}, ev=u.ev, n=k=>ev[k]||0;
  const list=pairs=>pairs.length?pairs.map(([l,c])=>l+' '+c).join(', '):t('rpNone');
  const ringLabel=v=>v.split('+').map(m=>t('ring_'+m)).join(' + ');
  const rings=Object.keys(ev).filter(k=>k.startsWith('ring:')).sort((a,b)=>ev[b]-ev[a])
    .map(k=>[ringLabel(k.slice(5)),ev[k]]);
  const opens=Object.keys(ev).filter(k=>k.startsWith('open:')&&OPEN_LABEL[k.slice(5)]).sort((a,b)=>ev[b]-ev[a])
    .map(k=>[t(OPEN_LABEL[k.slice(5)]),ev[k]]);
  const sets=Object.keys(ev).filter(k=>k.startsWith('set:')&&SET_LABEL[k.slice(4)]).sort((a,b)=>ev[b]-ev[a])
    .map(k=>[SET_LABEL[k.slice(4)](),ev[k]]);
  return [
    `AstroTrip ${APP_VERSION} · ${t('reportTitle')}`,
    `${t('rpPeriod')}: ${fmtDay(u.since)} - ${fmtDay(Date.now())} · ${t('rpDays')}: ${u.days.length} · ${t('rpMinutes')}: ${u.min}`,
    `${t('rpCast')}: ${n('cast')} (${t('rpFromLib')}: ${n('library')}) · ${t('rpSaved')}: ${n('save')} · ${t('rpDeleted')}: ${n('delete')}`,
    `${t('rpTypes')}: ${list(rings)}`,
    `${t('rpOpened')}: ${list(opens)}`,
    `${t('rpPlanet')}: ${n('planet')} · ${t('rpScrub')}: ${n('scrub')} · ${t('printBtn')}: ${n('print')} · ${t('exportCsv')}: ${n('csvOut')} · ${t('importCsv')}: ${n('csvIn')} · ${t('rpCopy')}: ${n('copy')} · ${t('rpEdit')}: ${n('edit')} · ${t('rpUndo')}: ${n('undo')}`,
    `${t('rpSettings')}: ${list(sets)}`,
    `${t('rpDevice')}: ${devicePlatform()} · ${LANG} · ${screen.width}×${screen.height}`,
    t('rpPrivacy')
  ].join('\n');
}
function renderReport(){
  const sec=document.getElementById('reportSec'); if(!sec) return;
  sec.hidden=!reporting();
  if(!sec.hidden) document.getElementById('reportText').textContent=buildReport();
}
document.getElementById('reportFold').addEventListener('toggle',renderReport);
/* Out through the share sheet where there is one - iOS and Android browsers, the
   iOS app - through the Share plugin in the Android app, and otherwise copied,
   for pasting into a message. A cancelled share is left alone. */
document.getElementById('reportSend').addEventListener('click',async e=>{
  const text=buildReport(), btn=e.currentTarget;
  try{
    if(navigator.share){ await navigator.share({text}); return; }
    const CP=inStoreShell()&&window.Capacitor&&window.Capacitor.Plugins;
    if(CP&&CP.Share){ await CP.Share.share({text}); return; }
  }catch(err){
    if(err&&(err.name==='AbortError'||/cancel/i.test(err.message||''))) return;
  }
  if(await copyText(text,btn)) toast(t('reportCopied'));
});
renderReport();
/* An "i" opens the note that follows its row. One handler for all of them. */
document.addEventListener('click',e=>{
  const b=e.target.closest('button.info'); if(!b) return;
  const row=b.closest('.setrow'), note=row&&row.nextElementSibling;
  if(!note||!note.classList.contains('setnote')) return;
  note.hidden=!note.hidden; b.setAttribute('aria-expanded',String(!note.hidden));
});
renderGeoSum(); setGeoOpen(false);

function restoreSession(){
  let cast=null, draft=null;
  try{ cast=localStorage.getItem(CAST_KEY); draft=localStorage.getItem(FORM_KEY); }catch(e){}
  if(restoreForm(cast?CAST_KEY:FORM_KEY)&&run()){
    setFormOpen(false); LAST_CAST=snapForm();
    /* An edit that was never cast goes back into the form, open, over the
       chart it was being made from. Taken from the copy read above: run()
       has just written the cast chart over the stored draft. */
    if(cast&&draft&&draft!==cast){
      try{ localStorage.setItem(FORM_KEY,draft); }catch(e){}
      if(restoreForm(FORM_KEY)) setFormOpen(true);
    }
  }
  else setFormOpen(true);
}
restoreSession();
/* iOS does not reload the page when the app returns from the background, so
   nothing else would write the form back; and when it does reclaim the app,
   the last thing written is what comes back. */
addEventListener('pagehide',saveForm);
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveForm(); });

/* Offline shell. Registered after load so it never competes with first paint,
   and failures stay silent: the app works fine without it, it just loses
   offline. Needs https or localhost, so it is inert on file:// */
/* The service worker is how the web build works offline. Inside the store
   build it is how the app would get a SECOND copy of itself: Capacitor already
   serves every asset from the signed bundle, and a worker on top of that keeps
   its own cache which can outlive an update and start answering with the
   previous version's files. One shipped bundle, one source of truth. */
const NATIVE = typeof window!=='undefined' && !!(window.Capacitor && window.Capacitor.isNativePlatform
  ? window.Capacitor.isNativePlatform() : window.Capacitor);
if('serviceWorker' in navigator && !NATIVE){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
/* A worker registered by an earlier web visit does not disappear on its own,
   and a bundled build that finds one would be served its own old files. This
   only ever runs inside the store build. */
if(NATIVE && 'serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  if(window.caches) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
}
if(NATIVE) document.documentElement.classList.add('native');
/* In the store build the page itself does not zoom; the wheel has its own zoom.
   An app page that zooms as a whole is not how anything on iOS behaves, and in
   the simulator on 10 Oct 2026 it zoomed by accident with no way back. WKWebView
   in an app honours user-scalable, unlike Safari, which ignores it on purpose -
   so the web build keeps page zoom for whoever needs it. */
function lockedViewport(c){ return /user-scalable/.test(c)?c:c+', maximum-scale=1, user-scalable=no'; }
if(NATIVE){ const vm=document.querySelector('meta[name=viewport]'); if(vm) vm.content=lockedViewport(vm.content); }
</script>
